<style>
  :root{
    --bg:#f6f5ee; --card:#ffffff; --ink:#2f3d33; --ink-soft:#5b6a5f;
    --accent:#7c9473; --accent-deep:#4c6350; --gold:#e0a458; --line:#e7e3d5;
    --blue:#6a8caf; --water:#6fa3c9; --shadow:0 10px 30px rgba(0,0,0,0.10);
    --font-head:'Cairo',sans-serif; --font-body:'Tajawal',sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{ margin:0; background:var(--bg); font-family:var(--font-body); color:var(--ink); padding:0 0 60px; min-height:100vh; }
  .wrap{max-width:760px; margin:0 auto; padding:0 14px;}
  .hidden{display:none !important;}
  h1,h2,h3{font-family:var(--font-head);}
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  /* ---- onboarding (name + style only) ---- */
  .ob-overlay{ position:fixed; inset:0; z-index:100; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:20px; overflow-y:auto; }
  .ob-card{ background:var(--card); border-radius:22px; max-width:440px; width:100%; padding:24px 22px; box-shadow:var(--shadow); animation:fadeUp .4s ease; margin:auto; }
  .ob-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .ob-progress{ display:flex; gap:5px; }
  .ob-dot{ width:7px; height:7px; border-radius:50%; background:var(--line); }
  .ob-dot.active{ background:var(--accent-deep); width:20px; border-radius:5px; }
  .lang-toggle{ font-family:var(--font-head); font-weight:700; font-size:0.75rem; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); border-radius:999px; padding:5px 12px; cursor:pointer; }
  .ob-step{display:none;} .ob-step.active{display:block; animation:fadeUp .3s ease;}
  .ob-card h2{ color:var(--accent-deep); font-size:1.15rem; text-align:center; margin:0 0 6px; }
  .ob-card p.sub{ text-align:center; color:var(--ink-soft); font-size:0.83rem; margin:0 0 16px; }
  .ob-input{ width:100%; border:1.5px solid var(--line); border-radius:14px; padding:13px 16px; font-family:var(--font-body); font-size:1rem; background:var(--bg); color:var(--ink); text-align:center; margin-bottom:16px; }
  .ob-input:focus{ outline:none; border-color:var(--accent-deep); }
  .ob-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .ob-choice{ border:1.5px solid var(--line); border-radius:14px; padding:14px 8px; text-align:center; cursor:pointer; font-family:var(--font-head); font-weight:700; font-size:0.82rem; background:var(--bg); transition:all .15s ease; color:var(--ink); }
  .ob-choice .ic{ font-size:1.5rem; display:block; margin-bottom:5px; }
  .ob-choice.selected{ border-color:var(--accent-deep); background:var(--card); box-shadow:var(--shadow); outline:2px solid var(--accent-deep); }
  .ob-btn{ width:100%; font-family:var(--font-head); font-weight:800; font-size:0.95rem; background:var(--accent-deep); color:#fff; border:none; border-radius:14px; padding:13px; cursor:pointer; }
  .ob-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .ob-btn.secondary{ background:transparent; color:var(--ink-soft); font-weight:700; margin-top:8px; font-size:0.8rem; }
  .val-msg{ color:#c0392b; font-size:0.76rem; text-align:center; margin-bottom:10px; min-height:15px; }

  /* ---- topnav ---- */
  .topnav{ position:sticky; top:0; z-index:40; backdrop-filter:blur(10px); background:color-mix(in srgb, var(--bg) 85%, transparent); border-bottom:1px solid var(--line); padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top)); }
  .topnav-inner{ max-width:760px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .brand{ font-family:var(--font-head); font-weight:800; color:var(--accent-deep); font-size:0.9rem; }
  .nav-actions{ display:flex; gap:6px; }
  .icon-btn{ width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--card); cursor:pointer; font-size:0.9rem; display:flex; align-items:center; justify-content:center; color:var(--ink); }

  /* ---- home ---- */
  .hero{ text-align:center; padding:22px 0 8px; animation:fadeUp .5s ease; }
  .hero h1{ font-weight:800; font-size:1.3rem; color:var(--accent-deep); margin:0 0 6px; }
  .hero p{ margin:0; color:var(--ink-soft); font-size:0.85rem; }
  .day-badge{ display:inline-block; margin-top:12px; font-family:var(--font-head); font-weight:800; background:var(--accent-deep); color:#fff; padding:8px 18px; border-radius:999px; font-size:0.86rem; box-shadow:var(--shadow); }
  .home-cards{ display:grid; grid-template-columns:1fr; gap:12px; margin-top:22px; }
  @media(min-width:520px){ .home-cards{grid-template-columns:repeat(3,1fr);} }
  .home-card{ background:var(--card); border:1px solid var(--line); border-radius:20px; padding:24px 16px; text-align:center; cursor:pointer; transition:transform .15s ease; box-shadow:var(--shadow); }
  .home-card:hover{ transform:translateY(-4px); }
  .home-card .ic{ font-size:2.2rem; display:block; margin-bottom:8px; }
  .home-card .ttl{ font-family:var(--font-head); font-weight:800; color:var(--accent-deep); font-size:1rem; }
  .home-card .dsc{ font-size:0.75rem; color:var(--ink-soft); margin-top:4px; }

  .back-row{ margin:14px 0 4px; display:flex; justify-content:space-between; align-items:center; }
  .back-btn{ font-family:var(--font-head); font-weight:700; font-size:0.8rem; background:var(--card); border:1px solid var(--line); color:var(--ink-soft); border-radius:999px; padding:7px 16px; cursor:pointer; }
  .edit-btn{ font-family:var(--font-head); font-weight:700; font-size:0.75rem; background:none; border:none; color:var(--ink-soft); text-decoration:underline; cursor:pointer; }

  section.panel{ display:none; padding-top:6px; } section.panel.active{ display:block; animation:fadeUp .3s ease; }

  .setup-card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px 16px; box-shadow:var(--shadow); margin-bottom:16px; }
  .setup-card h3{ color:var(--accent-deep); font-size:1rem; margin:0 0 4px; }
  .setup-card p.sub{ color:var(--ink-soft); font-size:0.8rem; margin:0 0 14px; }
  .setup-btn{ width:100%; font-family:var(--font-head); font-weight:800; font-size:0.9rem; background:var(--accent-deep); color:#fff; border:none; border-radius:12px; padding:12px; cursor:pointer; margin-top:6px; }
  .setup-input{ width:100%; border:1px solid var(--line); border-radius:12px; padding:10px 14px; font-family:var(--font-body); font-size:0.88rem; background:var(--bg); color:var(--ink); margin-bottom:12px; }
  .setup-row{ display:flex; gap:10px; margin-bottom:12px; }
  .setup-row > *{ flex:1; }
  .tag-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .tag-chip{ background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:0.78rem; display:flex; align-items:center; gap:6px; color:var(--ink); }
  .commit-chip .pin-btn{ opacity:0; transition:opacity 0.15s; background:none; border:none; cursor:pointer; font-size:0.85rem; padding:2px; }
  .commit-chip:hover .pin-btn, .commit-chip .pin-btn.pinned-visible{ opacity:1; }
  .tag-chip button{ border:none; background:none; color:var(--ink-soft); cursor:pointer; font-size:0.85rem; padding:0; line-height:1; }
  .tag-add-row{ display:flex; gap:8px; margin-bottom:12px; }
  .tag-add-row input{ flex:1; margin-bottom:0; }
  .tag-add-row button{ flex:0 0 auto; width:auto; padding:0 16px; margin-top:0; border-radius:12px; }

  .legend{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:14px 0 16px; font-size:0.76rem; color:var(--ink-soft); }
  .legend span{ background:var(--card); border:1px solid var(--line); padding:4px 10px; border-radius:999px; }

  .log-card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:18px; box-shadow:var(--shadow); }
  .log-card h3{ color:var(--accent-deep); font-size:0.95rem; margin:0 0 10px; }
  .log-form{ display:flex; gap:8px; margin-bottom:12px; }
  .log-form input{ flex:1; border:1px solid var(--line); border-radius:12px; padding:9px 12px; font-family:var(--font-body); font-size:0.88rem; background:var(--bg); color:var(--ink); }
  .log-form button{ font-family:var(--font-head); font-weight:700; font-size:0.85rem; background:var(--accent-deep); color:#fff; border:none; border-radius:12px; padding:9px 18px; cursor:pointer; }
  .chart-box{ background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:10px; margin-bottom:12px; }
  .log-list{ display:flex; flex-direction:column; gap:6px; max-height:140px; overflow-y:auto; }
  .log-row{ display:flex; justify-content:space-between; align-items:center; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:7px 12px; font-size:0.82rem; }
  .log-row .kg{ font-weight:800; color:var(--accent-deep); font-family:var(--font-head); }
  .log-row .diff{ font-size:0.72rem; font-weight:700; }
  .log-row .diff.up{ color:#5a8a5f; } .log-row .diff.down{ color:#c15b4a; }
  .log-empty{ text-align:center; color:var(--ink-soft); font-size:0.8rem; padding:10px 0; }

  .week-cards{ display:flex; flex-wrap:wrap; justify-content:center; gap:12px; overflow-x:auto; padding:8px 4px 16px; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
  .week-card{ flex:0 0 108px; scroll-snap-align:center; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px 10px; text-align:center; cursor:pointer; box-shadow:var(--shadow); transition:transform .15s ease; font-family:var(--font-head); }
  .week-card:hover{ transform:translateY(-3px); }
  .week-card .wc-icon{ font-size:1.8rem; display:block; margin-bottom:8px; }
  .week-card .wc-day{ font-weight:800; color:var(--accent-deep); font-size:0.95rem; }
  .week-card.wc-today{ flex:0 0 128px; transform:scale(1.05); border-color:var(--accent-deep); outline:2px solid var(--accent-deep); outline-offset:2px; }
  .week-card.wc-special{ border-color:var(--gold); }
  .today-square{ background:var(--card); border:2px solid var(--accent-deep); border-radius:20px; padding:16px; box-shadow:var(--shadow); margin-bottom:14px; }
  .today-square-head{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .today-square-day{ font-family:var(--font-head); font-weight:800; color:var(--accent-deep); font-size:1.1rem; }
  .today-square-kcal{ font-family:var(--font-head); font-weight:700; color:var(--gold); font-size:0.85rem; }
  .meal-swap-btn{ border:none; background:none; cursor:pointer; font-size:1rem; padding:0; flex-shrink:0; }
  .meal-macro-line{ font-size:0.72rem; color:var(--ink-soft); margin-top:3px; font-variant-numeric:tabular-nums; }
  .color-swatch-grid{ display:flex; flex-wrap:wrap; gap:12px; }
  .color-swatch{ width:38px; height:38px; border-radius:50%; cursor:pointer; border:2px solid var(--line); position:relative; }
  .color-swatch.selected{ outline:2px solid var(--accent-deep); outline-offset:2px; }
  .color-swatch.selected::after{ content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; text-shadow:0 0 2px rgba(0,0,0,0.6); }
  .time-picker{ display:flex; gap:4px; }
  .time-picker select{ flex:1; min-width:0; border:1px solid var(--line); border-radius:10px; padding:8px 4px; font-family:var(--font-body); font-size:0.85rem; background:var(--bg); color:var(--ink); }
  .ex-table{ width:100%; border-collapse:collapse; font-size:0.82rem; margin-bottom:6px; }
  .ex-table th{ font-family:var(--font-head); font-weight:800; color:var(--accent-deep); text-align:start; padding:6px 4px; border-bottom:2px solid var(--line); }
  .ex-table td{ padding:7px 4px; border-bottom:1px solid var(--line); color:var(--ink); vertical-align:middle; }
  .ex-table tr.ex-done td{ opacity:0.55; text-decoration:line-through; }
  .ex-table input[type="checkbox"]{ width:18px; height:18px; }
  .grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  @media(max-width:480px){ .grid{grid-template-columns:repeat(4,1fr);} }
  .day-btn{ aspect-ratio:1; background:var(--card); border:1px solid var(--line); border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:transform .15s ease; font-family:var(--font-head); position:relative; padding:4px; }
  .day-btn:hover{ transform:translateY(-3px); box-shadow:var(--shadow); }
  .day-btn .num{ font-weight:800; font-size:0.82rem; color:var(--accent-deep); }
  .day-btn .preview{ font-size:0.78rem; margin-top:2px; }
  .day-btn.special{ border-color:var(--gold); }
  .day-btn.rest{ opacity:0.65; }
  .day-btn.today{ outline:2px solid var(--accent-deep); outline-offset:2px; }
  .day-btn.today::before{ content:attr(data-today-label); position:absolute; top:-9px; left:50%; transform:translateX(-50%); background:var(--accent-deep); color:#fff; font-size:0.55rem; padding:1px 6px; border-radius:999px; }

  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.45); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; backdrop-filter:blur(2px); }
  .overlay.open{ display:flex; }
  .card{ background:var(--card); border-radius:20px; max-width:430px; width:100%; max-height:88vh; overflow-y:auto; position:relative; box-shadow:0 20px 50px rgba(0,0,0,0.3); padding:26px 20px 22px; animation:popIn .2s ease; }
  @keyframes popIn{ from{opacity:0; transform:scale(.95);} to{opacity:1; transform:scale(1);} }
  .card h2{ text-align:center; color:var(--accent-deep); font-size:1.1rem; margin:6px 0 2px; }
  .card .subtitle{ text-align:center; color:var(--ink-soft); font-size:0.8rem; margin-bottom:14px; }
  .total-kcal{ text-align:center; border:1px solid var(--gold); border-radius:999px; padding:8px 16px; font-family:var(--font-head); font-weight:800; color:var(--gold); font-size:0.9rem; margin-bottom:14px; }
  .meal,.exercise{ background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:10px 14px; margin-bottom:10px; }
  .meal .label{ font-family:var(--font-head); font-weight:700; font-size:0.85rem; color:var(--accent-deep); margin-bottom:3px; display:flex; justify-content:space-between; }
  .meal .label .kcal{ font-size:0.7rem; color:var(--gold); border:1px solid var(--line); border-radius:999px; padding:1px 8px; }
  .meal .content,.exercise .content{ font-size:0.86rem; line-height:1.7; color:var(--ink); }
  .exercise .label{ font-family:var(--font-head); font-weight:700; font-size:0.85rem; color:var(--blue); margin-bottom:4px; }
  .exercise .content div{ padding:2px 0; }
  .warn-chip{ background:var(--bg); border:1px solid #d9a79e; color:#b06355; border-radius:12px; padding:8px 12px; font-size:0.77rem; line-height:1.6; margin-top:6px; }
  .info-chip{ background:var(--bg); border:1px solid var(--line); color:var(--ink-soft); border-radius:12px; padding:8px 12px; font-size:0.77rem; line-height:1.6; margin-top:6px; }
  .close-btn{ position:absolute; top:10px; left:10px; background:var(--accent); color:#fff; border:none; width:30px; height:30px; border-radius:50%; font-size:1rem; cursor:pointer; }

  .today-date{ text-align:center; font-family:var(--font-head); font-weight:800; color:var(--accent-deep); font-size:1rem; margin-bottom:4px; }
  .today-plan{ text-align:center; color:var(--ink-soft); font-size:0.8rem; margin-bottom:16px; }
  .checklist{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .check-item{ display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; cursor:pointer; transition:all .15s ease; box-shadow:var(--shadow); }
  .check-item.done{ border-color:var(--accent); }
  .check-item .box{ width:24px; height:24px; border-radius:8px; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:0.9rem; flex-shrink:0; background:var(--card); }
  .check-item.done .box{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .check-item .txt{ font-size:0.86rem; flex:1; }
  .check-item.done .txt{ text-decoration:line-through; color:var(--ink-soft); }
  .supp-row{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .supp-chip{ flex:1; min-width:100px; text-align:center; padding:14px 10px; border-radius:14px; border:1px solid var(--line); background:var(--card); cursor:pointer; font-family:var(--font-head); font-weight:700; font-size:0.85rem; box-shadow:var(--shadow); color:var(--ink); }
  .supp-chip.done{ border-color:var(--gold); color:var(--gold); }
  .supp-chip .ic{ font-size:1.3rem; display:block; margin-bottom:4px; }
  .water-card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; text-align:center; box-shadow:var(--shadow); margin-bottom:18px; }
  .water-card h3{ color:var(--water); font-size:0.95rem; margin:0 0 10px; }
  .water-cups{ font-size:1.4rem; letter-spacing:2px; margin-bottom:10px; min-height:28px; }
  .water-controls{ display:flex; align-items:center; justify-content:center; gap:16px; }
  .water-btn{ width:40px; height:40px; border-radius:50%; border:none; background:var(--water); color:#fff; font-size:1.2rem; cursor:pointer; }
  .water-count{ font-family:var(--font-head); font-weight:800; font-size:1rem; color:var(--ink); min-width:80px; }
  .src-note{ text-align:center; font-size:0.7rem; color:var(--ink-soft); opacity:0.7; margin-top:14px; line-height:1.7; }
  footer{ text-align:center; margin-top:30px; font-size:0.72rem; color:var(--ink-soft); opacity:0.7; }

  /* agenda */
  .commit-banner{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:16px; font-size:0.85rem; text-align:center; box-shadow:var(--shadow); }
  .agenda-list{ display:flex; flex-direction:column; gap:8px; }
  .agenda-slot{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; cursor:pointer; box-shadow:var(--shadow); }
  .agenda-slot .time{ font-family:var(--font-head); font-weight:800; color:var(--accent-deep); font-size:0.82rem; }
  .agenda-slot .note{ font-size:0.83rem; color:var(--ink); margin-top:4px; }
  .agenda-slot .note.empty{ color:var(--ink-soft); opacity:0.6; font-style:italic; }
  .agenda-edit{ width:100%; border:1px solid var(--accent); border-radius:10px; padding:8px 10px; font-family:var(--font-body); font-size:0.83rem; margin-top:6px; background:var(--bg); color:var(--ink); }
  /* calendar */
  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .cal-header button{ background:var(--card); border:1px solid var(--line); border-radius:10px; width:38px; height:38px; font-size:1.2rem; cursor:pointer; color:var(--accent-deep); box-shadow:var(--shadow); }
  .cal-month-label{ font-family:var(--font-head); font-weight:800; color:var(--accent-deep); font-size:1.05rem; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:8px; }
  .cal-dayname{ text-align:center; font-size:0.58rem; color:var(--ink-soft); font-weight:700; padding-bottom:4px; overflow:hidden; white-space:nowrap; }
  .cal-cell{ aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:12px; background:var(--card); border:1px solid var(--line); cursor:pointer; font-size:0.85rem; font-weight:700; color:var(--ink); position:relative; box-shadow:var(--shadow); transition:transform 0.1s; }
  .cal-cell:active{ transform:scale(0.93); }
  .cal-cell.empty{ background:none; border:none; box-shadow:none; cursor:default; }
  .cal-cell.today{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .cal-cell.has-commit::after{ content:''; position:absolute; bottom:5px; width:5px; height:5px; border-radius:50%; background:var(--gold); }
  .cal-cell.today.has-commit::after{ background:#fff; }

  /* ---- collections ---- */
  .coll-view{ display:none; } .coll-view.active{ display:block; animation:fadeUp .3s ease; }
  .coll-grid{ display:grid; gap:12px; margin-top:8px; }
  .coll-grid-2{ grid-template-columns:1fr 1fr; }
  .coll-cat-card{ background:var(--card); border:1px solid var(--line); border-radius:20px; padding:26px 14px; text-align:center; cursor:pointer; transition:transform .15s ease; box-shadow:var(--shadow); position:relative; }
  .coll-cat-card:hover{ transform:translateY(-4px); }
  .coll-cat-card.disabled{ opacity:0.5; cursor:default; }
  .coll-cat-card.disabled:hover{ transform:none; }
  .coll-cat-card .ic{ font-size:2.4rem; display:block; margin-bottom:8px; }
  .coll-cat-card .ttl{ font-family:var(--font-head); font-weight:800; color:var(--accent-deep); font-size:1rem; }
  .coll-cat-card .sub{ font-size:0.72rem; color:var(--ink-soft); margin-top:5px; font-variant-numeric:tabular-nums; }
  .coll-cat-card .soon-tag{ position:absolute; top:10px; inset-inline-end:10px; background:var(--bg); border:1px solid var(--line); color:var(--ink-soft); font-size:0.6rem; font-family:var(--font-head); font-weight:700; padding:2px 8px; border-radius:999px; }

  .coll-cat-title{ text-align:center; color:var(--accent-deep); font-size:1.1rem; margin:10px 0 14px; }
  .coll-progress-wrap{ margin-bottom:14px; }
  .coll-progress-label{ text-align:center; font-family:var(--font-head); font-weight:800; color:var(--accent-deep); font-size:0.85rem; margin-bottom:6px; }
  .coll-progress-bar{ background:var(--line); border-radius:999px; height:8px; overflow:hidden; }
  .coll-progress-fill{ background:var(--accent-deep); height:100%; border-radius:999px; transition:width .3s ease; }
  .coll-toolbar{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .coll-search{ flex:2; min-width:120px; }
  .coll-select{ flex:1; min-width:90px; border:1px solid var(--line); border-radius:12px; padding:10px 8px; font-family:var(--font-body); font-size:0.8rem; background:var(--bg); color:var(--ink); }
  .coll-empty{ text-align:center; color:var(--ink-soft); font-size:0.85rem; padding:24px 0; }

  .coll-species-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media(min-width:520px){ .coll-species-grid{grid-template-columns:repeat(3,1fr);} }
  .coll-species-card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 8px 10px; text-align:center; cursor:pointer; box-shadow:var(--shadow); transition:transform .15s ease; position:relative; }
  .coll-species-card:hover{ transform:translateY(-3px); }
  .coll-species-card .thumb{ width:64px; height:64px; margin:0 auto 8px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.8rem; background:var(--bg); border:2px solid var(--line); overflow:hidden; position:relative; }
  .coll-species-card .thumb img{ width:100%; height:100%; object-fit:cover; }
  .coll-species-card.locked .thumb{ filter:grayscale(1); opacity:0.55; }
  .coll-species-card.collected .thumb{ border-color:var(--accent-deep); }
  .coll-species-card .lock-ic{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:1.1rem; background:rgba(0,0,0,0.15); border-radius:50%; }
  .coll-species-card .name{ font-family:var(--font-head); font-weight:800; font-size:0.8rem; color:var(--ink); }
  .coll-species-card.locked .name{ color:var(--ink-soft); }
  .coll-species-card .meta{ font-size:0.68rem; color:var(--ink-soft); margin-top:2px; font-variant-numeric:tabular-nums; }
  .coll-corner-badge{ position:absolute; top:4px; inset-inline-end:4px; font-size:0.8rem; filter:drop-shadow(0 1px 1px rgba(0,0,0,0.25)); }

  .coll-detail-photo{ width:100%; max-width:280px; aspect-ratio:1; margin:0 auto 12px; border-radius:22px; overflow:hidden; position:relative; background:var(--bg); border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:4rem; box-shadow:var(--shadow); }
  .coll-detail-photo img{ width:100%; height:100%; object-fit:cover; }
  .coll-detail-photo.is-reference{ filter:grayscale(0.85); opacity:0.7; border-style:dashed; }
  .coll-photo-tag{ position:absolute; bottom:8px; left:50%; transform:translateX(-50%); font-family:var(--font-head); font-weight:800; font-size:0.62rem; padding:3px 10px; border-radius:999px; white-space:nowrap; }
  .coll-photo-tag.mine{ background:var(--accent-deep); color:#fff; }
  .coll-photo-tag.reference{ background:var(--card); color:var(--ink-soft); border:1px solid var(--line); }
  .coll-status-pill{ display:block; width:fit-content; margin:0 auto 14px; font-family:var(--font-head); font-weight:800; font-size:0.8rem; padding:6px 16px; border-radius:999px; }
  .coll-status-pill.collected{ background:var(--accent-deep); color:#fff; }
  .coll-status-pill.locked{ background:var(--bg); color:var(--ink-soft); border:1px solid var(--line); }
  .coll-sci-name{ text-align:center; font-style:italic; color:var(--ink-soft); font-size:0.78rem; margin-top:-6px; margin-bottom:14px; }

  .coll-counter-row{ display:flex; align-items:center; justify-content:center; gap:18px; margin-bottom:6px; }
  .coll-counter-btn{ width:42px; height:42px; border-radius:50%; border:none; background:var(--accent-deep); color:#fff; font-size:1.3rem; cursor:pointer; line-height:1; }
  .coll-counter-btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .coll-counter-num{ font-family:var(--font-head); font-weight:800; font-size:1.4rem; color:var(--ink); min-width:40px; text-align:center; font-variant-numeric:tabular-nums; }
  .coll-counter-label{ text-align:center; font-size:0.75rem; color:var(--ink-soft); margin-bottom:18px; }

  .coll-records-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
  .coll-record-chip{ background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:10px 8px; text-align:center; }
  .coll-record-chip .rv{ font-family:var(--font-head); font-weight:800; color:var(--accent-deep); font-size:1rem; }
  .coll-record-chip .rl{ font-size:0.68rem; color:var(--ink-soft); margin-top:2px; }

  .coll-log-form{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .coll-log-form input{ flex:1; min-width:80px; border:1px solid var(--line); border-radius:12px; padding:9px 10px; font-family:var(--font-body); font-size:0.85rem; background:var(--bg); color:var(--ink); }
  .coll-log-form button{ flex:0 0 auto; font-family:var(--font-head); font-weight:700; font-size:0.8rem; background:var(--accent-deep); color:#fff; border:none; border-radius:12px; padding:0 16px; cursor:pointer; }

  .coll-dates-row{ display:flex; justify-content:space-around; text-align:center; font-size:0.72rem; color:var(--ink-soft); margin-bottom:16px; }
  .coll-dates-row b{ display:block; color:var(--ink); font-size:0.8rem; margin-top:2px; }

  /* ---- rarity system ---- */
  .coll-rarity-pill{ display:inline-flex; align-items:center; gap:4px; font-family:var(--font-head); font-weight:800; font-size:0.68rem; padding:3px 10px; border-radius:999px; white-space:nowrap; }
  .coll-rarity-common{ background:#eef6f0; color:#3f8a58; }
  .coll-rarity-uncommon{ background:#eaf2fb; color:#2f6fb0; }
  .coll-rarity-epic{ background:#f3ecfb; color:#7d3fbf; }
  .coll-rarity-mythic{ background:#fdecea; color:#c0392b; }
  .coll-rarity-legendary{ background:linear-gradient(135deg,#fff6dd,#ffe4a3); color:#8a6a12; }
  .coll-conservation-pill{ display:inline-flex; align-items:center; font-family:var(--font-head); font-weight:700; font-size:0.66rem; padding:3px 10px; border-radius:999px; background:var(--bg); border:1px solid var(--line); color:var(--ink-soft); white-space:nowrap; }
  .coll-pill-row{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-bottom:12px; }

  .coll-species-card .rarity-tag{ position:absolute; top:6px; inset-inline-start:6px; font-size:0.6rem; z-index:1; }
  .coll-species-card.collected.tier-epic{ box-shadow:0 0 0 1.5px #a875d1 inset, var(--shadow); }
  .coll-species-card.collected.tier-mythic{ box-shadow:0 0 0 1.5px #e0685a inset, var(--shadow); }
  .coll-species-card.collected.tier-legendary{ box-shadow:0 0 0 2px #e0a458 inset, 0 4px 18px rgba(224,164,88,0.4); background:linear-gradient(160deg,var(--card),#fff8ea); }

  .coll-detail-photo.tier-epic{ box-shadow:0 0 0 2px #a875d1, var(--shadow); }
  .coll-detail-photo.tier-mythic{ box-shadow:0 0 0 2px #e0685a, var(--shadow); }
  .coll-detail-photo.tier-legendary{ box-shadow:0 0 0 3px #e0a458, 0 6px 24px rgba(224,164,88,0.45); animation:legendaryGlow 2.4s ease-in-out infinite; }
  @keyframes legendaryGlow{ 0%,100%{ box-shadow:0 0 0 3px #e0a458, 0 6px 24px rgba(224,164,88,0.45); } 50%{ box-shadow:0 0 0 3px #f0c07a, 0 8px 30px rgba(224,164,88,0.65); } }

  .coll-rarity-breakdown{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:14px; }
  .coll-rarity-mini{ font-family:var(--font-head); font-weight:800; font-size:0.68rem; padding:3px 9px; border-radius:999px; }

  .coll-stats-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0 18px; }
  @media(min-width:520px){ .coll-stats-grid{grid-template-columns:repeat(3,1fr);} }
  .coll-stat-chip{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 8px; text-align:center; font-size:0.78rem; box-shadow:var(--shadow); }
  .coll-stat-chip b{ display:block; font-family:var(--font-head); font-size:1.1rem; color:var(--accent-deep); }
  .coll-stat-chip.legendary{ background:linear-gradient(160deg,var(--card),#fff8ea); border-color:#e0c88a; }
  .coll-stat-chip.legendary b{ color:#8a6a12; }

  .coll-variants-section{ margin-bottom:16px; }
  .coll-variants-section h3{ font-size:0.9rem; color:var(--accent-deep); margin:0 0 10px; }
  .coll-variants-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .coll-variant-card{ background:var(--bg); border:1.5px solid var(--line); border-radius:14px; padding:8px 4px; text-align:center; cursor:pointer; position:relative; }
  .coll-variant-card.done{ border-color:var(--accent-deep); background:var(--card); }
  .coll-variant-card .thumb{ width:44px; height:44px; margin:0 auto 6px; border-radius:50%; overflow:hidden; background:var(--card); display:flex; align-items:center; justify-content:center; }
  .coll-variant-card .thumb img{ width:100%; height:100%; object-fit:cover; }
  .coll-variant-card .name{ font-size:0.68rem; font-weight:700; color:var(--ink); }
  .coll-variant-card .check{ position:absolute; top:2px; inset-inline-end:4px; font-size:0.7rem; }

  .coll-sources-box{ font-size:0.7rem; color:var(--ink-soft); background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px 12px; line-height:1.7; margin-bottom:16px; }
  .coll-sources-box summary{ cursor:pointer; font-family:var(--font-head); font-weight:700; color:var(--ink-soft); }

  .coll-toolbar-secondary{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
</style>
</head>
<body>

<!-- ============ SETTINGS ============ -->
<div class="overlay" id="settingsOverlay">
  <div class="card">
    <button class="close-btn" id="settingsCloseBtn">✕</button>
    <h2 data-i18n="settings_title"></h2>
    <div style="margin-top:14px;">
      <label style="font-family:var(--font-head);font-weight:700;font-size:0.85rem;color:var(--ink);display:block;margin-bottom:10px;" data-i18n="bg_color_label"></label>
      <div class="color-swatch-grid" id="colorSwatchGrid"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:14px;">
      <button class="ob-btn" id="exportBtn" type="button" style="flex:1;background:var(--card);color:var(--accent-deep);border:1px solid var(--accent-deep);font-size:0.8rem;padding:10px;">⬇️ <span data-i18n="backup_export"></span></button>
      <button class="ob-btn" id="importBtn" type="button" style="flex:1;background:var(--card);color:var(--accent-deep);border:1px solid var(--accent-deep);font-size:0.8rem;padding:10px;">⬆️ <span data-i18n="backup_import"></span></button>
    </div>
    <input type="file" id="importFileInput" accept="application/json" class="hidden">
    <button class="ob-btn secondary" id="signOutBtn" type="button" data-i18n="auth_sign_out" style="margin-top:14px;"></button>
  </div>
</div>

<!-- ============ MAIN APP ============ -->
<div class="topnav hidden" id="mainNav">
  <div class="topnav-inner">
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="brand" id="brandLabel">🗓️</div>
      <button class="icon-btn" id="demoResetBtn" title="Demo reset" style="font-size:0.65rem;width:auto;padding:0 10px;color:#c0392b;border-color:#c0392b;">DEMO</button>
    </div>
    <div class="nav-actions">
      <button class="icon-btn" id="homeBtn" title="Home">🏠</button>
      <button class="icon-btn" id="modeBtn" title="Mode">🌙</button>
      <button class="icon-btn lang-toggle" id="mainLangToggle" style="width:auto;padding:0 12px;border-radius:999px;">EN</button>
      <button class="icon-btn" id="settingsBtn" title="Settings">⚙️</button>
    </div>
  </div>
  <div id="demoConfirmBar" class="hidden" style="max-width:760px;margin:8px auto 0;background:#fdf0ee;border:1px solid #d9a79e;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <span id="demoConfirmText" style="font-size:0.8rem;color:#b06355;flex:1;min-width:200px;"></span>
    <button id="demoConfirmYes" style="background:#c0392b;color:#fff;border:none;border-radius:8px;padding:6px 14px;font-family:'Cairo',sans-serif;font-weight:700;font-size:0.8rem;cursor:pointer;"></button>
    <button id="demoConfirmNo" style="background:none;border:1px solid #d9a79e;color:#b06355;border-radius:8px;padding:6px 14px;font-family:'Cairo',sans-serif;font-weight:700;font-size:0.8rem;cursor:pointer;"></button>
  </div>
</div>

<div class="wrap hidden" id="mainWrap">

  <!-- HOME -->
  <section class="panel active" id="panel-home">
    <div class="hero">
      <h1 id="heroTitle"></h1>
      <div class="day-badge" id="dayBadge"></div>
      <div class="day-badge hidden" id="streakBadge" style="background:var(--gold);margin-inline-start:8px;"></div>
    </div>
    <div class="home-cards">
      <div class="home-card" data-goto="today"><span class="ic">✅</span><div class="ttl" data-i18n="card_todo"></div></div>
      <div class="home-card" data-goto="food"><span class="ic">🍽️</span><div class="ttl" data-i18n="card_food"></div></div>
      <div class="home-card" data-goto="workout"><span class="ic">🏋️</span><div class="ttl" data-i18n="card_workout"></div></div>
      <div class="home-card" data-goto="collections"><span class="ic">🐾</span><div class="ttl" data-i18n="card_collections"></div></div>
    </div>
  </section>

  <!-- TO DO -->
  <section class="panel" id="panel-today">
    <div class="back-row"><button class="back-btn" data-i18n="back_home"></button><span></span></div>

    <!-- content (always visible, even before any setup) -->
    <div id="todoContent">
      <div class="home-card" id="dailyRoutineToggleCard" style="margin-bottom:16px;cursor:pointer;">
        <span class="ic">🗓️</span><div class="ttl" data-i18n="daily_routine_title"></div>
      </div>

      <!-- setup, nested + collapsible like the Exercise folder inside Food -->
      <div class="setup-card hidden" id="todoSetupCard">
        <h3 data-i18n="q_commit"></h3>
        <div class="tag-chips" id="commitListChips"></div>
        <input type="text" class="setup-input" id="commitLabel" data-i18n-ph="commit_label_ph">
        <label style="font-size:0.85rem;color:var(--ink);display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <input type="checkbox" id="commitAllDayToggle" style="width:18px;height:18px;"> <span data-i18n="all_day_label"></span>
        </label>
        <div class="setup-row" id="commitTimeRow">
          <div><label style="font-size:0.75rem;color:var(--ink-soft);" data-i18n="from_label"></label><div class="time-picker" id="commitFromPicker"></div></div>
          <div><label style="font-size:0.75rem;color:var(--ink-soft);" data-i18n="to_label"></label><div class="time-picker" id="commitToPicker"></div></div>
        </div>
        <input type="hidden" id="commitFrom"><input type="hidden" id="commitTo">
        <p class="sub" style="margin-bottom:8px;" data-i18n="q_commit_days"></p>
        <div class="ob-grid" id="commitDaysGrid" style="grid-template-columns:repeat(4,1fr);margin-bottom:14px;"></div>
        <p class="sub" style="margin-bottom:8px;" data-i18n="q_commit_range"></p>
        <div class="setup-row">
          <div><label style="font-size:0.75rem;color:var(--ink-soft);" data-i18n="commit_from_date"></label><input type="date" class="setup-input" id="commitFromDate"></div>
          <div><label style="font-size:0.75rem;color:var(--ink-soft);" data-i18n="commit_to_date"></label><input type="date" class="setup-input" id="commitToDate"></div>
        </div>
        <button class="setup-btn" id="commitAddBtn" type="button" data-i18n="add_commit" style="background:var(--card);color:var(--accent-deep);border:1px solid var(--accent-deep);"></button>
        <button class="setup-btn" id="todoSetupSave" data-i18n="save" style="margin-top:14px;"></button>
      </div>

      <div class="cal-header">
        <button id="calPrevMonth" type="button">‹</button>
        <div class="cal-month-label" id="calMonthLabel"></div>
        <button id="calNextMonth" type="button">›</button>
      </div>
      <button class="setup-btn" id="calTodayBtn" type="button" data-i18n="cal_today_btn" style="margin-bottom:12px;background:var(--card);color:var(--accent-deep);border:1px solid var(--accent-deep);"></button>
      <div class="cal-grid" id="calendarGrid"></div>
    </div>
  </section>

  <!-- FOOD -->
  <section class="panel" id="panel-food">
    <div class="back-row"><button class="back-btn" data-i18n="back_home"></button><button class="edit-btn" id="editFoodBtn" data-i18n="edit_setup"></button></div>

    <!-- setup -->
    <div class="setup-card" id="foodSetupCard">
      <div class="ob-progress" style="justify-content:center;margin-bottom:14px;display:flex;gap:5px;">
        <div class="ob-dot active" data-fstep="1"></div>
        <div class="ob-dot" data-fstep="2"></div>
        <div class="ob-dot" data-fstep="3"></div>
        <div class="ob-dot" data-fstep="4"></div>
      </div>

      <!-- STEP 1: body stats + goal -->
      <div class="ob-step active" id="fStep1">
        <h3 data-i18n="q_body"></h3>
        <div class="setup-row">
          <div><label style="font-size:0.75rem;color:var(--ink-soft);" data-i18n="weight_label"></label><input type="number" step="0.1" class="setup-input" id="bodyWeight" data-i18n-ph="weight_ph"></div>
          <div><label style="font-size:0.75rem;color:var(--ink-soft);" data-i18n="height_label"></label><input type="number" class="setup-input" id="bodyHeight" data-i18n-ph="height_ph"></div>
        </div>
        <div class="setup-row">
          <div><label style="font-size:0.75rem;color:var(--ink-soft);" data-i18n="age_label"></label><input type="number" class="setup-input" id="bodyAge" data-i18n-ph="age_ph"></div>
          <div><label style="font-size:0.75rem;color:var(--ink-soft);" data-i18n="sex_label"></label>
            <select class="setup-input" id="bodySex"><option value="male" data-i18n="sex_male"></option><option value="female" data-i18n="sex_female"></option></select>
          </div>
        </div>
        <div class="val-msg" id="bodyStatsValMsg"></div>

<script>
/* ================= VERSION + SERVICE WORKER ================= */
/* Bump this on every real deploy — must match APP_VERSION inside sw.js so
   the old cache gets cleared and the new one takes over immediately. */
const APP_VERSION='v1.8.0';
if('serviceWorker' in navigator && window.isSecureContext){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* fails silently when run as a Claude Artifact / sandboxed preview — expected there */ });
  });

/* ================= STORAGE + ERRORS =================
   When signed in, Firestore is the source of truth (synced across every
   device on the account) and localStorage is kept as a write-through cache
   for instant reads + offline resilience. Signed out, behavior is unchanged
   from before (window.storage for the Artifact preview, else localStorage). */
const _mem={};
function fsDataRef(key){ return fbDb.collection('users').doc(currentUser.uid).collection('data').doc(key); }
async function storageGet(key){
  if(currentUser&&fbDb){
    try{
      const doc=await fsDataRef(key).get();
      const v=doc.exists?doc.data().value:null;
      if(v!==null){ try{ localStorage.setItem('planner_'+key,v); }catch(e){} }
      return v;
    }catch(e){ /* offline/blocked — fall through to the local cache below */ }
  }
  try{ if(window.storage&&window.storage.get){ const r=await window.storage.get(key,false); return r?r.value:null; } }catch(e){}
  try{ const v=localStorage.getItem('planner_'+key); if(v!==null) return v; }catch(e){}
  return _mem[key]!==undefined?_mem[key]:null;
}
async function storageSet(key,value){
  _mem[key]=value;
  try{ localStorage.setItem('planner_'+key,value); }catch(e){}
  if(currentUser&&fbDb){
    try{ await fsDataRef(key).set({value}); }catch(e){ /* offline — Firestore's own queue retries when back online */ }
    return;
  }
  try{ if(window.storage&&window.storage.set){ await window.storage.set(key,value,false); return; } }catch(e){}
}
async function storageDelete(key){
  delete _mem[key];
  try{ localStorage.removeItem('planner_'+key); }catch(e){}
  if(currentUser&&fbDb){
    try{ await fsDataRef(key).delete(); }catch(e){}
    return;
  }
  try{ if(window.storage&&window.storage.delete){ await window.storage.delete(key,false); return; } }catch(e){}
}
async function storageListKeys(prefix){
  if(currentUser&&fbDb){
    try{
      const snap=await fbDb.collection('users').doc(currentUser.uid).collection('data')
        .orderBy(firebase.firestore.FieldPath.documentId())
        .startAt(prefix).endAt(prefix+'').get();
      return snap.docs.map(d=>d.id);
    }catch(e){ /* fall through */ }
  }
  try{
    if(window.storage&&window.storage.list){ const r=await window.storage.list(prefix,false); if(r&&r.keys) return r.keys; }
  }catch(e){}
  const found=[];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith('planner_'+prefix)) found.push(k.slice('planner_'.length));
    }

/* ================= AUTH (Google + email/password, cross-device sync) ================= */
/* first time a browser's local data meets a freshly-signed-in account with no
   cloud data yet, push everything up once so nobody's existing schedule gets
   wiped just because they created an account */
async function migrateLocalDataToCloud(uid){
  /* localStorage can throw outright (not just return null) in restricted
     contexts — sandboxed/data: URL previews, some private-browsing modes —
     and this whole function runs synchronously in the middle of the
     sign-in callback, so an uncaught throw here used to abort sign-in
     entirely: the auth overlay never hid and the user looked "stuck" on
     the login screen with no real error explaining why. Migration is a
     nice-to-have, never allowed to block getting into the app. */
  try{
    const localProfile=localStorage.getItem('planner_profile');
    if(!localProfile) return;
    const dataCol=fbDb.collection('users').doc(uid).collection('data');
    const existing=await dataCol.doc('profile').get().catch(()=>null);
    if(existing&&existing.exists) return; // account already has cloud data — never overwrite
    /* generic — every planner_-prefixed key migrates automatically, so new
       key patterns (like Collections) never need this function touched again */
    for(let i=0;i<localStorage.length;i++){
      const lk=localStorage.key(i);
      if(!lk||!lk.startsWith('planner_')) continue;
      const key=lk.slice('planner_'.length);
      const v=localStorage.getItem(lk);
      if(v!==null){ try{ await dataCol.doc(key).set({value:v}); }catch(e){} }
    }
  }catch(e){ console.error('Local data migration skipped (storage unavailable):',e.message); }
}

/* category synonyms so a dislike/allergy on a general word (e.g. "fish") also
   catches specific dishes that never literally use that word (e.g. "tuna") —
   checked in BOTH languages */
const FOOD_SYNONYMS={
  fish:['fish','سمك','tuna','تونة','salmon','سلمون','shrimp','روبيان','seafood'],
  سمك:['fish','سمك','tuna','تونة','salmon','سلمون','shrimp','روبيان','seafood'],
  tuna:['fish','سمك','tuna','تونة'], تونة:['fish','سمك','tuna','تونة'],
  chicken:['chicken','دجاج'], دجاج:['chicken','دجاج'],
  egg:['egg','eggs','بيض','بيضة'], eggs:['egg','eggs','بيض','بيضة'], بيض:['egg','eggs','بيض','بيضة'], بيضة:['egg','eggs','بيض','بيضة'],
  milk:['milk','حليب'], حليب:['milk','حليب'],
  rice:['rice','رز','الرز'], رز:['rice','رز','الرز'], الرز:['rice','رز','الرز'],
  dairy:['milk','حليب','cheese','جبن','جبنة','yogurt','زبادي','labneh','لبنة'],
  nuts:['nuts','مكسرات','peanut','فول سوداني','almond','لوز']
};
function expandFoodTerm(raw){
  const trimmed=(raw||'').trim();
  if(!trimmed) return [];
  const key=trimmed.toLowerCase();
  const syn=FOOD_SYNONYMS[key]||FOOD_SYNONYMS[trimmed];
  if(syn) return syn;
  const mapped=FOOD_WORD_MAP[key]||FOOD_WORD_MAP[trimmed];
  return mapped ? [trimmed,mapped] : [trimmed];
}
function analyzeAllergyTextLocal(text){
  const words=text.split(/[\s,،/]+/).map(w=>w.trim()).filter(Boolean);
  const avoidWords=[];
  let substitute=null;
  words.forEach(w=>{
    expandFoodTerm(w).forEach(t=>avoidWords.push(t));
    const key=w.toLowerCase();
    if(!substitute) substitute=SUBSTITUTE_MAP[key]||SUBSTITUTE_MAP[w];
  });
  const subText=substitute ? {ar:substitute.ar,en:substitute.en} : {ar:'شي مشابه بنفس الفئة الغذائية',en:'something similar in the same food group'};
  return {avoidWords,subText,
    noteAr:`🥗 عندك حساسية "${text}" — شيلناها من الوجبة، بديلها: ${subText.ar}`,
    noteEn:`🥗 You're allergic to "${text}" — removed it from the meal, substitute: ${subText.en}`,
    subNoteAr:`⚠️ شيلنا "${text}" — بديلها: ${subText.ar}`,
    subNoteEn:`⚠️ Removed "${text}" — substitute: ${subText.en}`};
}
function showErr(msg){
  /* Known-benign noise: browsers with storage disabled/partitioned (data:
     URLs, some private-browsing modes) throw the moment ANY code touches
     localStorage/sessionStorage — including inside the Firebase SDK's own
     internals, well outside our try/catches. Sign-in and the app itself
     still work fine in that case, so surfacing this as a scary red banner
     would be misleading rather than helpful. */
  if(/storage is disabled/i.test(msg||'')) return;
  let el=document.getElementById('errBanner');
  if(!el){ el=document.createElement('div'); el.id='errBanner'; el.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#c0392b;color:#fff;padding:10px;font-size:12px;z-index:9999;text-align:center;'; document.body.appendChild(el); }
  el.textContent='⚠️ '+msg;
}
function showToast(msg,type){
  let el=document.getElementById('toastBanner');
  if(!el){ el=document.createElement('div'); el.id='toastBanner'; el.style.cssText='position:fixed;bottom:0;left:0;right:0;color:#fff;padding:10px;font-size:12px;z-index:9999;text-align:center;'; document.body.appendChild(el); }
  el.style.background = type==='error' ? '#c0392b' : '#4c6350';
  el.textContent=(type==='error'?'⚠️ ':'✅ ')+msg;
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>{ if(el&&el.parentNode) el.parentNode.removeChild(el); },3500);
}
window.addEventListener('error',e=>showErr(e.message));

let LANG='ar';
function t(k){ return (I18N[LANG]&&I18N[LANG][k])||I18N.ar[k]||k; }
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  document.documentElement.lang=LANG; document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  document.getElementById('mainLangToggle').textContent=LANG==='ar'?'EN':'ع';
  const alt=document.getElementById('authLangToggle'); if(alt) alt.textContent=LANG==='ar'?'EN':'ع';
}

/* single black/white minimalist identity — "mono" light + "Onyx" dark, no
   multi-palette/font choice anymore per the minimalism request */
const PALETTES={
 mono:{ light:{bg:'#f7f7f5',card:'#ffffff',ink:'#1a1a1a',inkSoft:'#6b6b6b',line:'#e2e2e0',accent:'#1a1a1a',accentDeep:'#000000',gold:'#4a4a4a',water:'#5c5c5c',blue:'#3d3d3d'},
       dark:{bg:'#121212',card:'#1c1c1c',ink:'#f2f2f2',inkSoft:'#a0a0a0',line:'#2e2e2e',accent:'#e8e8e8',accentDeep:'#ffffff',gold:'#cfcfcf',water:'#bdbdbd',blue:'#d6d6d6'} }
};
const FONTS={ classic:{head:"'Cairo',sans-serif",body:"'Tajawal',sans-serif"} };
function applyTheme(palette,mode,font){
  const p=PALETTES.mono[mode==='dark'?'dark':'light'];
  const r=document.documentElement.style;
  const customBg=(P.customBg&&P.customBg[mode==='dark'?'dark':'light'])||null;
  r.setProperty('--bg',customBg||p.bg); r.setProperty('--card',p.card); r.setProperty('--ink',p.ink);
  r.setProperty('--ink-soft',p.inkSoft); r.setProperty('--line',p.line);
  r.setProperty('--accent',p.accent); r.setProperty('--accent-deep',p.accentDeep);
  r.setProperty('--gold',p.gold); r.setProperty('--water',p.water); r.setProperty('--blue',p.blue);
  const f=FONTS.classic;
  r.setProperty('--font-head',f.head); r.setProperty('--font-body',f.body);
  const mb=document.getElementById('modeBtn'); if(mb) mb.textContent=mode==='dark'?'☀️':'🌙';
  if(document.getElementById('colorSwatchGrid')) buildColorSwatchGrid();
}

const BG_SWATCHES=[

  {name:'sage', light:'#eef3ea', dark:'#131a12'},
  {name:'ocean', light:'#e8f3f6', dark:'#0e1a1d'},

function buildColorSwatchGrid(){
  const grid=document.getElementById('colorSwatchGrid'); if(!grid) return;
  grid.innerHTML='';
  const activeMode=P.mode==='dark'?'dark':'light';
  const currentBg=(P.customBg&&P.customBg[activeMode])||PALETTES.mono[activeMode].bg;
  BG_SWATCHES.forEach(sw=>{
    const el=document.createElement('div');
    el.className='color-swatch'+(sw[activeMode]===currentBg?' selected':'');
    el.style.background=`linear-gradient(135deg, ${sw.light} 50%, ${sw.dark} 50%)`;
    el.title=sw.name;
    el.addEventListener('click',async()=>{
      P.customBg={light:sw.light,dark:sw.dark};
      applyTheme(P.palette,P.mode,P.font);
      await storageSet('profile',JSON.stringify(P));
    });
    grid.appendChild(el);
  });
}

/* ---- BACKUP: export/import everything as a JSON file, so data survives a
   cleared cache, a new phone, or switching from the Artifact to Netlify ---- */
document.getElementById('exportBtn').addEventListener('click',async()=>{
  try{
    const backup={exportedAt:new Date().toISOString(),profile:P,weightLog,dailyTrack,dailyTracks:{}};
    const dailyKeys=await storageListKeys('daily-track:');
    for(const k of dailyKeys){
      try{ const v=await storageGet(k); if(v) backup.dailyTracks[k]=JSON.parse(v); }catch(e){}
    }
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=`planner-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(LANG==='ar'?'انحفظت نسخة احتياطية 👍':'Backup saved 👍');
  }catch(err){ showToast((LANG==='ar'?'فشل التصدير: ':'Export failed: ')+err.message,'error'); }
});
document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFileInput').click());
document.getElementById('importFileInput').addEventListener('change',async(e)=>{
  const file=e.target.files[0]; if(!file) return;
  try{
    const text=await file.text();
    const data=JSON.parse(text);
    if(data.profile){ P={...P,...data.profile}; await storageSet('profile',JSON.stringify(P)); }
    if(data.weightLog){ weightLog=data.weightLog; await storageSet('weight-log',JSON.stringify(weightLog)); }
    if(data.dailyTracks){ for(const [k,v] of Object.entries(data.dailyTracks)){ await storageSet(k,JSON.stringify(v)); } }
    if(data.dailyTrack){ dailyTrack=data.dailyTrack; await storageSet(todayKey(),JSON.stringify(dailyTrack)); }
    LANG=P.lang||'ar';
    launchApp();
    showToast(LANG==='ar'?'رجعنا بياناتك بنجاح ✅':'Backup restored successfully ✅');
  }catch(err){ showToast((LANG==='ar'?'فشل الاستيراد — تأكد إن الملف صحيح: ':'Import failed — check the file: ')+err.message,'error'); }
  e.target.value='';
});

function fillGapWithRealFood(gapKcal,goal,dietType){
  if(gapKcal<150) return [];
  let pool=[...EXTRA_ITEMS[goal]];
  if(dietType==='lowCarb'){
    const filtered=pool.filter(item=>!/خبز|عسل|تمر|bread|honey|dates/i.test(item.ar+item.en));
    if(filtered.length) pool=filtered;
  }
  pool.sort((a,b)=>b.kcal-a.kcal);
  const picked=[]; let remaining=gapKcal;
  for(const item of pool){
    if(picked.length>=2) break;
    if(item.kcal<=remaining+80){ picked.push(item); remaining-=item.kcal; }
    if(remaining<100) break;
  }
  return picked;
}
function getISOWeekNum(d){
  const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dayNum=dt.getUTCDay()||7;
  dt.setUTCDate(dt.getUTCDate()+4-dayNum);
  const yearStart=new Date(Date.UTC(dt.getUTCFullYear(),0,1));
  return Math.ceil((((dt-yearStart)/86400000)+1)/7);
}
const MEAL_COUNT_SLOTS={
  5:['breakfast','snack1','lunch','snack2','dinner'],
  4:['breakfast','lunch','snack2','dinner'],
  3:['breakfast','lunch','dinner'],
  2:['lunch','dinner']
};
function getMealPoolForSlot(key){
  const goal=currentGoalKey();
  const fs=P.foodSetup||{};
  const dietType=fs.dietType||'balanced';
  let pool = (dietType==='lowCarb' && (key==='breakfast'||key==='lunch')) ? MEAL_POOLS.lose[key] : MEAL_POOLS[goal][key];
  if(dietType==='highProtein' && (key==='snack1'||key==='snack2')){
    const filtered=pool.filter(item=>/بروتين|بيض|زبادي|جبن|protein|egg|yogurt|cheese/i.test(item.ar+item.en));
    if(filtered.length) pool=filtered;
  }
  const disliked=fs.dislikedList||[];
  if(disliked.length){
    const dislikedTerms=disliked.flatMap(d=>expandFoodTerm(d));
    const notDisliked=pool.filter(item=>!dislikedTerms.some(term=>term&&(item.ar.toLowerCase().includes(term.toLowerCase())||item.en.toLowerCase().includes(term.toLowerCase()))));
    if(notDisliked.length) pool=notDisliked;
  }
  return pool;
}
function getDayMenu(weekdayIdx){
  const fs=P.foodSetup||{};
  const dietType=fs.dietType||'balanced';
  const isIF=dietType==='if168';
  const mealCount=isIF?2:(fs.mealCount||5);
  const activeSlotKeys=MEAL_COUNT_SLOTS[mealCount]||MEAL_COUNT_SLOTS[5];
  const week=getISOWeekNum(new Date());
  const isFriday=(weekdayIdx===6);
  const meals=[];
  SLOT_KEYS.forEach((key,slotIdx)=>{
    if(!activeSlotKeys.includes(key)) return;
    const pool=getMealPoolForSlot(key);
    let idx;
    if(key==='lunch'){
      if(isFriday){
        idx=pool.length-1;
      } else {
        idx=(weekdayIdx+week*(slotIdx+1))%Math.max(1,pool.length-1);
      }
    } else {
      idx=(weekdayIdx+week*(slotIdx+1))%pool.length;
    }
    const item=pool[idx];
    meals.push([SLOT_LABELS[slotIdx],{ar:item.ar,en:item.en},String(item.kcal),key]);
  });
  const total=meals.reduce((s,m)=>s+parseInt(m[2],10),0);
  return {tag:isFriday?'special':'', total:String(total), meals};
}
/* today's meals can be swapped one at a time (see swapSingleTodayMeal) — the
   swap is stored per-slot in dailyTrack so it persists for the rest of the
   day; every other day always shows the plain computed menu */
function getTodayMenu(weekdayIdx){
  const v=getDayMenu(weekdayIdx);
  const overrides=dailyTrack.mealOverrides||{};
  if(!Object.keys(overrides).length) return v;
  const meals=v.meals.map(m=>{
    const key=m[3];
    const ov=overrides[key];
    return ov ? [m[0],{ar:ov.ar,en:ov.en},String(ov.kcal),key] : m;
  });
  const total=meals.reduce((s,m)=>s+parseInt(m[2],10),0);
  return {tag:v.tag, total:String(total), meals};
}
function swapSingleTodayMeal(key){
  const idx=todayWeekdayIndex();
  const current=getTodayMenu(idx).meals.find(m=>m[3]===key);
  if(!current) return;
  const pool=getMealPoolForSlot(key);
  const candidates=pool.filter(p=>p.ar!==current[1].ar);
  if(!candidates.length) return;
  const pick=candidates[Math.floor(Math.random()*candidates.length)];
  dailyTrack.mealOverrides=dailyTrack.mealOverrides||{};
  dailyTrack.mealOverrides[key]={ar:pick.ar,en:pick.en,kcal:pick.kcal};
  saveDailyTrack();
  renderFoodSection();
}

/* Real removal (not just a visual strikethrough): each free-text allergy/
   dislike is matched by word and the exact match is replaced in the meal
   text with its substitute, so the ingredient is actually gone from what's
   shown — not merely crossed out. */
function transformMeal(text,lang){
  let out=text, touched=false;
  const fs=P.foodSetup||{};
  const analyses=fs.allergyAnalysis||[];
  analyses.forEach(a=>{
    (a.avoidWords||[]).forEach(w=>{
      if(!w) return;
      const escaped=w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const re=new RegExp(/[a-zA-Z]/.test(w) ? `${escaped}[a-zA-Z]*` : `${escaped}[ء-ي]*`,'gi');
      if(re.test(out)){ out=out.replace(re, a.subText?a.subText[lang]:''); touched=true; }
    });
  });
  return {text:out,touched};
}

/* video link for any exercise: strips numbering + rep/set info from the English
   name and builds a YouTube search link — works for every exercise at every
   level (beginner/amateur/pro) since it's generated from the text itself,
   not a hand-picked list */
function exerciseVideoUrl(enText){
  if(!enText) return null;
  let q=enText.replace(/^\d+\.\s*/,'').split('—')[0].trim();
  if(!q) return null;
  return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q+' exercise proper form tutorial');
}
function videoIconHtml(enText){
  const url=exerciseVideoUrl(enText);
  if(!url) return '';
  return `<a href="${url}" target="_blank" rel="noopener noreferrer" style="margin-inline-start:8px;text-decoration:none;font-size:0.85em;vertical-align:middle;" title="${LANG==='ar'?'شاهد فيديو الحركة':'Watch exercise video'}">🎥</a>`;
}

/* ---- REST TIMER: tap the ⏱️ next to any exercise to start a countdown with
   a beep at the end (Web Audio API, no sound file needed). Global so the
   inline onclick in the generated HTML string can reach it. ---- */
let restTimerInterval=null;
function playBeep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value=880; gain.gain.value=0.25;
    osc.start();
    setTimeout(()=>{ osc.stop(); ctx.close(); },450);
  }catch(e){}
}
function stopRestTimer(){
  if(restTimerInterval){ clearInterval(restTimerInterval); restTimerInterval=null; }
  const bar=document.getElementById('restTimerBar'); if(bar) bar.remove();
}
function startRestTimer(seconds){
  seconds=seconds||60;
  stopRestTimer();
  let remaining=seconds;
  const bar=document.createElement('div');
  bar.id='restTimerBar';
  bar.style.cssText='position:fixed;bottom:0;left:0;right:0;background:var(--accent-deep);color:#fff;padding:14px;text-align:center;font-family:var(--font-head);font-weight:800;font-size:1rem;z-index:9998;display:flex;align-items:center;justify-content:center;gap:14px;box-shadow:0 -4px 16px rgba(0,0,0,0.2);';
  bar.innerHTML=`<span>⏱️ <span id="restTimerNum">${remaining}</span>s</span>
    <button type="button" onclick="startRestTimer(60)" style="background:rgba(255,255,255,0.25);color:#fff;border:none;border-radius:8px;padding:6px 10px;font-family:var(--font-head);font-weight:700;font-size:0.8rem;cursor:pointer;">+60</button>
    <button type="button" onclick="stopRestTimer()" style="background:#fff;color:var(--accent-deep);border:none;border-radius:8px;padding:6px 14px;font-family:var(--font-head);font-weight:800;cursor:pointer;">${LANG==='ar'?'إيقاف':'Stop'}</button>`;
  document.body.appendChild(bar);
  restTimerInterval=setInterval(()=>{
    remaining--;
    const numEl=document.getElementById('restTimerNum');
    if(numEl) numEl.textContent=remaining;
    if(remaining<=0){ playBeep(); stopRestTimer(); }
  },1000);
}
/* splits "١. اسم التمرين — ٣ × ١٢-١٥" into {name, sets, reps} for the table view */
function parseExerciseRow(text){
  const dashIdx=text.indexOf('—');
  let name = dashIdx>=0 ? text.slice(0,dashIdx).trim() : text.trim();
  let metrics = dashIdx>=0 ? text.slice(dashIdx+1).trim() : '';
  name = name.replace(/^[\d٠-٩]+\.\s*/,'');
  let sets='-', reps=metrics;
  if(metrics.includes('×')){
    const parts=metrics.split('×');
    sets=parts[0].trim();
    reps=parts.slice(1).join('×').trim();
  }
  return {name,sets,reps};
}
let exRowCounter=0;
function exerciseTableHtml(list,timerSecs,showVideo){
  if(!list||!list.length) return '';
  let rows='';
  list.forEach(e=>{
    const p=parseExerciseRow(e[LANG]);
    const vid = showVideo ? videoIconHtml(e.en) : '';
    const timer = showVideo ? timerIconHtml(timerSecs) : '';
    const rid='exrow'+(exRowCounter++);
    rows+=`<tr id="${rid}"><td>${p.name}${vid}${timer}</td><td>${p.sets}</td><td>${p.reps}</td><td style="text-align:center;"><input type="checkbox" onchange="document.getElementById('${rid}').classList.toggle('ex-done',this.checked)"></td></tr>`;
  });
  return `<table class="ex-table"><thead><tr><th>Exercise</th><th>Sets</th><th>Reps</th><th>Checklist</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function timerIconHtml(seconds){
  seconds=seconds||60;
  return `<button type="button" onclick="startRestTimer(${seconds})" style="margin-inline-start:6px;border:none;background:none;cursor:pointer;font-size:0.85em;vertical-align:middle;padding:0;" title="${LANG==='ar'?'مؤقت راحة ٦٠ ثانية':'60s rest timer'}">⏱️</button>`;
}

/* native <input type=time> renders in 24h or 12h depending on OS/browser
   locale, regardless of formatTime12h() used everywhere else in the app —
   so we build our own hour/minute/AM-PM selects and write a 24h "HH:MM"
   into a hidden input, guaranteeing AM/PM display no matter the platform */
function timeTo12h(hhmm){
  if(!hhmm) return {h:8,m:0,ampm:'AM'};
  const [h,m]=hhmm.split(':').map(Number);
  const ampm = h<12 ? 'AM':'PM';
  let h12=h%12; if(h12===0) h12=12;
  return {h:h12,m,ampm};
}
function to24h(h12,m,ampm){
  let h=h12%12;
  if(ampm==='PM') h+=12;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function buildTimePicker(pickerId,hiddenId,initial24h){
  const picker=document.getElementById(pickerId);
  const hidden=document.getElementById(hiddenId);
  const {h,m,ampm}=timeTo12h(initial24h);
  const hourOpts=Array.from({length:12},(_,i)=>i+1).map(v=>`<option value="${v}"${v===h?' selected':''}>${v}</option>`).join('');
  const minOpts=[0,5,10,15,20,25,30,35,40,45,50,55].map(v=>`<option value="${v}"${v===m?' selected':''}>${String(v).padStart(2,'0')}</option>`).join('');
  picker.innerHTML=`<select class="tp-hour">${hourOpts}</select><select class="tp-min">${minOpts}</select><select class="tp-ampm"><option value="AM"${ampm==='AM'?' selected':''}>AM</option><option value="PM"${ampm==='PM'?' selected':''}>PM</option></select>`;
  function update(){
    const hv=+picker.querySelector('.tp-hour').value;
    const mv=+picker.querySelector('.tp-min').value;
    const av=picker.querySelector('.tp-ampm').value;
    hidden.value=to24h(hv,mv,av);
  }
  picker.querySelectorAll('select').forEach(s=>s.addEventListener('change',update));
  update();
}

/* No strict formula sets an "optimal" meal count — research shows meal
   frequency itself barely matters once calories/protein are fixed. This is
   just a practical starting point sized to the calorie target (which factors
   in the target weight/date asked right before this step), always editable. */
/* returns {kcal, dailyAdjust} — dailyAdjust is the signed daily surplus (+)
   or deficit (-) vs. maintenance (TDEE) implied by the target weight/date */
function estimateCalorieTargetFromDraft(){
  const weight=parseFloat(document.getElementById('bodyWeight').value)||null;
  const height=parseFloat(document.getElementById('bodyHeight').value)||null;
  const age=parseInt(document.getElementById('bodyAge').value,10)||25;
  const sex=document.getElementById('bodySex').value||'male';
  if(!weight||!height) return {kcal:null,dailyAdjust:0};
  const bmr=(sex==='female') ? (10*weight+6.25*height-5*age-161) : (10*weight+6.25*height-5*age+5);
  const tdee=bmr*1.55;
  const targetWeight=parseFloat(document.getElementById('targetWeightInput').value)||null;
  const targetDate=document.getElementById('targetDateInput').value||null;
  if(targetWeight&&targetDate){
    const today=new Date(); today.setHours(0,0,0,0);
    const target=new Date(targetDate+'T00:00:00');
    const weeksLeft=(target-today)/(1000*60*60*24*7);
    if(weeksLeft>0){
      let weeklyRate=(targetWeight-weight)/weeksLeft;
      if(Math.abs(weeklyRate)>1) weeklyRate = weeklyRate>0?1:-1;
      const dailyAdjust=(weeklyRate*7700)/7;
      return {kcal:Math.max(1300,Math.round(tdee+dailyAdjust)), dailyAdjust};
    }
  }
  return {kcal:Math.round(tdee), dailyAdjust:0};
}
/* meal count is fully system-determined — driven by the SIZE of the daily
   surplus/deficit (not the absolute calorie target). A tiny surplus (e.g.
   gaining 5kg over a year, ~100-150 kcal/day) is easy to hit in 2-3 meals;
   a large surplus/deficit needs more meals to distribute comfortably. */
function suggestedMealCount(dailyAdjust){
  const size=Math.abs(dailyAdjust);
  if(size<150) return 2;
  if(size<350) return 3;
  if(size<600) return 4;
  return 5;
}
function applyMealCountSuggestion(){
  const {dailyAdjust}=estimateCalorieTargetFromDraft();
  const n = P._dietType==='if168' ? 2 : suggestedMealCount(dailyAdjust);
  P._mealCount=n;

  noteEl.textContent = LANG==='ar'
    ? `🍽️ ${n} وجبات — محسوبة حسب حجم الفائض/العجز اليومي (~${Math.round(Math.abs(dailyAdjust))} سعرة عن معدل الحرق)`
    : `🍽️ ${n} meals — computed from your daily surplus/deficit size (~${Math.round(Math.abs(dailyAdjust))} kcal vs. maintenance)`;
}

  balanced:{ar:'🍽️ متوازن: ٥٠-٦٠٪ كارب، ١٥٪ بروتين، ٢٥-٣٥٪ دهون — نفس مكتبة الأكل الحالية بدون تغيير',en:'🍽️ Balanced: 50-60% carb, 15% protein, 25-35% fat — same food library, unchanged'},
  highProtein:{ar:'🥩 عالي بروتين: هدفك ~{p}غ بروتين يومياً (١.٦-٢.٢غ/كج) — الوجبات الخفيفة بتكون بروتين بس (شيك، بيض، زبادي)',en:'🥩 High-protein: your target is ~{p}g protein/day (1.6-2.2g/kg) — snacks will be protein-only (shake, eggs, yogurt)'},
  lowCarb:{ar:'🥗 قليل الكارب: الفطور والغدا بيصيرون خفاف (سلطة+بروتين مشوي) بدل الرز الثقيل، حتى لو هدفك زيادة وزن',en:'🥗 Low-carb: breakfast & lunch become lighter (salad+grilled protein) instead of heavy rice, even if your goal is gaining'},
  if168:{ar:'⏱️ صيام متقطع ١٦:٨: نافذة الأكل ٨ ساعات بس — الفطور والسناك الأول بينشالون، وجبتين رئيسيتين بدل ٥',en:'⏱️ Intermittent fasting 16:8: 8-hour eating window only — breakfast & first snack are dropped, 2 main meals instead of 5'}
};
/* the meal library only stores kcal per dish (no per-ingredient macros), so
   grams here are an estimate derived from the chosen diet type's macro split
   (same ratios shown in DIET_MACROS) applied to that one meal's calories —
   not a lab-measured breakdown */
const MACRO_SPLITS={
  balanced:{protein:0.20,carbs:0.50,fat:0.30},
  highProtein:{protein:0.30,carbs:0.35,fat:0.35},
  lowCarb:{protein:0.30,carbs:0.20,fat:0.50},
  if168:{protein:0.20,carbs:0.50,fat:0.30}
};
function estimateMealMacros(kcal){
  const dietType=(P.foodSetup&&P.foodSetup.dietType)||'balanced';
  const split=MACRO_SPLITS[dietType]||MACRO_SPLITS.balanced;
  return {
    protein:Math.round((kcal*split.protein)/4),
    carbs:Math.round((kcal*split.carbs)/4),
    fat:Math.round((kcal*split.fat)/9)
  };
}
function mealMacroLabel(kcal){
  const mm=estimateMealMacros(kcal);
  return LANG==='ar'
    ? `🔥 ~${kcal} سعرة · 🥩${mm.protein}غ · 🍞${mm.carbs}غ · 🧈${mm.fat}غ`
    : `🔥 ~${kcal} kcal · 🥩${mm.protein}g · 🍞${mm.carbs}g · 🧈${mm.fat}g`;
}

  const goal=P._foodGoal;

    msgEl.textContent = LANG==='ar'
      ? '🚫 لازم تدخل وزنك المستهدف وتختار مدة عشان نحسب وجباتك صح'

  }
  if(!weight||!targetWeight||!goal){ msgEl.textContent=''; return true; }
  if(goal==='lose' && targetWeight>weight){
    msgEl.textContent = LANG==='ar'
      ? `🚫 تناقض: اخترت "إنقاص وزن" بس وزنك المستهدف (${targetWeight}) أكبر من وزنك الحالي (${weight}) — هذا يعتبر زيادة وزن! غيّر الهدف أو رقم الوزن المستهدف.`
      : `🚫 Conflict: you picked "lose weight" but your target (${targetWeight}) is above your current weight (${weight}) — that's actually a gain! Change the goal or the target number.`;
    return false;
  }
  if(goal==='gain' && targetWeight<weight){
    msgEl.textContent = LANG==='ar'
      ? `🚫 تناقض: اخترت "زيادة وزن" بس وزنك المستهدف (${targetWeight}) أقل من وزنك الحالي (${weight}) — هذا يعتبر إنقاص وزن! غيّر الهدف أو رقم الوزن المستهدف.`
      : `🚫 Conflict: you picked "gain weight" but your target (${targetWeight}) is below your current weight (${weight}) — that's actually a loss! Change the goal or the target number.`;
    return false;
  }
  msgEl.textContent='';
  return true;
}

/* Push→Pull→Legs is a PERPETUAL rotation that only advances on training
   days — rest days are skipped without resetting or repeating the cycle.
   A fixed epoch (arbitrary, never changes) means the sequence stays
   consistent forever: whatever the last training day's muscle group was,
   the next training day (however many rest days away) always continues
   straight to the next one in the cycle. */
const WORKOUT_ROTATION_EPOCH=new Date(2024,0,1);
function workoutTypeForDate(dateObj,restDays){
  const weekdayIdx=(dateObj.getDay()+1)%7;
  if(restDays.includes(weekdayIdx)) return 'rest';
  const epochStart=new Date(WORKOUT_ROTATION_EPOCH.getFullYear(),WORKOUT_ROTATION_EPOCH.getMonth(),WORKOUT_ROTATION_EPOCH.getDate());
  const d=new Date(dateObj.getFullYear(),dateObj.getMonth(),dateObj.getDate());
  const totalDays=Math.round((d-epochStart)/86400000);
  const epochWeekday=(epochStart.getDay()+1)%7;
  const fullWeeks=Math.floor(totalDays/7);
  const remainder=((totalDays%7)+7)%7;
  const trainingPerWeek=7-restDays.length;
  let trainingInRemainder=0;
  for(let r=0;r<=remainder;r++){
    const wd=(epochWeekday+r)%7;
    if(!restDays.includes(wd)) trainingInRemainder++;
  }
  const trainingCount=fullWeeks*trainingPerWeek+trainingInRemainder;
  const cycle=['push','pull','legs'];
  return cycle[((trainingCount-1)%3+3)%3];
}
function datesForCurrentWeek(){
  const today=new Date();
  const todayIdx=(today.getDay()+1)%7;
  const satOfWeek=new Date(today.getFullYear(),today.getMonth(),today.getDate()-todayIdx);
  return Array.from({length:7},(_,i)=>new Date(satOfWeek.getFullYear(),satOfWeek.getMonth(),satOfWeek.getDate()+i));
}
function generateWeekPattern(restDays){
  return datesForCurrentWeek().map(d=>workoutTypeForDate(d,restDays));
}

/* activity factor now reflects actual training days/week (7 - restDays) instead
   of a flat 1.55 guess — standard Mifflin-St Jeor multiplier bands */
function activityFactor(){
  const ws=P.workoutSetup;
  if(!ws || !ws.restDays) return 1.55; // no workout setup yet: moderate default
  const trainingDays = 7 - ws.restDays.length;
  if(trainingDays<=4) return 1.46;   // 3-4 days/week: light-moderate
  if(trainingDays===5) return 1.55;  // 5 days/week: moderate
  if(trainingDays===6) return 1.725; // 6 days/week: very active
  return 1.9;                        // 7 days/week: extra active
}
function computeTDEE(){
  const fs=P.foodSetup||{};
  if(!fs.weight||!fs.height) return null;
  const age=fs.age||25;
  const bmr=(fs.sex==='female') ? (10*fs.weight+6.25*fs.height-5*age-161) : (10*fs.weight+6.25*fs.height-5*age+5);
  return bmr*activityFactor();
}
function weeklyRatePlan(){
  const fs=P.foodSetup||{};
  if(!fs.weight||!fs.targetWeight||!fs.targetDate) return null;
  const today=new Date(); today.setHours(0,0,0,0);
  const target=new Date(fs.targetDate+'T00:00:00');
  const weeksLeft=(target-today)/(1000*60*60*24*7);
  if(weeksLeft<=0) return null;
  const totalChange=fs.targetWeight-fs.weight;
  let weeklyRate=totalChange/weeksLeft;
  const capped=Math.abs(weeklyRate)>1;
  if(capped) weeklyRate = weeklyRate>0 ? 1 : -1;
  return {weeklyRateKg:weeklyRate,capped};
}
function calorieTarget(){
  const tdee=computeTDEE();
  if(!tdee) return null;
  const fs=P.foodSetup||{};
  const plan=weeklyRatePlan();
  if(plan){
    const dailyKcalAdjust=(plan.weeklyRateKg*7700)/7;
    return Math.max(1300,Math.round(tdee+dailyKcalAdjust));
  }
  return fs.goal==='lose' ? Math.max(1300,Math.round(tdee-450)) : Math.round(tdee+450);
}

/* session-only meal swap: alternates to the closest-kcal item in the same
   slot's pool (macros aren't tracked as data yet, so kcal-matching is the
   closest available guarantee until the meal library is structured data) */
let currentDayMeals=[];
function swapMealAt(i){
  const cur=currentDayMeals[i];
  const pool=getMealPoolForSlot(cur.key);
  const candidates=pool.filter(p=>p.ar!==cur.ar);
  if(!candidates.length) return;
  candidates.sort((a,b)=>Math.abs(a.kcal-cur.kcal)-Math.abs(b.kcal-cur.kcal));
  const next=candidates[0];
  currentDayMeals[i]={...cur,ar:next.ar,en:next.en,kcal:next.kcal};
  renderMealBlock(i);
}
function renderMealBlock(i){
  const m=currentDayMeals[i];
  const container=document.getElementById('mealBlocks'); if(!container) return;
  const tr=transformMeal(m[LANG],LANG);
  let block=document.getElementById('mealBlock'+i);
  if(!block){ block=document.createElement('div'); block.className='meal'; block.id='mealBlock'+i; container.appendChild(block); }
  block.innerHTML=`<div class="label"><span>${m.label[LANG]}</span></div><div class="content">${tr.text}</div><div class="meal-macro-line">${mealMacroLabel(m.kcal)}</div>`;
  if(tr.touched) block.innerHTML+=`<div class="info-chip" style="margin-top:6px;">${t('allergy_note')}</div>`;
  block.innerHTML+=`<button type="button" class="edit-btn" style="margin-top:6px;" onclick="swapMealAt(${i})">🔄 ${LANG==='ar'?'استبدال الوجبة':'Swap meal'}</button>`;
}

  if(base.tierNotes && !day.skippedByInjury){

function showFeedbackPrompt(typeKey){
  const row=document.getElementById('feedbackRow'); if(!row) return;

    </div></div>`;
  row.querySelectorAll('[data-fb]').forEach(btn=>btn.addEventListener('click',async()=>{
    let bump = btn.dataset.fb==='easy' ? 1 : (btn.dataset.fb==='hard' ? -1 : 0);
    P.workoutCounts=P.workoutCounts||{push:1,pull:1,legs:1};
    P.goodStreak=P.goodStreak||{push:0,pull:0,legs:0};
    P.exerciseLevel=P.exerciseLevel||{push:'amateur',pull:'amateur',legs:'amateur'};
    const current=P.workoutCounts[typeKey]!==undefined?P.workoutCounts[typeKey]:1;
    let autoNudged=false, leveledUp=false, leveledDown=false;
    if(btn.dataset.fb==='good'){
      P.goodStreak[typeKey]=(P.goodStreak[typeKey]||0)+1;
      if(P.goodStreak[typeKey]>=5){ bump=1; autoNudged=true; P.goodStreak[typeKey]=0; }
    } else {
      P.goodStreak[typeKey]=0;
    }
    const LEVELS=['beginner','amateur','pro'];
    const curLevel=P.exerciseLevel[typeKey]||'amateur';
    const curLevelIdx=LEVELS.indexOf(curLevel);
    let atAbsoluteMax=false, atAbsoluteMin=false;
    if(bump>0 && current>=4){
      if(curLevelIdx<2){ P.exerciseLevel[typeKey]=LEVELS[curLevelIdx+1]; P.workoutCounts[typeKey]=1; leveledUp=true; }
      else { P.workoutCounts[typeKey]=4; atAbsoluteMax=true; }
    } else if(bump<0 && current<=0){
      if(curLevelIdx>0){ P.exerciseLevel[typeKey]=LEVELS[curLevelIdx-1]; P.workoutCounts[typeKey]=3; leveledDown=true; }
      else { P.workoutCounts[typeKey]=0; atAbsoluteMin=true; }
    } else {
      P.workoutCounts[typeKey]=Math.min(4,Math.max(0,current+bump));
    }
    dailyTrack.feedbackGiven=true;
    await storageSet('profile',JSON.stringify(P));
    await saveDailyTrack();
    const levelNameAr={beginner:'مبتدئ',amateur:'متوسط',pro:'محترف'}, levelNameEn={beginner:'beginner',amateur:'amateur',pro:'pro'};
    const msg = leveledUp
      ? (LANG==='ar'?`🎉 ترقيت لمستوى "${levelNameAr[P.exerciseLevel[typeKey]]}"! التمارين نفسها بتتغير المرة الجاية`:`🎉 Leveled up to "${levelNameEn[P.exerciseLevel[typeKey]]}"! The exercises themselves change next time`)
      : leveledDown
      ? (LANG==='ar'?`📉 رجعناك لمستوى "${levelNameAr[P.exerciseLevel[typeKey]]}" عشان تبني الأساس صح — التمارين بتتغير المرة الجاية`:`📉 Dropped to "${levelNameEn[P.exerciseLevel[typeKey]]}" to build the right foundation — exercises change next time`)
      : atAbsoluteMax
      ? (LANG==='ar'?'🔥 تسجل — أنت عند أعلى مستوى وأصعب صعوبة أصلاً، ما فيه أصعب من كذا حالياً':"🔥 Logged — you're already at the highest level and hardest difficulty, nothing harder for now")
      : atAbsoluteMin
      ? (LANG==='ar'?'🌱 تسجل — أنت عند أخف مستوى وأسهل صعوبة أصلاً، خذ وقتك وابني الأساس':"🌱 Logged — you're already at the lightest level and easiest difficulty, take your time building the foundation")
      : autoNudged

      : btn.dataset.fb==='hard'

  }));

const GOAL_WEIGHT=70, START_WEIGHT=61;

function renderLog(){
  const list=document.getElementById('logList'); if(!list) return;
  if(!weightLog.length){ list.innerHTML=`<div class="log-empty">${t('log_empty')}</div>`; return; }
  let html='';
  weightLog.slice().reverse().forEach((e,idx)=>{
    const ri=weightLog.length-1-idx; const prev=ri>0?weightLog[ri-1].kg:START_WEIGHT;
    const diff=(e.kg-prev).toFixed(1);
    html+=`<div class="log-row"><span>${e.date}</span><span class="kg">${e.kg} ${t('kg')}</span><span class="diff ${diff>=0?'up':'down'}">${diff>=0?'+':''}${diff}</span></div>`;
  });
  list.innerHTML=html;

function renderChart(svgId,h){
  svgId=svgId||'weightChart'; h=h||140;
  const svg=document.getElementById(svgId); if(!svg) return; svg.innerHTML='';
  const w=320,pad=20;
  if(weightLog.length<2){ svg.innerHTML=`<text x="${w/2}" y="${h/2}" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.5">${t('chart_need2')}</text>`; return; }
  const vals=weightLog.map(e=>e.kg);
  const minV=Math.min(...vals,START_WEIGHT)-0.5, maxV=Math.max(...vals,GOAL_WEIGHT)+0.5, range=maxV-minV||1;
  const stepX=(w-pad*2)/(weightLog.length-1);
  const yF=v=>h-pad-((v-minV)/range)*(h-pad*2), xF=i=>pad+i*stepX;
  const gY=yF(GOAL_WEIGHT);
  let s=`<line x1="${pad}" y1="${gY}" x2="${w-pad}" y2="${gY}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="4,4"/>`;
  s+=`<polyline points="${weightLog.map((e,i)=>`${xF(i)},${yF(e.kg)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  weightLog.forEach((e,i)=>{ s+=`<circle cx="${xF(i)}" cy="${yF(e.kg)}" r="3.5" fill="var(--accent-deep)"/>`; });
  svg.innerHTML=s;
}

  html+=`<button class="setup-btn" id="calDetailBtn" style="margin-top:14px;">${LANG==='ar'?'🕐 عرض بالتفصيل (بالساعة)':'🕐 Show hour-by-hour detail'}</button>`;
