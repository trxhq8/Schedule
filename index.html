/* ================= FRIENDS ARCHITECTURE (real Firebase Auth + Firestore) =================
   Layering:  Firebase Auth  →  P.publicProfile (local source of truth for
   YOUR OWN settings, mirrored out)  →  PublicProfileService (read/write the
   public profile doc)  →  FriendService / ActivityService / LeaderboardService
   (friend graph, feed, rankings)  →  the render/open functions at the
   bottom. No Firestore call for any of this happens outside this section —
   nothing scattered into random UI handlers.

   Design note on privacy: a friendship grants read access to the other
   person's whole public profile DOCUMENT (Firestore security rules are
   document-level, not field-level) — the privacy.* toggles are enforced by
   the render functions below, which simply omit a category its owner has
   switched off. This is the same model Strava/Instagram-style "hide my
   activity" toggles use: the number exists on the server, the toggle
   controls what's displayed. True per-field access control would need a
   separate document per privacy category, which is a much bigger change
   than this feature calls for — noted here rather than hidden. */
function usersCol(){ return fbDb.collection('users'); }
function usernamesCol(){ return fbDb.collection('usernames'); }
function friendRequestsCol(){ return fbDb.collection('friendRequests'); }
function friendshipsCol(){ return fbDb.collection('friendships'); }
function activityCol(){ return fbDb.collection('activity'); }
function leaderboardEntriesCol(){ return fbDb.collection('leaderboardEntries'); }
function friendChallengesCol(){ return fbDb.collection('friendChallenges'); }
function pairId(a,b){ return a<b ? a+'_'+b : b+'_'+a; }
function defaultPrivacy(){ return {profileVisibility:'friends', training:true, nutrition:true, achievements:true, collection:true, activity:true, leaderboardGlobal:false}; }
function serverNow(){ return firebase.firestore.FieldValue.serverTimestamp(); }

const PublicProfileService={
  usernameRegex:/^[a-z0-9_]{3,20}$/,
  hasProfile(){ return !!(P.publicProfile && P.publicProfile.username); },
  async checkUsernameAvailable(rawUsername){
    const uname=String(rawUsername||'').trim().toLowerCase();
    if(!this.usernameRegex.test(uname)) return {ok:false, reason:'invalid'};
    try{ const doc=await usernamesCol().doc(uname).get(); return {ok:!doc.exists, reason:doc.exists?'taken':null}; }
    catch(e){ return {ok:false, reason:'error'}; }
  },
  /* two writes: claim the username doc (fails server-side if it exists —
     see the rules' create-only match), then create the public profile doc
     itself. If the username doc write is rejected, nothing else runs. */
  async claimUsername(rawUsername, displayName, avatar){
    if(!fbDb||!currentUser) throw new Error('offline');
    const uname=String(rawUsername||'').trim().toLowerCase();
    if(!this.usernameRegex.test(uname)) throw new Error(t('username_invalid'));
    try{ await usernamesCol().doc(uname).set({uid:currentUser.uid, createdAt:serverNow()}); }
    catch(e){ throw new Error(t('username_taken')); }
    const privacy=defaultPrivacy();
    const stats=await computeUserStats();
    const titles=unlockedTitles(stats).map(x=>x.id);
    await usersCol().doc(currentUser.uid).set({
      uid:currentUser.uid, username:uname, displayName:displayName||uname, avatar:avatar||'🙂',
      privacy, stats, titles, createdAt:serverNow(), updatedAt:serverNow()
    });
    P.publicProfile={username:uname, displayName:displayName||uname, avatar:avatar||'🙂', privacy};
    await storageSet('profile',JSON.stringify(P));
    return uname;
  },
  /* changes an ALREADY-claimed username. Claims the new handle first
     (create-fails-if-taken, same race protection as claimUsername), only
     repoints users/{uid}.username at it once that succeeds, and only
     THEN releases the old handle — so a failed or interrupted change
     never leaves the account's old username floating deleted while the
     new one didn't actually go through. Freeing the old handle (instead
     of leaving it reserved forever) needs the rules to allow deleting
     your OWN usernames/{name} doc — see the rules file's `friendRequests`-
     adjacent `usernames` match, updated alongside this. */
  async changeUsername(rawUsername){
    if(!fbDb||!currentUser) throw new Error('offline');
    if(!this.hasProfile()) throw new Error('no profile yet');
    const uname=String(rawUsername||'').trim().toLowerCase();
    if(!this.usernameRegex.test(uname)) throw new Error(t('username_invalid'));
    const oldUname=P.publicProfile.username;
    if(uname===oldUname) return uname; // unchanged — nothing to do
    try{ await usernamesCol().doc(uname).set({uid:currentUser.uid, createdAt:serverNow()}); }
    catch(e){ throw new Error(t('username_taken')); }
    // `uid` is included even though it never actually changes — a merge
    // write against a doc that doesn't exist (e.g. local state says a
    // profile exists but the Firestore doc was never actually created)
    // is evaluated by the rules as a CREATE, which requires uid to be
    // present and match; omitting it here caused exactly that write to
    // be denied with a raw "Missing or insufficient permissions" error.
    await usersCol().doc(currentUser.uid).set({uid:currentUser.uid, username:uname, updatedAt:serverNow()},{merge:true});
    P.publicProfile.username=uname;
    await storageSet('profile',JSON.stringify(P));
    // best-effort: the new username is already claimed and saved above,
    // so even if this fails (offline, rules not yet updated on an older
    // deploy, etc.) the account is still left in a fully consistent state
    // — the old handle just stays reserved instead of freeing up.
    await usernamesCol().doc(oldUname).delete().catch(()=>{});
    return uname;
  },
  async updatePrivacy(partial){
    if(!this.hasProfile()) return;
    P.publicProfile.privacy={...P.publicProfile.privacy, ...partial};
    await storageSet('profile',JSON.stringify(P));
    await usersCol().doc(currentUser.uid).set({uid:currentUser.uid, privacy:P.publicProfile.privacy, updatedAt:serverNow()},{merge:true});
    if(partial.leaderboardGlobal===false) await leaderboardEntriesCol().doc(currentUser.uid).delete().catch(()=>{});
    else if(partial.leaderboardGlobal===true) await this.syncStats();
  },
  /* the ONLY place your public mirror's stats/titles are pushed out — called
     from notifyNewUnlocks() (the app's existing single convergence point
     after every real completion event), never from random UI handlers. */
  async syncStats(){
    if(!this.hasProfile()||!fbDb||!currentUser) return;
    try{
      const stats=await computeUserStats();
      const titles=unlockedTitles(stats).map(x=>x.id);
      await usersCol().doc(currentUser.uid).set({uid:currentUser.uid, stats,titles,updatedAt:serverNow()},{merge:true});
      if(P.publicProfile.privacy.leaderboardGlobal){
        await leaderboardEntriesCol().doc(currentUser.uid).set({
          uid:currentUser.uid, displayName:P.publicProfile.displayName, avatar:P.publicProfile.avatar,
          xp:stats.xp, level:stats.level, totalWorkouts:stats.totalWorkouts, achievementsUnlocked:stats.achievementsUnlocked,
          bestStreak:stats.bestStreak, totalCollected:stats.totalCollected, nutritionDaysHit:stats.nutritionDaysHit, waterDaysHit:stats.waterDaysHit,
          updatedAt:serverNow()
        });
      }
    }catch(e){ /* offline/transient — the next real completion event retries via this same hook */ }
  },
  async getProfile(uid){
    try{ const doc=await usersCol().doc(uid).get(); return doc.exists?{uid,...doc.data()}:null; }
    catch(e){ return {uid, restricted:true}; } // exists but rules denied us (not friends, not public) — treated as "can't view", not "doesn't exist"
  },
  async searchByUsername(rawUsername){
    const uname=String(rawUsername||'').trim().toLowerCase();
    if(!uname) return null;
    const unameDoc=await usernamesCol().doc(uname).get();
    if(!unameDoc.exists) return null;
    const uid=unameDoc.data().uid;
    if(uid===currentUser.uid) return {uid, self:true};
    const profile=await this.getProfile(uid);
    // profile exists but the read was denied (their visibility isn't public
    // and we're not friends yet) — keep the username we already have from
    // the public usernames lookup so the UI can still show *something* real
    // and still let the user send a request, instead of literal "undefined".
    if(profile&&profile.restricted) return {uid, username:uname, restricted:true};
    return profile;
  }
};

const FriendService={
  async requestStatusWith(uid){
    const me=currentUser.uid;
    const fr=await friendshipsCol().doc(pairId(me,uid)).get().catch(()=>null);
    if(fr&&fr.exists) return 'friends';
    const out=await friendRequestsCol().doc(me+'_'+uid).get().catch(()=>null);
    if(out&&out.exists&&out.data().status==='pending') return 'outgoing';
    const inc=await friendRequestsCol().doc(uid+'_'+me).get().catch(()=>null);
    if(inc&&inc.exists&&inc.data().status==='pending') return 'incoming';
    return 'none';
  },
  async sendRequest(targetUid){
    const me=currentUser.uid;
    if(targetUid===me) throw new Error('self');
    // if they already sent YOU one, accept theirs instead of creating a
    // second, opposite-direction pending request for the same pair
    const incoming=await friendRequestsCol().doc(targetUid+'_'+me).get();
    if(incoming.exists && incoming.data().status==='pending') return this.respondToRequest(targetUid+'_'+me,'accepted');
    await friendRequestsCol().doc(me+'_'+targetUid).set({fromUid:me, toUid:targetUid, status:'pending', createdAt:serverNow()});
  },
  async cancelRequest(targetUid){
    await friendRequestsCol().doc(currentUser.uid+'_'+targetUid).update({status:'cancelled'});
  },
  async respondToRequest(reqId,status){
    await friendRequestsCol().doc(reqId).update({status, respondedAt:serverNow()});
    if(status==='accepted'){
      const [fromUid,toUid]=reqId.split('_');
      const uidA=fromUid<toUid?fromUid:toUid, uidB=fromUid<toUid?toUid:fromUid;
      await friendshipsCol().doc(uidA+'_'+uidB).set({uidA,uidB,members:[uidA,uidB],createdAt:serverNow()});
      const otherUid=fromUid===currentUser.uid?toUid:fromUid;
      const otherProfile=await PublicProfileService.getProfile(otherUid).catch(()=>null);
      await ActivityService.post('friend_added',{withName:(otherProfile&&otherProfile.displayName)||'?'});
    }
  },
  async listIncomingRequests(){
    const snap=await friendRequestsCol().where('toUid','==',currentUser.uid).where('status','==','pending').get();
    const reqs=snap.docs.map(d=>({id:d.id,...d.data()}));
    return Promise.all(reqs.map(async r=>({...r, profile:await PublicProfileService.getProfile(r.fromUid)})));
  },
  async listOutgoingRequests(){
    const snap=await friendRequestsCol().where('fromUid','==',currentUser.uid).where('status','==','pending').get();
    const reqs=snap.docs.map(d=>({id:d.id,...d.data()}));
    return Promise.all(reqs.map(async r=>({...r, profile:await PublicProfileService.getProfile(r.toUid)})));
  },
  async listFriends(){
    const me=currentUser.uid;
    const snap=await friendshipsCol().where('members','array-contains',me).get();
    const uids=snap.docs.map(d=>{ const dt=d.data(); return dt.uidA===me?dt.uidB:dt.uidA; });
    const profiles=await Promise.all(uids.map(uid=>PublicProfileService.getProfile(uid)));
    return profiles.filter(Boolean);
  },
  async removeFriend(otherUid){
    await friendshipsCol().doc(pairId(currentUser.uid,otherUid)).delete();
  }
};

const ActivityService={
  async post(type,data){
    if(!PublicProfileService.hasProfile()) return; // no public profile yet — nothing for a friend to read anyway
    try{ await activityCol().add({uid:currentUser.uid, type, data:data||{}, createdAt:serverNow()}); }
    catch(e){ /* best-effort — never block the real action (workout/achievement/etc.) that triggered this */ }
  },
  /* deliberately NOT using orderBy alongside the "in" filter here — that
     combination needs a composite index Firestore would have to be asked
     to build. Sorting the (capped, ≤100) result client-side avoids that
     dependency entirely for this size of friend list. */
  async listFeed(){
    const friends=await FriendService.listFriends();
    const uids=[currentUser.uid, ...friends.map(f=>f.uid)].slice(0,30);
    if(!uids.length) return [];
    try{
      const snap=await activityCol().where('uid','in',uids).limit(100).get();
      const docs=snap.docs.map(d=>({id:d.id,...d.data()}));
      docs.sort((a,b)=>(b.createdAt&&b.createdAt.toMillis?b.createdAt.toMillis():0)-(a.createdAt&&a.createdAt.toMillis?a.createdAt.toMillis():0));
      return docs.slice(0,30);
    }catch(e){ return []; }
  }
};

  {id:'nutrition', icon:'🍽️', metric:'nutritionDaysHit', privacyKey:'nutrition', labelEn:'Nutrition', labelAr:'التغذية', unitEn:'days', unitAr:'يوم'},

const LeaderboardService={
  /* 'global' reads the slim opt-in leaderboardEntries mirror (public to any
     signed-in user, by design — that's what opting in means); 'friends'
     reads each friend's real profile doc directly, honoring whichever
     per-category privacy flag that category maps to. Both are 100% real
     Firestore reads — there is no local/demo fallback in either branch. */
  async getLeaderboard(categoryId, scope){
    const cat=LEADERBOARD_CATEGORIES.find(c=>c.id===categoryId)||LEADERBOARD_CATEGORIES[0];
    const you=await computeUserStats();
    let others=[];
    if(scope==='global'){
      try{
        const snap=await leaderboardEntriesCol().orderBy(cat.metric,'desc').limit(50).get();
        others=snap.docs.map(d=>d.data()).filter(r=>r.uid!==currentUser.uid);
      }catch(e){ others=[]; }
    } else {
      const friends=await FriendService.listFriends();
      others=friends
        .filter(f=>!cat.privacyKey || (f.privacy&&f.privacy[cat.privacyKey]!==false))
        .map(f=>({uid:f.uid, displayName:f.displayName, avatar:f.avatar, ...(f.stats||{})}));
    }
    const rows=[{name:t('lb_you'), isMe:true, avatar:'⭐', ...you}, ...others.map(o=>({name:o.displayName, avatar:o.avatar, ...o}))];
    rows.sort((a,b)=>(b[cat.metric]||0)-(a[cat.metric]||0));
    return {category:cat, rows};
  }
};

/* ---- Friend-vs-friend challenges ----
   A challenge doc is created ONCE with both participants' starting stat
   value baked in (startValues), so "progress" is always "how much have you
   moved the metric SINCE the challenge began", never the lifetime total —
   two people starting a "most workouts" challenge mid-way through their
   own histories still compete on a level footing. Per the security rules,
   after creation only `progress.<your own uid>` and `updatedAt` may ever
   change, and only by you — nobody can edit the target, the metric, or the
   other participant's number. There is no separate "winner" field; a
   challenge's status (still open / someone hit target) is always derived
   live from the two real progress numbers, never stored, so it can never
   drift out of sync with what actually happened. */
const ChallengeService={
  async create(friendUid, metric, target){
    const me=currentUser.uid;
    const myStats=await computeUserStats();
    const friendProfile=await PublicProfileService.getProfile(friendUid);
    const friendStats=(friendProfile&&friendProfile.stats)||{};
    const doc={
      createdBy:me,
      participantUids:[me,friendUid],
      metric, target,
      startValues:{[me]:myStats[metric]||0, [friendUid]:friendStats[metric]||0},
      progress:{[me]:0, [friendUid]:0},
      createdAt:serverNow(), updatedAt:serverNow()
    };
    const ref=await friendChallengesCol().add(doc);
    await ActivityService.post('friend_challenge_started',{withName:(friendProfile&&friendProfile.displayName)||'?', metric});
    return ref.id;
  },
  async listMine(){
    const me=currentUser.uid;
    const snap=await friendChallengesCol().where('participantUids','array-contains',me).get();
    const rows=snap.docs.map(d=>({id:d.id,...d.data()}));
    const withProfiles=await Promise.all(rows.map(async r=>{
      const otherUid=r.participantUids.find(u=>u!==me);
      const profile=await PublicProfileService.getProfile(otherUid).catch(()=>null);
      return {...r, otherUid, otherProfile:profile};
    }));
    withProfiles.sort((a,b)=>(b.createdAt&&b.createdAt.toMillis?b.createdAt.toMillis():0)-(a.createdAt&&a.createdAt.toMillis?a.createdAt.toMillis():0));
    return withProfiles;
  },
  /* recomputes and pushes only YOUR OWN progress number for one challenge —
     called whenever the challenges tab renders, so numbers are always
     fresh without needing a background job. */
  async syncMyProgress(challenge){
    const me=currentUser.uid;
    const start=(challenge.startValues&&challenge.startValues[me])||0;
    const stats=await computeUserStats();
    const current=Math.max(0,(stats[challenge.metric]||0)-start);
    if(challenge.progress&&challenge.progress[me]===current) return current;
    try{ await friendChallengesCol().doc(challenge.id).update({['progress.'+me]:current, updatedAt:serverNow()}); }catch(e){}
    return current;
  }
};

const AVATAR_CHOICES=['🙂','😎','🦁','🐯','🐺','🦊','🐼','🐸','🐵','🦉','🦅','🐢','🐙','🌵','⚡','🔥','🌟','🥷','🧗','🏃'];
function initProfileSetupCard(){
  const grid=document.getElementById('avatarPickerGrid');
  if(!grid.dataset.built){
    grid.innerHTML=AVATAR_CHOICES.map(a=>`<div class="avatar-choice" data-avatar="${a}">${a}</div>`).join('');
    grid.dataset.built='1';
    grid.dataset.selected=AVATAR_CHOICES[0];
    grid.querySelectorAll('.avatar-choice').forEach(el=>el.addEventListener('click',()=>{
      grid.querySelectorAll('.avatar-choice').forEach(c=>c.classList.remove('selected'));
      el.classList.add('selected'); grid.dataset.selected=el.dataset.avatar;
    }));
    grid.querySelector('.avatar-choice').classList.add('selected');
  }
  const unameInp=document.getElementById('usernameInput');
  const msgEl=document.getElementById('usernameCheckMsg');
  const saveBtn=document.getElementById('saveProfileBtn');
  if(!document.getElementById('displayNameInput').value) document.getElementById('displayNameInput').value=P.name||'';
  let checkToken=0;
  const runCheck=async()=>{
    const val=unameInp.value.trim();
    if(!val){ msgEl.textContent=''; msgEl.className='username-check-msg'; saveBtn.disabled=true; return; }
    if(!PublicProfileService.usernameRegex.test(val.toLowerCase())){
      msgEl.textContent=t('username_invalid'); msgEl.className='username-check-msg bad'; saveBtn.disabled=true; return;
    }
    msgEl.textContent=t('username_checking'); msgEl.className='username-check-msg'; saveBtn.disabled=true;
    const myToken=++checkToken;
    const res=await PublicProfileService.checkUsernameAvailable(val);
    if(myToken!==checkToken) return; // a newer keystroke already superseded this check
    if(res.ok){ msgEl.textContent=t('username_available'); msgEl.className='username-check-msg ok'; saveBtn.disabled=false; }
    else{ msgEl.textContent=t(res.reason==='taken'?'username_taken':'username_invalid'); msgEl.className='username-check-msg bad'; saveBtn.disabled=true; }
  };
  if(!unameInp.dataset.wired){
    unameInp.dataset.wired='1';
    let debounceT=null;
    unameInp.addEventListener('input',()=>{ clearTimeout(debounceT); debounceT=setTimeout(runCheck,400); });
    saveBtn.addEventListener('click',async()=>{
      saveBtn.disabled=true;
      try{
        await PublicProfileService.claimUsername(unameInp.value, document.getElementById('displayNameInput').value.trim(), grid.dataset.selected);
        showToast(LANG==='ar'?'تم إنشاء ملفك العام 🎉':'Public profile created 🎉','success');
        // username requirement now satisfied — usernameHardGateActive()/
        // usernameSoftGateActive() both immediately return false, so
        // send the person straight into the normal app instead of leaving
        // them sitting on the setup screen they just finished.
        refreshHome();
        showPanel('home');
      }catch(e){
        msgEl.textContent=e.message; msgEl.className='username-check-msg bad'; saveBtn.disabled=false;
      }
    });
  }
}
function relTimeFromTimestamp(ts){
  if(!ts||!ts.toMillis) return '';
  const ms=Date.now()-ts.toMillis();
  const mins=Math.floor(ms/60000);
  if(mins<1) return LANG==='ar'?'الحين':'now';
  if(mins<60) return mins+(LANG==='ar'?'د':'m');
  const hrs=Math.floor(mins/60);

}
function activityLine(a, isMine){

  });

  const firstWeekday=(firstOfMonth.getDay()+1)%7;
  const daysInMonth=new Date(calViewYear,calViewMonth+1,0).getDate();
  for(let i=0;i<firstWeekday;i++){ const e=document.createElement('div'); e.className='cal-cell empty'; grid.appendChild(e); }
  const today=new Date();
  for(let d=1; d<=daysInMonth; d++){
    const cell=document.createElement('div'); cell.className='cal-cell';
    const isToday=(d===today.getDate()&&calViewMonth===today.getMonth()&&calViewYear===today.getFullYear());
    if(isToday) cell.classList.add('today');

    cell.textContent=d;
    cell.addEventListener('click',()=>openCalendarDay(calViewYear,calViewMonth,d));
    grid.appendChild(cell);

function calDateKey(y,m,d){ return `daily-track:${y}-${m+1}-${d}`; }
async function openCalendarDay(y,m,d){
  const dateObj=new Date(y,m,d);
  const label=dateObj.toLocaleDateString(LANG==='ar'?'ar-EG':'en-GB',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('dayTitle').textContent=`📅 ${label}`;
  document.getElementById('daySubtitle').textContent='';
  const commitments=commitmentsForDate(dateObj).slice().sort((a,b)=>{
    const sa=commitTimeSpan(a), sb=commitTimeSpan(b);
    return (sa?sa.start:-1)-(sb?sb.start:-1);
  });
  const dateKey=calDateKey(y,m,d);
  let dayTrack={agenda:{}};
  try{ const v=await storageGet(dateKey); if(v) dayTrack={agenda:{},...JSON.parse(v)}; }catch(e){}
  let html='';
  if(commitments.length){
    html+=`<div class="total-kcal" style="font-size:1rem;">${LANG==='ar'?'📌 عندك':'📌 You have'}</div>`;
    // each commitment shown ONCE with its own real time range (this is what
    // was missing before — several genuinely different time blocks with the
    // same label, e.g. several class periods, used to render as identical-
    // looking rows with no time at all, which read as duplicated spam).
    const dayConflicts=findAllScheduleConflicts(commitments).filter(cf=>cf.kind==='overlap');
    const conflicted=new Set(); dayConflicts.forEach(cf=>{ conflicted.add(cf.a); conflicted.add(cf.b); });
    commitments.forEach(c=>{
      const badge=conflicted.has(c)?`<span style="color:var(--err);font-weight:700;">${t('conflict_badge')} </span>`:'';
      html+=`<div class="meal"><div class="content">${badge}📌 ${c.label} <span style="color:var(--ink-soft);font-size:0.85em;">(${formatCommitRange(c)})</span></div></div>`;
    });
  } else {
    html+=`<div class="total-kcal" style="font-size:1rem;">${LANG==='ar'?'✅ يوم فاضي، ما عندك التزامات':'✅ Free day, no commitments'}</div>`;
  }
  const noteEntries=Object.entries(dayTrack.agenda||{});
  noteEntries.forEach(([slot,note])=>{ html+=`<div class="meal"><div class="content">📌 ${note}</div></div>`; });
  html+=`<button class="setup-btn" id="calDetailBtn" style="margin-top:14px;">${LANG==='ar'?'🕐 عرض بالتفصيل (بالساعة)':'🕐 Show hour-by-hour detail'}</button>`;
  html+=`<div id="calDetailArea" class="agenda-list" style="margin-top:14px;"></div>`;
  document.getElementById('cardBody').innerHTML=html;
  overlay.classList.add('open');
  document.getElementById('calDetailBtn').addEventListener('click',()=>{
    document.getElementById('calDetailBtn').classList.add('hidden');
    renderCalDetail(dateKey,commitments,dayTrack);
  });
}
function calAutoLabelForSlot(slot,commitments){
  const [s0,s1]=slotRange(slot);
  const hits=commitments.filter(c=>{
    if(!c.from||!c.to) return false; // all-day commitment has no specific hour — it's a day-level reminder (shown separately above), never injected into an hourly slot
    const c0=parseHM(c.from),c1=parseHM(c.to);
    if(c1>c0) return s0<c1 && c0<s1;
    return (c0<s1) || (s0<c1);
  });
  return hits.length ? hits.map(c=>c.label).join(' + ') : '';
}
function renderCalDetail(dateKey,commitments,dayTrack){

function openCalSlotEdit(el,slot,auto,dateKey,dayTrack){
  if(el.querySelector('.agenda-edit')) return;
  const current=(dayTrack.agenda[slot]!==undefined) ? dayTrack.agenda[slot] : auto;
  el.innerHTML=`<div class="time">${formatSlot12h(slot)}</div><input class="agenda-edit" value="${current.replace(/"/g,'&quot;')}" placeholder="${LANG==='ar'?'شنو عندك بهالوقت؟':"What's on?"}">`;
  const input=el.querySelector('.agenda-edit');
  input.focus();
  async function commit(){
    const val=input.value.trim();
    if(val && val!==auto) dayTrack.agenda[slot]=val;
    else delete dayTrack.agenda[slot];
    await storageSet(dateKey,JSON.stringify(dayTrack));
    const note=(dayTrack.agenda[slot]!==undefined) ? dayTrack.agenda[slot] : auto;
    el.innerHTML=`<div class="time">${formatSlot12h(slot)}</div><div class="note${note?'':' empty'}">${note||t('no_note')}</div>`;
  }
  input.addEventListener('blur',commit);
  input.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); input.blur(); } });
}

/* ================= HOME DASHBOARD (Daily Summary) =================
   Single glance-and-know surface. Every number here is read from state that
   already exists elsewhere (today's menu, dailyTrack, foodSetup,
   workoutSetup) — nothing is computed independently a second time, and
   nothing is shown as a fake/placeholder number: sections hide themselves
   and show an explicit "not set up" message when the underlying data
   doesn't exist yet. */
function renderDailySummary(){
  document.getElementById('dashCalTitle').textContent=t('dash_cal_title');
  document.getElementById('dashCalPlannedLbl').textContent=t('dash_cal_planned');
  document.getElementById('dashCalConsumedLbl').textContent=t('dash_cal_consumed');
  document.getElementById('dashCalRemainingLbl').textContent=t('dash_cal_remaining');
  document.getElementById('dashWorkoutTitle').textContent=t('dash_workout_title');
  document.getElementById('dashWaterTitle').textContent=t('dash_water_title');
  document.getElementById('dashHabitsTitle').textContent=t('dash_habits_title');
  const habitAddInp=document.getElementById('dashHabitAdd'); if(habitAddInp) habitAddInp.placeholder=t('habit_add_ph');

  // ---- calories: planned (today's actual generated menu) vs consumed
  // (only the meal slots the user has actually checked off as eaten) ----
  const calRow=document.getElementById('dashCalRow');
  const calEmpty=document.getElementById('dashCalEmpty');
  if(!P.foodSetup){
    calRow.classList.add('hidden'); calEmpty.classList.remove('hidden');

  } else {
    calRow.classList.remove('hidden'); calEmpty.classList.add('hidden');

    const v=getTodayMenu(idx);
    const doneFlags=dailyTrack.meals||[];
    let consumed=0;
    v.meals.forEach((m,i)=>{ if(doneFlags[i]) consumed+=(m.calories||0); });
    const planned=Math.round(v.calories);
    const remaining=Math.max(0,planned-Math.round(consumed));
    document.getElementById('dashCalPlanned').textContent=planned;
    document.getElementById('dashCalConsumed').textContent=Math.round(consumed);
    document.getElementById('dashCalRemaining').textContent=remaining;
  }

  // ---- today's workout ----

  } else {

  // ---- water (same dailyTrack.water state as the Food panel's water card) ----

  document.getElementById('dashSuppMini').innerHTML=supList.length
    ? `${t('dash_supp_mini')}<span class="n">${supList.filter((s,i)=>dailyTrack.supplements['other'+i]).length}/${supList.length}</span>`

  renderHabits();
}

/* ---- habits: per-day completion lives in dailyTrack.habits (same doc as
   meals/supplements/water — no separate storage key), the habit LIST itself
   lives in P.habits (part of the profile, like foodSetup/workoutSetup).
   Streaks are computed from real historical daily-track docs, never faked. */
function habitLabelText(h){ return (typeof h.label==='object') ? (h.label[LANG]||h.label.en) : h.label; }
function renderHabits(){
  const list=document.getElementById('dashHabitsList'); if(!list) return;
  const habits=P.habits||[];
  if(!habits.length){
    list.innerHTML=`<div class="dash-empty">${LANG==='ar'?'ضيف عادة تبي تتابعها':'Add a habit to start tracking it'}</div>`;
    return;
  }
  list.innerHTML='';
  habits.forEach(h=>{
    const done=!!(dailyTrack.habits&&dailyTrack.habits[h.id]);
    const row=document.createElement('div');
    row.className='habit-row'+(done?' done':'');
    row.innerHTML=`<div class="habit-box">${done?'✓':''}</div><div class="habit-label">${habitLabelText(h)}</div><div class="habit-streak" id="habitStreak_${h.id}"></div><button type="button" class="habit-remove">✕</button>`;
    row.addEventListener('click',(e)=>{
      if(e.target.closest('.habit-remove')) return;
      // optimistic: flip the in-memory state and repaint THIS row immediately,
      // synchronously, before anything touches the network — the person
      // sees their tap register instantly. Saving/XP/achievements happen in
      // the background afterward and never block or delay the checkmark.
      dailyTrack.habits=dailyTrack.habits||{};
      const nowDone=!dailyTrack.habits[h.id];
      dailyTrack.habits[h.id]=nowDone;
      row.classList.toggle('done',nowDone);
      row.querySelector('.habit-box').textContent=nowDone?'✓':'';
      // XP guard flag is also set synchronously, right here — so a second
      // rapid click (while the first click's save is still in flight below)
      // sees it already claimed and can never double-award, and two
      // overlapping saves can never leave habits/xpAwarded inconsistent
      // with each other since each save snapshots the whole (already
      // fully-updated) dailyTrack object at call time, not at completion.
      dailyTrack.xpAwarded=dailyTrack.xpAwarded||{}; dailyTrack.xpAwarded.habits=dailyTrack.xpAwarded.habits||{};
      const justEarnedXp = nowDone && !dailyTrack.xpAwarded.habits[h.id];
      if(justEarnedXp) dailyTrack.xpAwarded.habits[h.id]=true;
      (async()=>{
        await saveDailyTrack();
        if(justEarnedXp){
          await awardXP(XP_CONFIG.habit_complete);
          await saveDailyTrack();
          await notifyNewUnlocks();
        }
        renderHabits(); // refreshes streak counts once the background work settles — never blocks the initial checkmark above
      })();
    });
    row.querySelector('.habit-remove').addEventListener('click',async(e)=>{
      e.stopPropagation();
      P.habits=(P.habits||[]).filter(x=>x.id!==h.id);
      await storageSet('profile',JSON.stringify(P));
      renderHabits();
    });
    list.appendChild(row);
  });
  computeHabitStreaks().then(async streaks=>{
    habits.forEach(h=>{
      const el=document.getElementById('habitStreak_'+h.id);
      if(!el) return;
      const n=streaks[h.id]||0;
      el.textContent = n>0 ? `🔥${n}` : '';
    });
    const bestNow=Math.max(0,...Object.values(streaks));
    migrateProgressionFields();
    if(bestNow>(P.lifetimeStats.longestHabitStreakEver||0)){
      P.lifetimeStats.longestHabitStreakEver=bestNow;
      await storageSet('profile',JSON.stringify(P));
    }
  });
  renderHabitsYesterdayToggle();
}
/* ---- yesterday catch-up: lets a person who forgot to open the app mark a
   habit done for YESTERDAY only (not any earlier day), so a real completion
   isn't lost to a missed streak just because they didn't check the box in
   time. Writes directly into yesterday's own daily-track doc — the same
   doc computeHabitStreaks() reads — so the streak repairs itself the
   moment this is toggled. XP is guarded per-doc exactly like the normal
   today flow, so re-opening this can never double-award. */
function yesterdayTrackKey(){ const d=new Date(); d.setDate(d.getDate()-1); return `daily-track:${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function yesterdayDateLabel(){
  const d=new Date(); d.setDate(d.getDate()-1);
  return d.toLocaleDateString(LANG==='ar'?'ar-SA':'en-US',{month:'short',day:'numeric'});
}
async function loadYesterdayTrack(){
  try{ const v=await storageGet(yesterdayTrackKey()); if(v) return JSON.parse(v); }catch(e){}
  return {habits:{},supplements:{},xpAwarded:{habits:{}}};
}
function yesterdayDateObj(){ const d=new Date(); d.setDate(d.getDate()-1); return d; }

/* ---- workout catch-up: same "yesterday only" idea as habits, but a
   single checkbox row (no per-exercise checklist) — reconstructs which
   workout type yesterday actually was via workoutTypeForDate() so
   completions/streak stay attributed to the right day, without touching
   today's live dailyTrack. Renders its OWN checked/unchecked state up
   front (fetched from yesterday's doc) instead of a stateless link, so
   it's actually possible to see whether yesterday is already logged. */
async function renderWorkoutYesterdayToggle(){
  const toggle=document.getElementById('workoutYesterdayToggle');
  if(!toggle||!P.workoutSetup) return;
  toggle.classList.remove('hidden');
  const yKey=yesterdayTrackKey();
  // fetched ONCE and kept in memory for the life of this render — every
  // click mutates this same object synchronously before saving, exactly
  // like dailyTrack does for today. Re-fetching from storage inside the
  // click handler (the previous approach) raced: several quick clicks
  // would each read the same stale snapshot and the last save to land
  // would silently overwrite the others.
  const yDoc=await loadYesterdayTrack();
  const paint=()=>{
    const done=!!yDoc.workoutDone;
    toggle.innerHTML=`<div class="habit-yesterday-label">${t('habit_yesterday_label').replace('{date}',yesterdayDateLabel())}</div>
      <div class="habit-row${done?' done':''}" id="workoutYesterdayRow"><div class="habit-box">${done?'✓':''}</div><div class="habit-label">${t('workout_yesterday_item')}</div></div>`;
    document.getElementById('workoutYesterdayRow').addEventListener('click',onClick);
  };
  const onClick=async()=>{
    const nowDone=!yDoc.workoutDone;
    yDoc.workoutDone=nowDone;
    paint();
    let justEarnedXp=false;
    if(nowDone && !yDoc.completionCounted){
      yDoc.completionCounted=true;
      justEarnedXp=true;
    }
    await storageSet(yKey,JSON.stringify(yDoc));
    if(justEarnedXp){
      const yTypeKey=workoutTypeForDate(yesterdayDateObj(),P.workoutSetup);
      migrateProgressionFields();
      P.workoutCompletions=P.workoutCompletions||{push:0,pull:0,legs:0};
      P.workoutCompletions[yTypeKey]=(P.workoutCompletions[yTypeKey]||0)+1;
      const s=updateNamedStreakForDate('workout',yesterdayDateObj());
      P.streakCount=s.current; P.lastStreakDate=s.lastDate;
      await storageSet('profile',JSON.stringify(P));
      await awardXP(XP_CONFIG.workout_complete);
      await notifyNewUnlocks();
      renderStreakBadge();
    }
  };
  paint();
}

/* walks backward day-by-day (capped at 60 days) checking each real
   daily-track doc for this habit's completion — stops the moment a habit's
   chain breaks (or a day has no record at all). Nothing here is guessed. */
async function computeHabitStreaks(){
  const habits=P.habits||[];
  const streaks={}; habits.forEach(h=>streaks[h.id]=0);
  if(!habits.length) return streaks;
  let stillCounting=new Set(habits.map(h=>h.id));
  habits.forEach(h=>{
    if(dailyTrack.habits&&dailyTrack.habits[h.id]) streaks[h.id]++;
    else stillCounting.delete(h.id);
  });
  for(let back=1;back<=60&&stillCounting.size;back++){
    const d=new Date(); d.setDate(d.getDate()-back);
    const key=`daily-track:${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
    let doc=null;
    try{ const v=await storageGet(key); if(v) doc=JSON.parse(v); }catch(e){}
    if(!doc) break;
    [...stillCounting].forEach(hid=>{
      if(doc.habits&&doc.habits[hid]) streaks[hid]++;
      else stillCounting.delete(hid);
    });
  }
  return streaks;
}
async function addHabit(){
  const inp=document.getElementById('dashHabitAdd');
  const label=inp.value.trim(); if(!label) return;
  const id='h'+Date.now()+Math.floor(Math.random()*1000);
  P.habits=(P.habits||[]); P.habits.push({id,label});
  await storageSet('profile',JSON.stringify(P));
  inp.value='';
  renderHabits();
}

/* ================= COLLECTIONS =================
   A personal wildlife collection/achievement system on top of the exact
   same storageGet/storageSet key-value layer as Diet/Exercise/Schedule —
   one Firestore doc per animal subcategory (fish/birds/mammals/insects)
   holding {[speciesId]: record}, plus one small doc per uploaded photo so
   the subcategory doc stays light. Guest mode and cross-device sync come
   for free since it's the same storage layer everything else already uses.

   "Collected" and "times caught" are never stored fields — both are always
   derived from catches[], so a plain +/- tap and a future detailed catch
   record are the SAME data, never two sources of truth that can drift.

   ---- Rarity vs. conservation status (two separate, unrelated axes) ----
   RARITY is a game/collection concept: how hard would it be for an ordinary
   person in Kuwait/the Gulf (or worldwide, for non-regional species) to
   personally encounter, catch, or document this species themselves? It is
   assessed on encounter frequency + effort/skill/equipment required +
   regional accessibility + how special the moment feels — NOT on population
   size or extinction risk. A species can be Legendary rarity and Least
   Concern conservation at the same time (e.g. a globally iconic pelagic
   fish that's simply out of reach of an ordinary angler) — that's correct,
   not a contradiction.
     🟢 Common    — encountered incidentally, no special effort
     🔵 Uncommon  — needs some timing/technique/local knowledge
     🟣 Epic      — real skill/gear/season/location, a genuine "nice catch"
     🔴 Mythic    — seriously difficult even for dedicated hobbyists
     🟡 Legendary — the "holy grail"; most people never personally get this
   CONSERVATION STATUS is the real IUCN Red List assessment where one
   exists (LC/NT/VU/EN/CR/EW/EX/DD), sourced from Wikipedia/IUCN/GBIF and
   never guessed — null means "not evaluated / not independently verified"
   rather than a fabricated guess. */

/* single source of truth for collection totals — used by the Animals grid
   here AND by the Profile/Achievements/Challenges systems, so "how many
   species has this user collected" is never computed two different ways. */
async function computeCollectionStats(){
  let totalCollected=0, totalSpecies=0, legendaryCount=0;
  const catchSums={}, rarityCounts={}, perCategory={};
  for(const cat of ANIMAL_CATEGORIES){
    const raw=await storageGet('collections:animals:'+cat.id);
    const data=raw?JSON.parse(raw):{};
    const list=collSpeciesList(cat.id);
    const total=list.length;
    let got=0, catchSum=0;
    list.forEach(sp=>{
      const rec=data[sp.id];
      if(rec&&collIsCollected(rec)){
        got++;
        catchSum+=rec.catches.length;
        rarityCounts[sp.rarity]=(rarityCounts[sp.rarity]||0)+1;
        if(sp.rarity==='legendary') legendaryCount++;
      }
    });
    totalCollected+=got; totalSpecies+=total;
    catchSums[cat.id]=catchSum;
    perCategory[cat.id]={collected:got,total};
  }
  return {totalCollected,totalSpecies,catchSums,legendaryCount,rarityCounts,perCategory,
    totalCatches:Object.values(catchSums).reduce((a,b)=>a+b,0)};
}

function collSearchHaystack(sp){
  return [sp.nameAr, sp.nameEn, ...(sp.altNames||[]), sp.sci, sp.family, sp.genus].filter(Boolean).join(' ').toLowerCase();
}
function renderCollSpeciesGrid(){
  const cat=collCategoryConfig(collCurrentCat);
  const list=collViewMode==='theme'
    ? collSpeciesList(collCurrentCat).filter(sp=>FISH_THEME_BY_GROUP[sp.group]===collCurrentTheme)
    : collSpeciesList(collCurrentCat).filter(sp=>sp.group===collCurrentGroup);
  const total=list.length;
  const collectedCount=list.filter(sp=>collIsCollected(collRecord(sp.id))).length;
  const pct=total?Math.round(collectedCount/total*100):0;
  document.getElementById('collProgressLabel').textContent=`${collectedCount} / ${total} ${LANG==='ar'?'مجموع':'Collected'}`;
  document.getElementById('collCompletionSub').innerHTML=(pct===100&&total>0)
    ? `<span class="coll-section-complete">✓ ${LANG==='ar'?'اكتمل القسم':'SECTION COMPLETE'}</span>`
    : (LANG==='ar'?'نسبة الإكمال':'Completion');
  const ring=document.getElementById('collCompletionRing');
  ring.style.background=`conic-gradient(var(--accent-deep) ${pct}%, var(--line) 0)`;
  document.getElementById('collCompletionPct').textContent=pct+'%';

  const breakdownEl=document.getElementById('collRarityBreakdown');
  if(breakdownEl){
    breakdownEl.innerHTML=RARITY_ORDER.slice().reverse().map(tier=>{
      const inTier=list.filter(sp=>sp.rarity===tier);
      if(!inTier.length) return '';
      const got=inTier.filter(sp=>collIsCollected(collRecord(sp.id))).length;
      const tierPct=Math.round(got/inTier.length*100);
      const mastered=got===inTier.length;
      const label=LANG==='ar'?RARITY_TIERS[tier].nameAr:RARITY_TIERS[tier].nameEn;
      return `<div class="coll-rarity-row">
        <span class="lbl coll-rarity-${tier}">${RARITY_TIERS[tier].icon} ${label}</span>
        <span class="track"><span class="fill ${tier}" style="width:${tierPct}%"></span></span>
        <span class="count">${got}/${inTier.length}${mastered?` <span class="mastered" title="${LANG==='ar'?'اكتمل!':'Mastered!'}">🏅</span>`:''}</span>
      </div>`;
    }).join('');
  }

  const primaryKey=cat.measurements[0]&&cat.measurements[0].key;
  let bestHolderId=null, bestVal=-Infinity;
  if(primaryKey){ list.forEach(sp=>{ const v=collBest(collRecord(sp.id),primaryKey); if(v!==null&&v>bestVal){ bestVal=v; bestHolderId=sp.id; } }); }

  let filtered=list.filter(sp=>{
    if(collSearch){
      const q=collSearch.trim().toLowerCase();
      if(!collSearchHaystack(sp).includes(q)) return false;
    }
    const rec=collRecord(sp.id);
    if(collFilter==='collected' && !collIsCollected(rec)) return false;
    if(collFilter==='uncollected' && collIsCollected(rec)) return false;
    if(collRarityFilter!=='all' && sp.rarity!==collRarityFilter) return false;
    return true;
  });
  filtered=filtered.slice().sort((a,b)=>{
    if(collSort==='alpha') return collName(a).localeCompare(collName(b),LANG==='ar'?'ar':'en');
    if(collSort==='count') return collRecord(b.id).catches.length-collRecord(a.id).catches.length;
    if(collSort==='rarity'){
      const diff=RARITY_TIERS[b.rarity].order-RARITY_TIERS[a.rarity].order;
      return diff!==0 ? diff : collName(a).localeCompare(collName(b),LANG==='ar'?'ar':'en');
    }
    if(collSort==='best'){
      const bv=primaryKey?(collBest(collRecord(b.id),primaryKey)||0):0;
      const av=primaryKey?(collBest(collRecord(a.id),primaryKey)||0):0;
      return bv-av;
    }
    return 0;
  });

  const grid=document.getElementById('collSpeciesGrid');
  const emptyMsg=document.getElementById('collEmptyMsg');
  if(!filtered.length){
    grid.innerHTML='';
    emptyMsg.textContent=LANG==='ar'?'ما فيه نتائج':'No species match';
    emptyMsg.classList.remove('hidden');
    return;
  }
  emptyMsg.classList.add('hidden');
  grid.innerHTML=filtered.map(sp=>{
    const rec=collRecord(sp.id);
    const collected=collIsCollected(rec);
    const tier=RARITY_TIERS[sp.rarity];
    let badge='';
    if(collected && bestHolderId===sp.id) badge='<span class="coll-corner-badge" title="best">🏆</span>';
    const cachedPhoto=rec.hasPhoto?collPhotoCache[collCurrentCat+':'+sp.id]:null;
    const thumbInner=cachedPhoto?`<img src="${cachedPhoto.dataUrl}" alt="">`:(collected?sp.icon:('<span class="lock-ic">🔒</span>'+sp.icon));
    return `<div class="coll-species-card tier-${sp.rarity} ${collected?'collected':'locked'}" data-sp="${sp.id}">
      <span class="coll-rarity-mini rarity-tag coll-rarity-${sp.rarity}">${tier.icon}</span>
      ${badge}
      <div class="thumb">${thumbInner}</div>
      <div class="name">${collName(sp)}</div>
      <div class="meta">${collected?(rec.catches.length+' '+(LANG==='ar'?cat.countLabelAr:cat.countLabelEn)):(LANG==='ar'?'غير مجموع':'Not collected')}</div>
    </div>`;
  }).join('');
  grid.querySelectorAll('.coll-species-card').forEach(cardEl=>{
    const sp=collSpeciesInfo(collCurrentCat,cardEl.dataset.sp);
    cardEl.addEventListener('click',()=>{
      collCurrentSpecies=cardEl.dataset.sp;
      if(sp && sp.bossData){ openBossModal(sp); return; }
      collGoTo('species');
      renderCollSpeciesDetail();
    });
    // lightweight 3D tilt on hover, driven by cursor position relative to the card
    cardEl.addEventListener('pointermove',(e)=>{
      if(e.pointerType==='touch') return;
      const rect=cardEl.getBoundingClientRect();
      const px=(e.clientX-rect.left)/rect.width-0.5;
      const py=(e.clientY-rect.top)/rect.height-0.5;
      cardEl.style.setProperty('--tiltY',(px*10)+'deg');
      cardEl.style.setProperty('--tiltX',(-py*10)+'deg');
    });
    cardEl.addEventListener('pointerleave',()=>{
      cardEl.style.setProperty('--tiltX','0deg');
      cardEl.style.setProperty('--tiltY','0deg');
    });
  });

  // Species that have a photo but aren't cached yet: fetch in the background
  // and patch just that card's thumbnail in place once it arrives — avoids
  // re-rendering the whole grid and avoids a network round-trip per render
  // once a species' photo has been loaded once.
  filtered.forEach(sp=>{
    const rec=collRecord(sp.id);
    if(!rec.hasPhoto) return;
    const photoCacheKey=collCurrentCat+':'+sp.id;
    if(collPhotoCache[photoCacheKey]!==undefined) return;
    storageGet('collection-photo:'+collCurrentCat+':'+sp.id).then(raw=>{
      let photo=null;
      try{ photo=raw?JSON.parse(raw):null; }catch(e){}
      collPhotoCache[photoCacheKey]=photo;
      if(!photo) return;
      const cardEl=grid.querySelector('.coll-species-card[data-sp="'+sp.id+'"]');
      const thumbEl=cardEl&&cardEl.querySelector('.thumb');
      if(thumbEl) thumbEl.innerHTML=`<img src="${photo.dataUrl}" alt="">`;
    }).catch(()=>{ collPhotoCache[photoCacheKey]=null; });
  });
}

/* Kept deliberately simple per current direction: emoji + name + rarity +
   collected/count only. Richer fields (taxonomy, conservation, breeds,
   personal-best measurements, sources) still exist on the species objects
   and in helper functions below — nothing was deleted from the data model —
   they're just not rendered here until that layer is asked for again. */
async function renderCollSpeciesDetail(){
  const cat=collCategoryConfig(collCurrentCat);
  const sp=collSpeciesInfo(collCurrentCat,collCurrentSpecies);
  const rec=collRecord(sp.id);
  const collected=collIsCollected(rec);
  const tier=RARITY_TIERS[sp.rarity];
  const photoCacheKey=collCurrentCat+':'+sp.id;
  let photo=null;
  if(rec.hasPhoto){
    if(collPhotoCache[photoCacheKey]!==undefined){ photo=collPhotoCache[photoCacheKey]; }
    else{
      try{ const raw=await storageGet('collection-photo:'+collCurrentCat+':'+sp.id); photo=raw?JSON.parse(raw):null; }catch(e){}
      collPhotoCache[photoCacheKey]=photo;
    }
  }

  const recordsHtml=cat.measurements.map(m=>{
    const v=collBest(rec,m.key);
    return `<div class="coll-record-chip"><div class="rv">${v!==null?('🏆 '+v+' '+m.unit):'—'}</div><div class="rl">${LANG==='ar'?m.labelAr:m.labelEn}</div></div>`;
  }).join('');
  const logInputsHtml=cat.measurements.map(m=>`<input type="number" step="0.01" inputmode="decimal" id="collLogInput-${m.key}" placeholder="${(LANG==='ar'?m.labelAr:m.labelEn)+' ('+m.unit+')'}">`).join('');

  const el=document.getElementById('collSpeciesDetail');
  el.innerHTML=`
    <div class="coll-detail-photo ${photo?'':'is-reference'} ${collected?'tier-'+sp.rarity:''}">
      ${photo?`<img src="${photo.dataUrl}" alt="">`:sp.icon}
      <span class="coll-photo-tag ${photo?'mine':'reference'}">${photo?(LANG==='ar'?'📷 صورتي':'📷 My photo'):(LANG==='ar'?'صورة مرجعية':'Reference image')}</span>
    </div>
    <div class="coll-pill-row">
      <span class="coll-status-pill ${collected?'collected':'locked'}">${collected?(LANG==='ar'?'✅ مجموع':'✅ Collected'):(LANG==='ar'?'🔒 غير مجموع':'🔒 Not collected')}</span>
      <span class="coll-rarity-pill coll-rarity-${sp.rarity}">${tier.icon} ${LANG==='ar'?tier.nameAr:tier.nameEn}</span>
    </div>
    <h2 style="text-align:center;margin:0 0 16px;color:var(--heading);">${collName(sp)}</h2>

    <div class="coll-counter-row">
      <button class="coll-counter-btn" id="collDecBtn" ${rec.catches.length<=0?'disabled':''}>−</button>
      <div class="coll-counter-num" id="collCounterNum">${rec.catches.length}</div>
      <button class="coll-counter-btn" id="collIncBtn">+</button>
    </div>
    <div class="coll-counter-label">${LANG==='ar'?cat.countLabelAr:cat.countLabelEn}</div>

    <div class="coll-records-grid">${recordsHtml}</div>

    <div class="setup-card">
      <h3 style="font-size:0.85rem;">${LANG==='ar'?'📝 سجّل القياسات هالمرة (اختياري)':'📝 Log measurements for this time (optional)'}</h3>
      <div class="coll-log-form">
        ${logInputsHtml}
        <button id="collLogSaveBtn">${LANG==='ar'?'حفظ':'Save'}</button>
      </div>
      <p class="sub" style="margin:0;">${LANG==='ar'?'يسوي زيادة تلقائية بالعداد':'This also adds one to the counter above'}</p>
    </div>

    <input type="file" accept="image/*" class="hidden" id="collPhotoInput">
    <button class="setup-btn" id="collUploadBtn" style="background:var(--card);color:var(--heading);border:1px solid var(--heading);margin-top:16px;">📷 ${LANG==='ar'?'ارفع صورتك':'Upload my photo'}</button>
  `;
  document.getElementById('collIncBtn').addEventListener('click',()=>collAddCatch({}));
  document.getElementById('collDecBtn').addEventListener('click',collRemoveLastCatch);
  document.getElementById('collLogSaveBtn').addEventListener('click',()=>{
    const measurements={};
    cat.measurements.forEach(m=>{
      const raw=document.getElementById('collLogInput-'+m.key).value;
      if(raw!==''&&!isNaN(parseFloat(raw))) measurements[m.key]=parseFloat(raw);
    });
    collAddCatch(measurements);
  });
  document.getElementById('collUploadBtn').addEventListener('click',()=>document.getElementById('collPhotoInput').click());
  document.getElementById('collPhotoInput').addEventListener('change',collHandlePhotoUpload);
}

function collToggleVariant(variantId){
  const rec=collRecord(collCurrentSpecies);
  if(!collCatData[collCurrentSpecies]) collCatData[collCurrentSpecies]=rec;
  rec.variantState=rec.variantState||{};
  const wasDone=!!(rec.variantState[variantId]&&rec.variantState[variantId].collected);
  rec.variantState[variantId]={collected:!wasDone};
  renderCollSpeciesDetail();
  collSaveCategory(collCurrentCat);
}

function collAddCatch(measurements){
  const rec=collRecord(collCurrentSpecies);
  if(!collCatData[collCurrentSpecies]) collCatData[collCurrentSpecies]=rec;
  const wasCollected=collIsCollected(rec);
  rec.catches=rec.catches||[];
  rec.catches.push({id:collGenId(), date:new Date().toISOString(), measurements:measurements||{}});
  renderCollSpeciesDetail();     // instant feedback — never block the tap on a network round-trip
  collSaveCategory(collCurrentCat);
  if(!wasCollected){
    const sp=collSpeciesInfo(collCurrentCat,collCurrentSpecies);
    if(sp && sp.bossData){
      const achievement=LANG==='ar'?sp.bossData.achievementAr:sp.bossData.achievementEn;
      showToast('🏆 '+(LANG==='ar'?`تم فتح إنجاز: ${achievement}`:`Achievement unlocked: ${achievement}`));
    }
    // reward scales with the species' real rarity tier instead of a flat
    // amount — a boss catch always pays at the top (legendary) tier
    // regardless of its own listed rarity field, since bosses are the
    // game's rarest, hardest encounters by design.
    const rewardTier = (sp && sp.bossData) ? 'legendary' : (sp && sp.rarity) || 'common';
    (async()=>{
      await awardXP(XP_CONFIG['collection_unlock_'+rewardTier]||XP_CONFIG.collection_unlock_common);
      await awardCoins(COIN_CONFIG['collection_unlock_'+rewardTier]||COIN_CONFIG.collection_unlock_common);
      // the whale shark boss is the only boss wired to an exclusive
      // cosmetic for this first batch — more bosses get their own
      // cosmetic in a follow-up, each shown for approval before going live.
      if(sp && sp.bossData && sp.id==='rhincodon_typus'){
        P.inventory=P.inventory||{};
        if(!P.inventory['gentle-giant']){ P.inventory['gentle-giant']={acquiredAt:new Date().toISOString(),source:'boss'}; await storageSet('profile',JSON.stringify(P)); }
      }
      await notifyNewUnlocks();
      if(typeof ActivityService!=='undefined') await ActivityService.post('collection',{});
    })();
  }
}

function renderBossModalBody(sp, justCaught){
  const stars='★'.repeat(sp.bossData.difficultyStars)+'☆'.repeat(5-sp.bossData.difficultyStars);
  const title=LANG==='ar'?sp.bossData.titleAr:sp.bossData.titleEn;
  const tackle=LANG==='ar'?sp.bossData.tackleAr:sp.bossData.tackleEn;
  const tide=LANG==='ar'?sp.bossData.tideAr:sp.bossData.tideEn;
  const phases=LANG==='ar'?sp.bossData.phasesAr:sp.bossData.phasesEn;
  const achievement=LANG==='ar'?sp.bossData.achievementAr:sp.bossData.achievementEn;
  const collected=collIsCollected(collRecord(sp.id));
  const body=document.getElementById('bossCardBody');
  body.className='card boss-card tier-'+sp.rarity;
  body.innerHTML=`
    <button class="close-btn" id="bossCloseBtn">✕</button>
    ${(!collected)?`<div class="boss-appeared-banner">🌊 ${LANG==='ar'?'ظهر رئيس!':'BOSS APPEARED'} 🌊</div>`:''}
    <span class="boss-icon">${sp.icon}</span>
    <h2 class="boss-title">${title}</h2>
    <div class="boss-stars">${stars}</div>
    ${justCaught?`<div class="boss-victory"><div class="big">🏆</div><div class="label">${LANG==='ar'?'انتصار! تم الاصطياد':'VICTORY! Defeated'}</div></div>`:''}
    <div class="boss-tide">🌤️ <span>${tide}</span></div>
    <div class="boss-section"><h4>${LANG==='ar'?'العدة الموصى بها':'Recommended Tackle'}</h4><p>${tackle}</p></div>
    <div class="boss-section"><h4>${LANG==='ar'?'آلية المواجهة':'Encounter Mechanics'}</h4>
      <ul class="boss-phase-list">${phases.map(p=>`<li>${p}</li>`).join('')}</ul>
    </div>
    ${collected?`<div class="boss-achievement">🏅 ${achievement}</div>`:''}
    ${collected?'':`<button class="boss-catch-btn" id="bossCatchBtn">${LANG==='ar'?'✓ سجّل كصيد (هزيمة الرئيس)':'✓ Mark as Defeated / Caught'}</button>`}
    <button class="boss-continue-btn" id="bossContinueBtn">${LANG==='ar'?'← فتح صفحة النوع الكاملة':'Open Full Species Page →'}</button>
  `;
  document.getElementById('bossCloseBtn').addEventListener('click',closeBossModal);
  document.getElementById('bossContinueBtn').addEventListener('click',()=>{
    closeBossModal();
    collCurrentSpecies=sp.id;
    collGoTo('species');
    renderCollSpeciesDetail();
  });
  const catchBtn=document.getElementById('bossCatchBtn');
  if(catchBtn){
    catchBtn.addEventListener('click',()=>{
      catchBtn.disabled=true;
      const prevSpecies=collCurrentSpecies;
      collCurrentSpecies=sp.id;
      collAddCatch({});          // records the catch, saves it, and fires the achievement toast
      collCurrentSpecies=prevSpecies;
      renderBossModalBody(sp, true);
      // refresh whatever grid sits behind the modal so counts/badges update live
      if(collStack[collStack.length-1]==='category') renderCollSpeciesGrid();
    });
  }
}
function openBossModal(sp){
  renderBossModalBody(sp, false);
  document.getElementById('bossOverlay').classList.add('open');
}
function closeBossModal(){ document.getElementById('bossOverlay').classList.remove('open'); }
function collRemoveLastCatch(){
  const rec=collRecord(collCurrentSpecies);
  if(!rec.catches||!rec.catches.length) return;
  rec.catches.pop();
  const nowEmpty=rec.catches.length===0;
  renderCollSpeciesDetail();
  collSaveCategory(collCurrentCat);
  if(nowEmpty) showToast(LANG==='ar'?'رجع لغير مجموع — صورك ومعلوماتك محفوظة':'Marked as not collected — your photo & info are kept');
}
async function collHandlePhotoUpload(e){
  const file=e.target.files[0];
  e.target.value='';
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast(LANG==='ar'?'اختر صورة':'Please choose an image','error'); return; }
  try{
    const dataUrl=await collCompressImage(file);
    const photoRecord={dataUrl, uploadedAt:new Date().toISOString()};
    collPhotoCache[collCurrentCat+':'+collCurrentSpecies]=photoRecord;
    const rec=collRecord(collCurrentSpecies);
    if(!collCatData[collCurrentSpecies]) collCatData[collCurrentSpecies]=rec;
    rec.hasPhoto=true;
    if(!rec.catches||!rec.catches.length){ rec.catches=[{id:collGenId(), date:new Date().toISOString(), measurements:{}}]; }
    renderCollSpeciesDetail();   // instant — show the photo before the network write finishes
    storageSet('collection-photo:'+collCurrentCat+':'+collCurrentSpecies, JSON.stringify(photoRecord));
    collSaveCategory(collCurrentCat);
    showToast(LANG==='ar'?'انحفظت صورتك 📷':'Your photo was saved 📷');
  }catch(err){ showToast((LANG==='ar'?'فشل رفع الصورة: ':'Photo upload failed: ')+err.message,'error'); }
}
/* resize+compress client-side so a photo fits comfortably inside one
   Firestore document (1MiB limit) — Firebase Storage now requires the paid
   Blaze plan, so this keeps photo uploads working on the free Spark plan */
function collCompressImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error(LANG==='ar'?'ما قدرنا نقرأ الملف':'Could not read the file'));
    reader.onload=()=>{
      img.onerror=()=>reject(new Error(LANG==='ar'?'الملف مو صورة صالحة':'That file is not a valid image'));
      img.onload=()=>{
        const maxDim=900;
        let {width,height}=img;
        if(width>maxDim||height>maxDim){
          if(width>height){ height=Math.round(height*maxDim/width); width=maxDim; }
          else{ width=Math.round(width*maxDim/height); height=maxDim; }
        }
        const canvas=document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        let quality=0.72;
        let dataUrl=canvas.toDataURL('image/jpeg',quality);
        while(dataUrl.length>700000 && quality>0.3){ quality-=0.1; dataUrl=canvas.toDataURL('image/jpeg',quality); }
        if(dataUrl.length>900000){ reject(new Error(LANG==='ar'?'الصورة كبيرة جداً':'That image is too large')); return; }
        resolve(dataUrl);
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

(async()=>{
  if(!fbAuth){
    // Firebase SDK unavailable (offline/blocked, e.g. sandboxed preview) — behave exactly as before, local-only
    document.getElementById('authOverlay').classList.add('hidden');
    await bootApp();
    return;
  }
  // otherwise onAuthStateChanged (registered above) drives showing the sign-in screen or booting the app
})();
