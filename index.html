function calAutoLabelForSlot(slot,commitments){
  const [s0,s1]=slotRange(slot);
  const hits=commitments.filter(c=>{
    if(!c.from||!c.to) return true; // all-day commitment (no time set) — applies to every slot
    const c0=parseHM(c.from),c1=parseHM(c.to);
    if(c1>c0) return s0<c1 && c0<s1;
    return (c0<s1) || (s0<c1);
  });
  return hits.length ? hits.map(c=>c.label).join(' + ') : '';
}
function renderCalDetail(dateKey,commitments,dayTrack){
  const area=document.getElementById('calDetailArea'); area.innerHTML='';
  dayTrack.agenda=dayTrack.agenda||{};
  AGENDA_SLOTS.forEach(slot=>{
    const el=document.createElement('div'); el.className='agenda-slot';
    const auto=calAutoLabelForSlot(slot,commitments);
    const custom=dayTrack.agenda[slot];
    const note=(custom!==undefined&&custom!==null&&custom!=='') ? custom : auto;
    el.innerHTML=`<div class="time">${formatSlot12h(slot)}</div><div class="note${note?'':' empty'}">${note||t('no_note')}</div>`;
    el.addEventListener('click',()=>openCalSlotEdit(el,slot,auto,dateKey,dayTrack));
    area.appendChild(el);
  });
}
function openCalSlotEdit(el,slot,auto,dateKey,dayTrack){
  if(el.querySelector('.agenda-edit')) return;
  const current=(dayTrack.agenda[slot]!==undefined) ? dayTrack.agenda[slot] : auto;
  el.innerHTML=`<div class="time">${formatSlot12h(slot)}</div><input class="agenda-edit" value="${current.replace(/"/g,'&quot;')}" placeholder="${LANG==='ar'?'شنو عندك بهالوقت؟':"What's on?"}">`;
  const input=el.querySelector('.agenda-edit');
  input.focus();
  async function commit(){
    const val=input.value.trim();
    if(val && val!==auto) dayTrack.agenda[slot]=val;
    else delete dayTrack.agenda[slot];
    await storageSet(dateKey,JSON.stringify(dayTrack));
    const note=(dayTrack.agenda[slot]!==undefined) ? dayTrack.agenda[slot] : auto;
    el.innerHTML=`<div class="time">${formatSlot12h(slot)}</div><div class="note${note?'':' empty'}">${note||t('no_note')}</div>`;
  }
  input.addEventListener('blur',commit);
  input.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); input.blur(); } });
}
function slotRange(slot){ const [a,b]=slot.split('-'); return [parseHM(a),parseHM(b)]; }

function launchApp(){
  LANG=P.lang||'ar';
  document.getElementById('mainNav').classList.remove('hidden');
  document.getElementById('mainWrap').classList.remove('hidden');
  document.getElementById('mainFooter').classList.remove('hidden');
  const fv=document.getElementById('footerVersion'); if(fv) fv.textContent=APP_VERSION;
  refreshHome();
  showPanel('home');
}

/* ================= COLLECTIONS =================
   A personal wildlife collection/achievement system on top of the exact
   same storageGet/storageSet key-value layer as Diet/Exercise/Schedule —
   one Firestore doc per animal subcategory (fish/birds/mammals/insects)
   holding {[speciesId]: record}, plus one small doc per uploaded photo so
   the subcategory doc stays light. Guest mode and cross-device sync come
   for free since it's the same storage layer everything else already uses.

   "Collected" and "times caught" are never stored fields — both are always
   derived from catches[], so a plain +/- tap and a future detailed catch
   record are the SAME data, never two sources of truth that can drift.

   ---- Rarity vs. conservation status (two separate, unrelated axes) ----
   RARITY is a game/collection concept: how hard would it be for an ordinary
   person in Kuwait/the Gulf (or worldwide, for non-regional species) to
   personally encounter, catch, or document this species themselves? It is
   assessed on encounter frequency + effort/skill/equipment required +
   regional accessibility + how special the moment feels — NOT on population
   size or extinction risk. A species can be Legendary rarity and Least
   Concern conservation at the same time (e.g. a globally iconic pelagic
   fish that's simply out of reach of an ordinary angler) — that's correct,
   not a contradiction.
     🟢 Common    — encountered incidentally, no special effort
     🔵 Uncommon  — needs some timing/technique/local knowledge
     🟣 Epic      — real skill/gear/season/location, a genuine "nice catch"
     🔴 Mythic    — seriously difficult even for dedicated hobbyists
     🟡 Legendary — the "holy grail"; most people never personally get this
   CONSERVATION STATUS is the real IUCN Red List assessment where one
   exists (LC/NT/VU/EN/CR/EW/EX/DD), sourced from Wikipedia/IUCN/GBIF and
   never guessed — null means "not evaluated / not independently verified"
   rather than a fabricated guess. */
const RARITY_TIERS={
  common:    {icon:'🟢', nameAr:'شائع',    nameEn:'Common',    order:1},
  uncommon:  {icon:'🔵', nameAr:'غير شائع', nameEn:'Uncommon',  order:2},
  epic:      {icon:'🟣', nameAr:'ملحمي',    nameEn:'Epic',      order:3},
  mythic:    {icon:'🔴', nameAr:'خرافي',    nameEn:'Mythic',    order:4},
  legendary: {icon:'🟡', nameAr:'أسطوري',   nameEn:'Legendary', order:5}
};
const RARITY_ORDER=['common','uncommon','epic','mythic','legendary'];
const CONSERVATION_STATUS={
  LC:{nameAr:'أقل قلق', nameEn:'Least Concern'},
  NT:{nameAr:'قريب من التهديد', nameEn:'Near Threatened'},
  VU:{nameAr:'عرضة للخطر', nameEn:'Vulnerable'},
  EN:{nameAr:'مهدد بالانقراض', nameEn:'Endangered'},
  CR:{nameAr:'مهدد بالانقراض بشدة', nameEn:'Critically Endangered'},
  EW:{nameAr:'منقرض في البرية', nameEn:'Extinct in the Wild'},
  EX:{nameAr:'منقرض', nameEn:'Extinct'},
  DD:{nameAr:'بيانات غير كافية', nameEn:'Data Deficient'}
};
function collConservationLabel(code){
  const c=code&&CONSERVATION_STATUS[code];
  if(!c) return LANG==='ar'?'غير مقيّم':'Not evaluated';
  return LANG==='ar'?c.nameAr:c.nameEn;
}

let collStack=['root'];
let collCurrentCat=null;
let collCurrentGroup=null;
let collCurrentSpecies=null;
let collCatData={};    // in-memory cache of the currently-open subcategory's {speciesId:record}
let collFilter='all';  // all | collected | uncollected
let collSort='alpha';  // alpha | count | best
let collSearch='';

function collCategoryConfig(catId){ return ANIMAL_CATEGORIES.find(c=>c.id===catId); }
function collGroupList(catId){ return ANIMAL_GROUPS[catId]||[]; }
function collGroupConfig(catId,groupId){ return collGroupList(catId).find(g=>g.id===groupId); }
function collGroupName(g){ return LANG==='ar'?g.nameAr:g.nameEn; }
function collSpeciesList(catId){ return SPECIES_DB[catId]||[]; }
function collSpeciesInfo(catId,speciesId){ return collSpeciesList(catId).find(s=>s.id===speciesId); }
function collName(sp){ return LANG==='ar'?sp.nameAr:sp.nameEn; }
function collCatName(cat){ return LANG==='ar'?cat.nameAr:cat.nameEn; }
async function collLoadCategory(catId){
  const raw=await storageGet('collections:animals:'+catId);
  collCatData=raw?JSON.parse(raw):{};
  return collCatData;
}
async function collSaveCategory(catId){ await storageSet('collections:animals:'+catId, JSON.stringify(collCatData)); }
function collRecord(speciesId){ return collCatData[speciesId]||{catches:[],hasPhoto:false,variantState:{}}; }
function collIsCollected(record){ return !!(record.catches&&record.catches.length>0); }
function collBest(record,key){
  if(!record.catches||!record.catches.length) return null;
  const vals=record.catches.map(c=>c.measurements&&c.measurements[key]).filter(v=>typeof v==='number'&&!isNaN(v));
  return vals.length?Math.max(...vals):null;
}
function collFirstDate(record){ return (record.catches&&record.catches.length)?record.catches.reduce((min,c)=>(!min||c.date<min)?c.date:min,null):null; }
function collLastDate(record){ return (record.catches&&record.catches.length)?record.catches.reduce((max,c)=>(!max||c.date>max)?c.date:max,null):null; }
function collFmtDate(iso){ if(!iso) return '—'; return new Date(iso).toLocaleDateString(LANG==='ar'?'ar':'en',{year:'numeric',month:'short',day:'numeric'}); }
function collGenId(){ return 'c'+Date.now()+Math.random().toString(36).slice(2,7); }
const collPhotoCache={};   // avoids re-fetching an already-loaded photo on every +/- re-render

function collShowView(name){
  document.querySelectorAll('.coll-view').forEach(v=>v.classList.remove('active'));
  document.getElementById('collView-'+name).classList.add('active');
  window.scrollTo({top:0});
}
function collGoTo(name){ collStack.push(name); collShowView(name); }
function collBack(){
  if(collStack.length<=1){ showPanel('home'); return; }
  collStack.pop();
  const target=collStack[collStack.length-1];
  collShowView(target);
  /* the view being returned to may be stale — e.g. collecting a species and
     going back should immediately show it as collected in the grid, not
     wait for a fresh visit to re-trigger the render */
  if(target==='category') renderCollSpeciesGrid();
  else if(target==='groups') renderCollGroups();
  else if(target==='animals') renderCollAnimals();
}
document.getElementById('collectionsBackBtn').addEventListener('click',collBack);
function enterCollections(){ collStack=['root']; collShowView('root'); renderCollRoot(); }
/* Every Collections render function reads LANG live, but nothing re-ran
   them on a language switch — so whatever screen was already drawn just
   stayed in its old language until the user re-entered it. Re-render
   whichever screen is currently on top of the stack instead. */
function refreshCollectionsCurrentView(){
  const top=collStack[collStack.length-1];
  if(top==='root') renderCollRoot();
  else if(top==='animals') renderCollAnimals();
  else if(top==='groups') renderCollGroups();
  else if(top==='category') renderCollCategory();
  else if(top==='species') renderCollSpeciesDetail();
}

function renderCollRoot(){
  const grid=document.getElementById('collRootGrid');
  grid.innerHTML=`
    <div class="coll-cat-card" id="collGoAnimals"><span class="ic">🐾</span><div class="ttl">${LANG==='ar'?'حيوانات':'Animals'}</div></div>
    <div class="coll-cat-card disabled" id="collGoPlants"><span class="soon-tag">${LANG==='ar'?'قريباً':'Soon'}</span><span class="ic">🌱</span><div class="ttl">${LANG==='ar'?'نباتات':'Plants'}</div></div>
  `;
  document.getElementById('collGoAnimals').addEventListener('click',()=>{ collGoTo('animals'); renderCollAnimals(); });
  document.getElementById('collGoPlants').addEventListener('click',()=>{ showToast(LANG==='ar'?'قسم النباتات قادم قريباً 🌱':'Plants section is coming soon 🌱'); });
}

async function renderCollAnimals(){
  const grid=document.getElementById('collAnimalsGrid');
  grid.innerHTML=ANIMAL_CATEGORIES.map(cat=>`<div class="coll-cat-card" data-cat="${cat.id}"><span class="ic">${cat.icon}</span><div class="ttl">${collCatName(cat)}</div><div class="sub" id="collCatProgress-${cat.id}">…</div></div>`).join('');
  grid.querySelectorAll('.coll-cat-card').forEach(el=>{
    el.addEventListener('click',async()=>{
      collCurrentCat=el.dataset.cat;
      await collLoadCategory(collCurrentCat);
      collGoTo('groups');
      renderCollGroups();
    });
  });
  let totalCollected=0, totalSpeciesAll=0, legendaryCount=0;
  const catchSums={};
  for(const cat of ANIMAL_CATEGORIES){
    const raw=await storageGet('collections:animals:'+cat.id);
    const data=raw?JSON.parse(raw):{};
    const total=collSpeciesList(cat.id).length;
    const got=Object.values(data).filter(collIsCollected).length;
    totalCollected+=got;
    totalSpeciesAll+=total;
    let catchSum=0;
    collSpeciesList(cat.id).forEach(sp=>{
      const rec=data[sp.id];
      if(rec&&collIsCollected(rec)) catchSum+=rec.catches.length;
      if(rec&&collIsCollected(rec)&&sp.rarity==='legendary') legendaryCount++;
    });
    catchSums[cat.id]=catchSum;
    const elp=document.getElementById('collCatProgress-'+cat.id);
    if(elp) elp.textContent=`${got} / ${total}`;
  }
  const progLabel=document.getElementById('collAnimalsProgressLabel');
  const progFill=document.getElementById('collAnimalsProgressFill');
  if(progLabel) progLabel.textContent=`${LANG==='ar'?'🐾 حيوانات':'🐾 Animals'}: ${totalCollected} / ${totalSpeciesAll}`;
  if(progFill) progFill.style.width=(totalSpeciesAll?Math.round(totalCollected/totalSpeciesAll*100):0)+'%';
  const statsBar=document.getElementById('collStatsBar');
  if(statsBar){
    statsBar.innerHTML=`
      <div class="coll-stat-chip"><b>🏆 ${totalCollected}</b>${LANG==='ar'?'نوع مجموع':'species collected'}</div>
      <div class="coll-stat-chip"><b>🎣 ${catchSums.fish||0}</b>${LANG==='ar'?'سمكة مصيدة':'fish caught'}</div>
      <div class="coll-stat-chip"><b>🐦 ${catchSums.birds||0}</b>${LANG==='ar'?'طير موثق':'birds documented'}</div>
      <div class="coll-stat-chip"><b>🐻 ${catchSums.mammals||0}</b>${LANG==='ar'?'ثديي موثق':'mammals documented'}</div>
      <div class="coll-stat-chip"><b>🐜 ${catchSums.insects||0}</b>${LANG==='ar'?'حشرة موثقة':'insects documented'}</div>
      <div class="coll-stat-chip legendary"><b>${RARITY_TIERS.legendary.icon} ${legendaryCount}</b>${LANG==='ar'?'اكتشاف أسطوري':'Legendary discoveries'}</div>
    `;
  }
}

const REGION_LABELS={
  kuwait:{ar:'🇰🇼 الكويت',en:'🇰🇼 Kuwait'},
  gulf:{ar:'🌊 الخليج',en:'🌊 Gulf'},
  arabian_peninsula:{ar:'🏜️ الجزيرة العربية',en:'🏜️ Arabian Peninsula'},
  global:{ar:'🌍 عالمي',en:'🌍 Worldwide'}
};
let collRarityFilter='all';
let collConservationFilter='all';
let collRegionFilter='all';

/* Groups are pure navigation — this only reads collCatData to show counts,
   it never writes to it. Opening/entering a group cannot create or change
   any collectible's record. */
function renderCollGroups(){
  const cat=collCategoryConfig(collCurrentCat);
  document.getElementById('collGroupsTitle').textContent=`${cat.icon} ${collCatName(cat)}`;
  const groups=collGroupList(collCurrentCat);
  const grid=document.getElementById('collGroupsGrid');
  grid.innerHTML=groups.map(g=>{
    const speciesInGroup=collSpeciesList(collCurrentCat).filter(sp=>sp.group===g.id);
    const collectedInGroup=speciesInGroup.filter(sp=>collIsCollected(collRecord(sp.id))).length;
    return `<div class="coll-cat-card" data-group="${g.id}"><span class="ic">${g.icon}</span><div class="ttl">${collGroupName(g)}</div><div class="sub">${collectedInGroup} / ${speciesInGroup.length}</div></div>`;
  }).join('');
  grid.querySelectorAll('.coll-cat-card').forEach(el=>{
    el.addEventListener('click',()=>{
      collCurrentGroup=el.dataset.group;
      collGoTo('category');
      renderCollCategory();
    });
  });
}

function renderCollCategory(){
  const cat=collCategoryConfig(collCurrentCat);
  const group=collGroupConfig(collCurrentCat,collCurrentGroup);
  document.getElementById('collCatTitle').textContent=`${group.icon} ${collGroupName(group)}`;
  const search=document.getElementById('collSearchInput');
  search.placeholder=LANG==='ar'?'ابحث بالاسم أو الاسم العلمي أو الفصيلة...':'Search name, scientific name, family...';
  search.value=collSearch;
  const filterSel=document.getElementById('collFilterSelect');
  filterSel.innerHTML=`<option value="all">${LANG==='ar'?'الكل':'All'}</option><option value="collected">${LANG==='ar'?'✅ مجموع':'✅ Collected'}</option><option value="uncollected">${LANG==='ar'?'🔒 غير مجموع':'🔒 Not collected'}</option>`;
  filterSel.value=collFilter;
  const sortSel=document.getElementById('collSortSelect');
  sortSel.innerHTML=`<option value="alpha">${LANG==='ar'?'أبجدي':'A–Z'}</option><option value="count">${LANG==='ar'?'الأكثر جمعاً':'Most caught'}</option><option value="best">${LANG==='ar'?'أفضل رقم':'Best record'}</option><option value="rarity">${LANG==='ar'?'الندرة':'Rarity'}</option>`;
  sortSel.value=collSort;
  const raritySel=document.getElementById('collRarityFilterSelect');
  raritySel.innerHTML=`<option value="all">${LANG==='ar'?'كل الندرات':'All rarities'}</option>`+RARITY_ORDER.map(r=>`<option value="${r}">${RARITY_TIERS[r].icon} ${LANG==='ar'?RARITY_TIERS[r].nameAr:RARITY_TIERS[r].nameEn}</option>`).join('');
  raritySel.value=collRarityFilter;
  search.oninput=()=>{ collSearch=search.value; renderCollSpeciesGrid(); };
  filterSel.onchange=()=>{ collFilter=filterSel.value; renderCollSpeciesGrid(); };
  sortSel.onchange=()=>{ collSort=sortSel.value; renderCollSpeciesGrid(); };
  raritySel.onchange=()=>{ collRarityFilter=raritySel.value; renderCollSpeciesGrid(); };
  renderCollSpeciesGrid();
}

function collSearchHaystack(sp){
  return [sp.nameAr, sp.nameEn, ...(sp.altNames||[]), sp.sci, sp.family, sp.genus].filter(Boolean).join(' ').toLowerCase();
}
function renderCollSpeciesGrid(){
  const cat=collCategoryConfig(collCurrentCat);
  const list=collSpeciesList(collCurrentCat).filter(sp=>sp.group===collCurrentGroup);
  const total=list.length;
  const collectedCount=list.filter(sp=>collIsCollected(collRecord(sp.id))).length;
  document.getElementById('collProgressLabel').textContent=`${collectedCount} / ${total} ${LANG==='ar'?'مجموع':'Collected'}`;
  document.getElementById('collProgressFill').style.width=(total?Math.round(collectedCount/total*100):0)+'%';

  const breakdownEl=document.getElementById('collRarityBreakdown');
  if(breakdownEl){
    breakdownEl.innerHTML=RARITY_ORDER.map(tier=>{
      const inTier=list.filter(sp=>sp.rarity===tier);
      if(!inTier.length) return '';
      const got=inTier.filter(sp=>collIsCollected(collRecord(sp.id))).length;
      return `<span class="coll-rarity-mini coll-rarity-${tier}">${RARITY_TIERS[tier].icon} ${got}/${inTier.length}</span>`;
    }).join('');
  }

  const primaryKey=cat.measurements[0]&&cat.measurements[0].key;
  let bestHolderId=null, bestVal=-Infinity;
  if(primaryKey){ list.forEach(sp=>{ const v=collBest(collRecord(sp.id),primaryKey); if(v!==null&&v>bestVal){ bestVal=v; bestHolderId=sp.id; } }); }

  let filtered=list.filter(sp=>{
    if(collSearch){
      const q=collSearch.trim().toLowerCase();
      if(!collSearchHaystack(sp).includes(q)) return false;
    }
    const rec=collRecord(sp.id);
    if(collFilter==='collected' && !collIsCollected(rec)) return false;
    if(collFilter==='uncollected' && collIsCollected(rec)) return false;
    if(collRarityFilter!=='all' && sp.rarity!==collRarityFilter) return false;
    return true;
  });
  filtered=filtered.slice().sort((a,b)=>{
    if(collSort==='alpha') return collName(a).localeCompare(collName(b),LANG==='ar'?'ar':'en');
    if(collSort==='count') return collRecord(b.id).catches.length-collRecord(a.id).catches.length;
    if(collSort==='rarity') return RARITY_TIERS[b.rarity].order-RARITY_TIERS[a.rarity].order;
    if(collSort==='best'){
      const bv=primaryKey?(collBest(collRecord(b.id),primaryKey)||0):0;
      const av=primaryKey?(collBest(collRecord(a.id),primaryKey)||0):0;
      return bv-av;
    }
    return 0;
  });

  const grid=document.getElementById('collSpeciesGrid');
  const emptyMsg=document.getElementById('collEmptyMsg');
  if(!filtered.length){
    grid.innerHTML='';
    emptyMsg.textContent=LANG==='ar'?'ما فيه نتائج':'No species match';
    emptyMsg.classList.remove('hidden');
    return;
  }
  emptyMsg.classList.add('hidden');
  grid.innerHTML=filtered.map(sp=>{
    const rec=collRecord(sp.id);
    const collected=collIsCollected(rec);
    const tier=RARITY_TIERS[sp.rarity];
    let badge='';
    if(collected && bestHolderId===sp.id) badge='<span class="coll-corner-badge" title="best">🏆</span>';
    return `<div class="coll-species-card ${collected?'collected tier-'+sp.rarity:'locked'}" data-sp="${sp.id}">
      <span class="coll-rarity-mini rarity-tag coll-rarity-${sp.rarity}">${tier.icon}</span>
      ${badge}
      <div class="thumb">${collected?sp.icon:('<span class="lock-ic">🔒</span>'+sp.icon)}</div>
      <div class="name">${collName(sp)}</div>
      <div class="meta">${collected?(rec.catches.length+' '+(LANG==='ar'?cat.countLabelAr:cat.countLabelEn)):(LANG==='ar'?'غير مجموع':'Not collected')}</div>
    </div>`;
  }).join('');
  grid.querySelectorAll('.coll-species-card').forEach(cardEl=>{
    cardEl.addEventListener('click',()=>{
      collCurrentSpecies=cardEl.dataset.sp;
      collGoTo('species');
      renderCollSpeciesDetail();
    });
  });
}

/* Kept deliberately simple per current direction: emoji + name + rarity +
   collected/count only. Richer fields (taxonomy, conservation, breeds,
   personal-best measurements, sources) still exist on the species objects
   and in helper functions below — nothing was deleted from the data model —
   they're just not rendered here until that layer is asked for again. */
async function renderCollSpeciesDetail(){
  const cat=collCategoryConfig(collCurrentCat);
  const sp=collSpeciesInfo(collCurrentCat,collCurrentSpecies);
  const rec=collRecord(sp.id);
  const collected=collIsCollected(rec);
  const tier=RARITY_TIERS[sp.rarity];
  const photoCacheKey=collCurrentCat+':'+sp.id;
  let photo=null;
  if(rec.hasPhoto){
    if(collPhotoCache[photoCacheKey]!==undefined){ photo=collPhotoCache[photoCacheKey]; }
    else{
      try{ const raw=await storageGet('collection-photo:'+collCurrentCat+':'+sp.id); photo=raw?JSON.parse(raw):null; }catch(e){}
      collPhotoCache[photoCacheKey]=photo;
    }
  }

  const recordsHtml=cat.measurements.map(m=>{
    const v=collBest(rec,m.key);
    return `<div class="coll-record-chip"><div class="rv">${v!==null?('🏆 '+v+' '+m.unit):'—'}</div><div class="rl">${LANG==='ar'?m.labelAr:m.labelEn}</div></div>`;
  }).join('');
  const logInputsHtml=cat.measurements.map(m=>`<input type="number" step="0.01" inputmode="decimal" id="collLogInput-${m.key}" placeholder="${(LANG==='ar'?m.labelAr:m.labelEn)+' ('+m.unit+')'}">`).join('');

  const el=document.getElementById('collSpeciesDetail');
  el.innerHTML=`
    <div class="coll-detail-photo ${photo?'':'is-reference'} ${collected?'tier-'+sp.rarity:''}">
      ${photo?`<img src="${photo.dataUrl}" alt="">`:sp.icon}
      <span class="coll-photo-tag ${photo?'mine':'reference'}">${photo?(LANG==='ar'?'📷 صورتي':'📷 My photo'):(LANG==='ar'?'صورة مرجعية':'Reference image')}</span>
    </div>
    <div class="coll-pill-row">
      <span class="coll-status-pill ${collected?'collected':'locked'}">${collected?(LANG==='ar'?'✅ مجموع':'✅ Collected'):(LANG==='ar'?'🔒 غير مجموع':'🔒 Not collected')}</span>
      <span class="coll-rarity-pill coll-rarity-${sp.rarity}">${tier.icon} ${LANG==='ar'?tier.nameAr:tier.nameEn}</span>
    </div>
    <h2 style="text-align:center;margin:0 0 16px;color:var(--accent-deep);">${collName(sp)}</h2>

    <div class="coll-counter-row">
      <button class="coll-counter-btn" id="collDecBtn" ${rec.catches.length<=0?'disabled':''}>−</button>
      <div class="coll-counter-num" id="collCounterNum">${rec.catches.length}</div>
      <button class="coll-counter-btn" id="collIncBtn">+</button>
    </div>
    <div class="coll-counter-label">${LANG==='ar'?cat.countLabelAr:cat.countLabelEn}</div>

    <div class="coll-records-grid">${recordsHtml}</div>

    <div class="setup-card">
      <h3 style="font-size:0.85rem;">${LANG==='ar'?'📝 سجّل القياسات هالمرة (اختياري)':'📝 Log measurements for this time (optional)'}</h3>
      <div class="coll-log-form">
        ${logInputsHtml}
        <button id="collLogSaveBtn">${LANG==='ar'?'حفظ':'Save'}</button>
      </div>
      <p class="sub" style="margin:0;">${LANG==='ar'?'يسوي زيادة تلقائية بالعداد':'This also adds one to the counter above'}</p>
    </div>

    <input type="file" accept="image/*" class="hidden" id="collPhotoInput">
    <button class="setup-btn" id="collUploadBtn" style="background:var(--card);color:var(--accent-deep);border:1px solid var(--accent-deep);margin-top:16px;">📷 ${LANG==='ar'?'ارفع صورتك':'Upload my photo'}</button>
  `;
  document.getElementById('collIncBtn').addEventListener('click',()=>collAddCatch({}));
  document.getElementById('collDecBtn').addEventListener('click',collRemoveLastCatch);
  document.getElementById('collLogSaveBtn').addEventListener('click',()=>{
    const measurements={};
    cat.measurements.forEach(m=>{
      const raw=document.getElementById('collLogInput-'+m.key).value;
      if(raw!==''&&!isNaN(parseFloat(raw))) measurements[m.key]=parseFloat(raw);
    });
    collAddCatch(measurements);
  });
  document.getElementById('collUploadBtn').addEventListener('click',()=>document.getElementById('collPhotoInput').click());
  document.getElementById('collPhotoInput').addEventListener('change',collHandlePhotoUpload);
}

function collToggleVariant(variantId){
  const rec=collRecord(collCurrentSpecies);
  if(!collCatData[collCurrentSpecies]) collCatData[collCurrentSpecies]=rec;
  rec.variantState=rec.variantState||{};
  const wasDone=!!(rec.variantState[variantId]&&rec.variantState[variantId].collected);
  rec.variantState[variantId]={collected:!wasDone};
  renderCollSpeciesDetail();
  collSaveCategory(collCurrentCat);
}

function collAddCatch(measurements){
  const rec=collRecord(collCurrentSpecies);
  if(!collCatData[collCurrentSpecies]) collCatData[collCurrentSpecies]=rec;
  rec.catches=rec.catches||[];
  rec.catches.push({id:collGenId(), date:new Date().toISOString(), measurements:measurements||{}});
  renderCollSpeciesDetail();     // instant feedback — never block the tap on a network round-trip
  collSaveCategory(collCurrentCat);
}
function collRemoveLastCatch(){
  const rec=collRecord(collCurrentSpecies);
  if(!rec.catches||!rec.catches.length) return;
  rec.catches.pop();
  const nowEmpty=rec.catches.length===0;
  renderCollSpeciesDetail();
  collSaveCategory(collCurrentCat);
  if(nowEmpty) showToast(LANG==='ar'?'رجع لغير مجموع — صورك ومعلوماتك محفوظة':'Marked as not collected — your photo & info are kept');
}
async function collHandlePhotoUpload(e){
  const file=e.target.files[0];
  e.target.value='';
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast(LANG==='ar'?'اختر صورة':'Please choose an image','error'); return; }
  try{
    const dataUrl=await collCompressImage(file);
    const photoRecord={dataUrl, uploadedAt:new Date().toISOString()};
    collPhotoCache[collCurrentCat+':'+collCurrentSpecies]=photoRecord;
    const rec=collRecord(collCurrentSpecies);
    if(!collCatData[collCurrentSpecies]) collCatData[collCurrentSpecies]=rec;
    rec.hasPhoto=true;
    if(!rec.catches||!rec.catches.length){ rec.catches=[{id:collGenId(), date:new Date().toISOString(), measurements:{}}]; }
    renderCollSpeciesDetail();   // instant — show the photo before the network write finishes
    storageSet('collection-photo:'+collCurrentCat+':'+collCurrentSpecies, JSON.stringify(photoRecord));
    collSaveCategory(collCurrentCat);
    showToast(LANG==='ar'?'انحفظت صورتك 📷':'Your photo was saved 📷');
  }catch(err){ showToast((LANG==='ar'?'فشل رفع الصورة: ':'Photo upload failed: ')+err.message,'error'); }
}
/* resize+compress client-side so a photo fits comfortably inside one
   Firestore document (1MiB limit) — Firebase Storage now requires the paid
   Blaze plan, so this keeps photo uploads working on the free Spark plan */
function collCompressImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error(LANG==='ar'?'ما قدرنا نقرأ الملف':'Could not read the file'));
    reader.onload=()=>{
      img.onerror=()=>reject(new Error(LANG==='ar'?'الملف مو صورة صالحة':'That file is not a valid image'));
      img.onload=()=>{
        const maxDim=900;
        let {width,height}=img;
        if(width>maxDim||height>maxDim){
          if(width>height){ height=Math.round(height*maxDim/width); width=maxDim; }
          else{ width=Math.round(width*maxDim/height); height=maxDim; }
        }
        const canvas=document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        let quality=0.72;
        let dataUrl=canvas.toDataURL('image/jpeg',quality);
        while(dataUrl.length>700000 && quality>0.3){ quality-=0.1; dataUrl=canvas.toDataURL('image/jpeg',quality); }
        if(dataUrl.length>900000){ reject(new Error(LANG==='ar'?'الصورة كبيرة جداً':'That image is too large')); return; }
        resolve(dataUrl);
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
