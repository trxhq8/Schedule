/* video link for any exercise: strips numbering + rep/set info from the English
   name and builds a YouTube search link — works for every exercise at every
   level (beginner/amateur/pro) since it's generated from the text itself,
   not a hand-picked list */
function exerciseVideoUrl(enText){
  if(!enText) return null;
  let q=enText.replace(/^\d+\.\s*/,'').split('—')[0].trim();
  if(!q) return null;
  return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q+' exercise proper form tutorial');
}
function videoIconHtml(enText){
  const url=exerciseVideoUrl(enText);
  if(!url) return '';
  return `<a href="${url}" target="_blank" rel="noopener noreferrer" style="margin-inline-start:8px;text-decoration:none;font-size:0.85em;vertical-align:middle;" title="${LANG==='ar'?'شاهد فيديو الحركة':'Watch exercise video'}">🎥</a>`;
}

/* ================= ACHIEVEMENT SOUND (original, synthesized — no audio file,
   no copyrighted material) =================
   A short rising three-note chime (each note itself two detuned oscillators
   for a bright "bell" shimmer) followed by a quick high sparkle — built
   entirely from Web Audio oscillators/gain envelopes so there is nothing to
   license or copy. One AudioContext is created lazily on first use and
   reused forever (creating a fresh one per play is wasteful and some
   browsers cap how many can exist at once). */
let _achAudioCtx=null;
function getAchAudioCtx(){
  if(_achAudioCtx) return _achAudioCtx;
  try{ _achAudioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  return _achAudioCtx;
}
function achSoundEnabled(){ return !P.settings || P.settings.achSoundEnabled!==false; }
function achSoundVolume(){ return (P.settings&&P.settings.achSoundVolume!=null) ? P.settings.achSoundVolume : 0.7; }
/* plays one bell-like note: a fundamental + a quiet detuned partner an
   octave+a-fifth up (2.5x), fast attack, exponential decay — the detuned
   overtone is what makes it read as a "chime" instead of a flat beep. */
function achPlayNote(ctx,master,freq,startAt,dur,gainScale){
  [1,2.5].forEach((mult,i)=>{
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type= i===0 ? 'sine' : 'triangle';
    osc.frequency.value=freq*mult;
    const peak=(i===0?0.32:0.09)*gainScale;
    gain.gain.setValueAtTime(0,startAt);
    gain.gain.linearRampToValueAtTime(peak,startAt+0.012);
    gain.gain.exponentialRampToValueAtTime(0.0005,startAt+dur);
    osc.connect(gain); gain.connect(master);
    osc.start(startAt); osc.stop(startAt+dur+0.05);
  });
}
function playAchievementSound(){
  if(!achSoundEnabled()) return;
  try{
    const ctx=getAchAudioCtx(); if(!ctx) return;
    if(ctx.state==='suspended') ctx.resume().catch(()=>{}); // needs a prior user gesture — every real trigger site is inside one
    const master=ctx.createGain();
    master.gain.value=Math.max(0,Math.min(1,achSoundVolume()));
    master.connect(ctx.destination);
    const now=ctx.currentTime;
    // rising triumphant arpeggio: C5 E5 G5 C6, then a quick high sparkle
    const notes=[523.25,659.25,783.99,1046.5];
    notes.forEach((f,i)=>achPlayNote(ctx,master,f,now+i*0.085,0.42,1));
    [1567.98,1975.53].forEach((f,i)=>achPlayNote(ctx,master,f,now+0.36+i*0.05,0.3,0.5));
  }catch(e){ /* autoplay-restricted or unsupported — never crash the app over a sound */ }
}

/* ================= ACHIEVEMENT MODAL (queued, one at a time) =================
   Fed exclusively by notifyNewUnlocks() right after a real completion event —
   never on boot/section-render — so this can only ever appear for something
   that JUST happened, matching checkAndAwardAchievements()'s one-time-ever
   award guarantee. Challenge completions share the same modal (their own
   kicker label) for one consistent "you just achieved something" moment. */
let achievementQueue=[];
let achievementModalShowing=false;
function enqueueAchievements(items){
  if(!items||!items.length) return;
  achievementQueue.push(...items);
  if(!achievementModalShowing) showNextAchievement();
}
function showNextAchievement(){
  const item=achievementQueue.shift();
  if(!item){ achievementModalShowing=false; document.getElementById('achievementOverlay').classList.remove('open'); return; }
  achievementModalShowing=true;
  const kickerKey=item.kind==='challenge' ? 'challenge_complete_kicker' : 'ach_unlocked_kicker';
  const name=LANG==='ar'?(item.nameAr||item.descAr):(item.nameEn||item.descEn);
  const desc=LANG==='ar'?(item.descAr||''):(item.descEn||'');
  document.getElementById('achTrophyIcon').textContent=item.icon||'🏆';
  document.getElementById('achKicker').textContent=t(kickerKey);
  document.getElementById('achName').textContent=name;
  document.getElementById('achDesc').textContent=desc;
  document.getElementById('achXp').textContent=`+${item.xp||0} XP`+(item.coins?` · +${item.coins} 🪙`:'');
  document.getElementById('achXp').classList.toggle('hidden',!item.xp && !item.coins);
  document.getElementById('achContinueBtn').textContent=t('ach_continue');
  const note=document.getElementById('achQueueNote');
  if(achievementQueue.length){ note.textContent=t('ach_queue_note').replace('{n}',achievementQueue.length); note.classList.remove('hidden'); }
  else note.classList.add('hidden');
  document.getElementById('achievementOverlay').classList.add('open');
  playAchievementSound();
}
document.getElementById('achContinueBtn').addEventListener('click',showNextAchievement);
document.getElementById('achievementOverlay').addEventListener('click',(e)=>{ if(e.target.id==='achievementOverlay') showNextAchievement(); });

/* ---- REST TIMER: tap the ⏱️ next to any exercise to start a countdown with
   a beep at the end (Web Audio API, no sound file needed). Global so the
   inline onclick in the generated HTML string can reach it. ---- */
let restTimerInterval=null;
function playBeep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value=880; gain.gain.value=0.25;
    osc.start();
    setTimeout(()=>{ osc.stop(); ctx.close(); },450);
  }catch(e){}
}
function stopRestTimer(){
  if(restTimerInterval){ clearInterval(restTimerInterval); restTimerInterval=null; }
  const bar=document.getElementById('restTimerBar'); if(bar) bar.remove();
}
function startRestTimer(seconds){
  seconds=seconds||60;
  stopRestTimer();
  let remaining=seconds;
  const bar=document.createElement('div');
  bar.id='restTimerBar';
  bar.style.cssText='position:fixed;bottom:0;left:0;right:0;background:var(--accent-deep);color:#fff;padding:14px;text-align:center;font-family:var(--font-head);font-weight:800;font-size:1rem;z-index:9998;display:flex;align-items:center;justify-content:center;gap:14px;box-shadow:0 -4px 16px rgba(0,0,0,0.2);';
  bar.innerHTML=`<span>⏱️ <span id="restTimerNum">${remaining}</span>s</span>
    <button type="button" onclick="startRestTimer(60)" style="background:rgba(255,255,255,0.25);color:#fff;border:none;border-radius:8px;padding:6px 10px;font-family:var(--font-head);font-weight:700;font-size:0.8rem;cursor:pointer;">+60</button>
    <button type="button" onclick="stopRestTimer()" style="background:#fff;color:#4c6350;border:none;border-radius:8px;padding:6px 14px;font-family:var(--font-head);font-weight:800;cursor:pointer;">${LANG==='ar'?'إيقاف':'Stop'}</button>`;
  document.body.appendChild(bar);
  restTimerInterval=setInterval(()=>{
    remaining--;
    const numEl=document.getElementById('restTimerNum');
    if(numEl) numEl.textContent=remaining;
    if(remaining<=0){ playBeep(); stopRestTimer(); }
  },1000);
}
/* splits "١. اسم التمرين — ٣ × ١٢-١٥" into {name, sets, reps} for the table view */
function parseExerciseRow(text){
  const dashIdx=text.indexOf('—');
  let name = dashIdx>=0 ? text.slice(0,dashIdx).trim() : text.trim();
  let metrics = dashIdx>=0 ? text.slice(dashIdx+1).trim() : '';
  name = name.replace(/^[\d٠-٩]+\.\s*/,'');
  let sets='-', reps=metrics;
  if(metrics.includes('×')){
    const parts=metrics.split('×');
    sets=parts[0].trim();
    reps=parts.slice(1).join('×').trim();
  }
  return {name,sets,reps};
}
let exRowCounter=0;
/* stable identity for an exercise, used as the key for logged sets and for
   the "last time" reference — built from the English name (fixed per
   level/equipment variant) so switching level/equipment naturally starts
   fresh history for the new variant instead of mixing incompatible logs. */
function slugifyExerciseName(name){ return String(name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function exerciseId(typeKey,enName){ return typeKey+'|'+slugifyExerciseName(enName); }
/* Training checklist: exercise name + a single ✅ per exercise — nothing
   else. Persisted per exercise (dailyTrack.exerciseChecks[exId]) only for
   TODAY's day, same scoping every other today-only feature (the done
   toggle, feedback prompt) already uses. Once the day itself is marked
   done, every checkbox here is rendered disabled and anything left
   unchecked is shown crossed out — "not completed", permanently, for that
   day — see the workoutDoneToggle handler in openWorkoutDay(). */
function exerciseTableHtml(list,timerSecs,showVideo,typeKey,isToday){
  if(!list||!list.length) return '';
  const locked = isToday && !!dailyTrack.workoutDone;
  let rows='';
  list.forEach(e=>{
    const p=parseExerciseRow(e[LANG]);
    const vid = showVideo ? videoIconHtml(e.en) : '';
    const timer = showVideo ? timerIconHtml(timerSecs) : '';
    const rid='exrow'+(exRowCounter++);
    if(isToday && typeKey){
      const exId=exerciseId(typeKey,parseExerciseRow(e.en).name);
      const checked=!!(dailyTrack.exerciseChecks&&dailyTrack.exerciseChecks[exId]);
      const rowClass = checked ? 'ex-done' : (locked ? 'ex-missed' : '');
      rows+=`<tr id="${rid}"${rowClass?` class="${rowClass}"`:''}><td>${p.name}${vid}${timer}</td><td style="text-align:center;"><input type="checkbox" class="ex-check-input" data-exid="${exId}" ${checked?'checked':''} ${locked?'disabled':''}></td></tr>`;
    } else {
      // a plain, non-persisted preview checkbox for a non-today day (nothing to lock/save — there's no "today done" state for a day you're just previewing)
      rows+=`<tr id="${rid}"><td>${p.name}${vid}${timer}</td><td style="text-align:center;"><input type="checkbox" onchange="document.getElementById('${rid}').classList.toggle('ex-done',this.checked)"></td></tr>`;
    }
  });
  return `<table class="ex-table"><thead><tr><th>Exercise</th><th>✓</th></tr></thead><tbody>${rows}</tbody></table>`;
}
/* the only place dailyTrack.exerciseChecks is written — a plain per-exercise
   toggle, blocked entirely once the day is locked (the input itself is
   `disabled` in that case, so this only ever fires while the day is still
   open). */
document.addEventListener('change',async(e)=>{
  const el=e.target;
  if(!el.matches || !el.matches('.ex-check-input')) return;
  const exId=el.dataset.exid;
  dailyTrack.exerciseChecks=dailyTrack.exerciseChecks||{};
  dailyTrack.exerciseChecks[exId]=el.checked;
  await saveDailyTrack();
  const row=el.closest('tr');
  if(row) row.classList.toggle('ex-done',el.checked);
});
function timerIconHtml(seconds){
  seconds=seconds||60;
  return `<button type="button" onclick="startRestTimer(${seconds})" style="margin-inline-start:6px;border:none;background:none;cursor:pointer;font-size:0.85em;vertical-align:middle;padding:0;" title="${LANG==='ar'?'مؤقت راحة ٦٠ ثانية':'60s rest timer'}">⏱️</button>`;
}

function currentTier(typeKey){
  const level=(P.workoutCounts&&P.workoutCounts[typeKey])||0;
  return Math.min(4,Math.max(0,level))+1;
}

function applyToolUpgrades(day,typeKey){
  const eq=(P.workoutSetup&&P.workoutSetup.equipment)||[];
  const rules=TOOL_UPGRADES[typeKey]||[];
  rules.forEach(rule=>{
    if(!rule.requires.every(r=>eq.includes(r))) return;
    const idx=day.main.findIndex(e=>e.ar.includes(rule.find));
    if(idx>=0) day.main[idx]=rule.version;
  });
}
function applyBandUpgrades(day,typeKey){
  const eq=(P.workoutSetup&&P.workoutSetup.equipment)||[];
  if(!eq.includes('band')) return;
  const rules=BAND_UPGRADES[typeKey]||[];
  rules.forEach(rule=>{
    const idx=day.main.findIndex(e=>e.ar.includes(rule.find));
    if(idx>=0) day.main[idx]=rule.bandVersion;
  });
}
function applyEquipmentSwaps(day,typeKey){
  const eq=(P.workoutSetup&&P.workoutSetup.equipment)||[];
  const rules=EQUIPMENT_SWAPS[typeKey]||[];
  rules.forEach(rule=>{
    if(eq.includes(rule.requires)) return;
    const replacement=(eq.includes('band') && rule.altBand) ? rule.altBand : rule.altNone;
    const idx=day.main.findIndex(e=>e.ar.includes(rule.find));
    if(idx>=0) day.main[idx]=replacement;
    const sidx=day.small.findIndex(e=>e.ar.includes(rule.find));
    if(sidx>=0) day.small[sidx]=replacement;
  });
}
function applyGoalAdditions(day,typeKey){

function adaptDay(typeKey){
  const ws=P.workoutSetup||{};
  const isGym=ws.trainLocation==='gym';
  const base=(isGym?GYM_WORKOUT_TYPES:workoutTypes)[typeKey];
  const level=(P.exerciseLevel&&P.exerciseLevel[typeKey])||'amateur';
  const levelMain=isGym?GYM_LEVEL_MAIN:LEVEL_MAIN;
  const levelSmall=isGym?GYM_LEVEL_SMALL:LEVEL_SMALL;
  const mainSource=(typeKey!=='rest'&&levelMain[level]&&levelMain[level][typeKey]) ? levelMain[level][typeKey] : base.main;
  const smallSource=(typeKey!=='rest'&&levelSmall[level]&&levelSmall[level][typeKey]) ? levelSmall[level][typeKey] : base.small;
  const day={icon:base.icon,name:base.name,color:base.color,main:mainSource.map(x=>({...x})),small:smallSource.map(x=>({...x})),stretch:base.stretch,warns:[]};
  if(!isGym){
    // gym exercises already assume full equipment — the bodyweight→equipment
    // swap/upgrade tables only make sense for the home pool
    applyEquipmentSwaps(day,typeKey);
    applyBandUpgrades(day,typeKey);
    applyToolUpgrades(day,typeKey);
  }
  (ws.injuries||[]).forEach(inj=>{
    const mod=INJURY_MODS[inj]; if(!mod) return;
    const swaps=(mod.swaps||{})[typeKey]||[];
    swaps.forEach(([m,rep])=>{ const idx=day.main.findIndex(e=>e.ar.includes(m.find)); if(idx>=0) day.main[idx]=rep; });
    if(typeKey!=='rest' && mod.applies.includes(typeKey)) day.warns.push(mod.warn);
  });
  (ws.injuryAnalysis||[]).forEach(a=>{
    const AVOID_MAP={push:'avoidPush',chest:'avoidPush',shoulders:'avoidPush',pull:'avoidPull',back:'avoidPull',arms:'avoidPull',legs:'avoidLegs',lower:'avoidLegs',upper:'avoidPush',full:'avoidPush'};
    const unsafe=AVOID_MAP[typeKey]&&a[AVOID_MAP[typeKey]];
    if(unsafe && typeKey!=='rest'){
      day.skippedByInjury={ar:a.noteAr,en:a.noteEn,text:a.text};
      const typeNameAr=I18N.ar['type_'+typeKey], typeNameEn=I18N.en['type_'+typeKey];
      day.main=[{ar:`⚠️ تخطينا تمارين ${typeNameAr} اليوم بسبب: ${a.text}`,en:`⚠️ Skipped ${typeNameEn} exercises today because of: ${a.text}`}];
      day.small=[];
    } else {
      day.warns.push({ar:`📝 ${a.text}: ${a.noteAr}`,en:`📝 ${a.text}: ${a.noteEn}`});
    }
  });
  applyGoalAdditions(day,typeKey);
  return day;
}

/* native <input type=time> renders in 24h or 12h depending on OS/browser
   locale, regardless of formatTime12h() used everywhere else in the app —
   so we build our own hour/minute/AM-PM selects and write a 24h "HH:MM"
   into a hidden input, guaranteeing AM/PM display no matter the platform */
function timeTo12h(hhmm){
  if(!hhmm) return {h:8,m:0,ampm:'AM'};
  const [h,m]=hhmm.split(':').map(Number);
  const ampm = h<12 ? 'AM':'PM';
  let h12=h%12; if(h12===0) h12=12;
  return {h:h12,m,ampm};
}
function to24h(h12,m,ampm){
  let h=h12%12;
  if(ampm==='PM') h+=12;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function buildTimePicker(pickerId,hiddenId,initial24h){
  const picker=document.getElementById(pickerId);
  const hidden=document.getElementById(hiddenId);
  const {h,m,ampm}=timeTo12h(initial24h);
  const hourOpts=Array.from({length:12},(_,i)=>i+1).map(v=>`<option value="${v}"${v===h?' selected':''}>${v}</option>`).join('');
  const minOpts=[0,5,10,15,20,25,30,35,40,45,50,55].map(v=>`<option value="${v}"${v===m?' selected':''}>${String(v).padStart(2,'0')}</option>`).join('');
  picker.innerHTML=`<select class="tp-hour">${hourOpts}</select><select class="tp-min">${minOpts}</select><select class="tp-ampm"><option value="AM"${ampm==='AM'?' selected':''}>AM</option><option value="PM"${ampm==='PM'?' selected':''}>PM</option></select>`;
  function update(){
    const hv=+picker.querySelector('.tp-hour').value;
    const mv=+picker.querySelector('.tp-min').value;
    const av=picker.querySelector('.tp-ampm').value;
    hidden.value=to24h(hv,mv,av);
  }
  picker.querySelectorAll('select').forEach(s=>s.addEventListener('change',update));
  update();
}

function renderCommitList(){
  const box=document.getElementById('commitListChips'); box.innerHTML='';
  const list=P._commitments||[];
  // retroactively flag any pair that's already conflicting — e.g. loaded
  // from before this feature existed, or created some other way — so a
  // real conflict is never invisible just because it wasn't caught at
  // add-time.
  const conflicts=findAllScheduleConflicts(list);
  const conflictedSet=new Set();
  conflicts.forEach(cf=>{ if(cf.kind==='overlap'){ conflictedSet.add(cf.a); conflictedSet.add(cf.b); } });
  const sorted=list.map((c,i)=>({c,i})).sort((a,b)=>{
    if(!!b.c.pinned!==!!a.c.pinned) return (b.c.pinned?1:0)-(a.c.pinned?1:0);
    const sa=commitTimeSpan(a.c), sb=commitTimeSpan(b.c);
    return (sa?sa.start:-1)-(sb?sb.start:-1);
  });
  sorted.forEach(({c,i})=>{
    const dayLabels=c.days.map(d=>DAY_NAMES[LANG][d]).join(LANG==='ar'?'،':', ');
    const rangeLabel=(c.fromDate||c.toDate) ? ` [${c.fromDate||'…'} → ${c.toDate||'…'}]` : '';
    const conflictBadge=conflictedSet.has(c) ? `<span style="color:var(--err);font-weight:700;">${t('conflict_badge')}</span> ` : '';
    const chip=document.createElement('div'); chip.className='tag-chip commit-chip';
    chip.innerHTML=`<span>${conflictBadge}📌 ${c.label} (${formatCommitRange(c)}, ${dayLabels}${rangeLabel})${c.hard===false?' 🔓':''}</span><button class="pin-btn${c.pinned?' pinned-visible':''}" type="button" title="${LANG==='ar'?'ثبّت':'Pin'}">${c.pinned?'📌':'📍'}</button><button type="button">✕</button>`;
    chip.querySelector('.pin-btn').addEventListener('click',()=>{ c.pinned=!c.pinned; renderCommitList(); });
    chip.querySelector('button:last-child').addEventListener('click',()=>{ P._commitments.splice(i,1); renderCommitList(); });
    box.appendChild(chip);
  });
}

/* the ONLY path that adds a commitment to the draft list — always checks
   for real conflicts first and never saves silently over one. `opts.forceKeep`
   is set only after the user explicitly chose "keep both anyway". */
function attemptAddCommitment(candidate, opts){
  opts=opts||{};
  const conflicts=findConflictsFor(candidate, P._commitments||[]);
  const overlaps=conflicts.filter(c=>c.kind==='overlap');
  const bufferIssues=conflicts.filter(c=>c.kind==='buffer');
  if((overlaps.length||bufferIssues.length) && !opts.forceKeep){
    showConflictModal(candidate, overlaps, bufferIssues, {
      onKeepBoth:()=>finalizeAddCommitment(candidate),
      onMoveCandidate:(newFrom,newTo)=>{ candidate.from=newFrom; candidate.to=newTo; attemptAddCommitment(candidate); },
      onMoveOther:()=>finalizeAddCommitment(candidate),
      onCancel:()=>{}
    });
    return;
  }
  finalizeAddCommitment(candidate);
}

function parseHM(hhmm){ const [h,m]=hhmm.split(':').map(Number); return h*60+m; }
function formatTime12h(hhmm){
  if(!hhmm) return '';
  let [h,m]=hhmm.split(':').map(Number);

  let h12=h%12; if(h12===0) h12=12;
  const mm=String(m).padStart(2,'0');

}
function formatSlot12h(slot){ const [a,b]=slot.split('-'); return `${formatTime12h(a)} - ${formatTime12h(b)}`; }
function formatCommitRange(c){

  if(c.from&&c.to) return `${formatTime12h(c.from)}-${formatTime12h(c.to)}`;
  return formatTime12h(c.from||c.to);
}
/* ================= SCHEDULE CONFLICT ENGINE =================
   A real overlap/buffer detector over the SAME commitment objects the
   rest of the app already reads (P.todoSetup.commitments) — no parallel
   "events" model. Every add/edit goes through attemptAddCommitment(),
   which NEVER silently saves an overlapping or under-buffered pair; it
   always surfaces the conflict and lets the user choose, per the
   "never guess, always ask" rule. */
const DEFAULT_SCHEDULE_BUFFER_MIN=10;
function scheduleBufferMinutes(){ return (P.scheduleBufferMinutes!=null) ? P.scheduleBufferMinutes : DEFAULT_SCHEDULE_BUFFER_MIN; }
/* {start,end} in minutes-from-midnight, end always > start (wraps past
   midnight for overnight commitments like 22:00-02:00). null = "all day",
   which is treated as overlapping any timed commitment that shares a day. */
function commitTimeSpan(c){
  if(!c.from&&!c.to) return null;
  const start=parseHM(c.from||c.to);
  let end=parseHM(c.to||c.from);
  if(end<=start) end+=24*60;
  return {start,end};
}
function daysIntersect(a,b){ return (a.days||[]).filter(d=>(b.days||[]).includes(d)); }
/* an all-day commitment (no specific time — s1/s2 null) is a plain
   "remember to do this today" reminder, not a block of time, so it can
   never collide with a timed commitment or with another all-day one. */
function spansOverlap(s1,s2){ if(!s1||!s2) return false; return s1.start<s2.end && s2.start<s1.end; }
/* s1 = candidate's span, s2 = the existing commitment's span — named by
   ROLE (candidate/other), not by position, since "a/b" labels are easy to
   misread backwards (this tripped up even the test written for it). */
function overlapType(s1,s2){
  if(!s1||!s2) return 'allday';
  if(s1.start===s2.start && s1.end===s2.end) return 'exact';
  if(s1.start<=s2.start && s1.end>=s2.end) return 'candidate-contains-other';
  if(s2.start<=s1.start && s2.end>=s1.end) return 'other-contains-candidate';
  return 'partial';
}
/* minutes between two NON-overlapping spans that share a day (how tight
   a back-to-back transition is) — null when they aren't adjacent-ish
   (i.e. they actually overlap, handled separately) */
function gapBetween(s1,s2){
  if(!s1||!s2) return null;
  if(s1.end<=s2.start) return s2.start-s1.end;
  if(s2.end<=s1.start) return s1.start-s2.end;
  return null;
}
/* every real conflict `candidate` has against `existing` — both overlaps
   (kind:'overlap') and tight-buffer back-to-backs (kind:'buffer') — scoped
   to the days they actually share, so two commitments on different days
   never falsely conflict just because their time ranges overlap. */
function findConflictsFor(candidate, existing, bufferMin){
  bufferMin = bufferMin==null ? scheduleBufferMinutes() : bufferMin;
  const results=[];
  const s1=commitTimeSpan(candidate);
  (existing||[]).forEach(other=>{
    if(other===candidate) return;
    const sharedDays=daysIntersect(candidate,other);
    if(!sharedDays.length) return;
    const s2=commitTimeSpan(other);
    if(spansOverlap(s1,s2)){
      results.push({other, sharedDays, kind:'overlap', type:overlapType(s1,s2)});
    } else {
      const gap=gapBetween(s1,s2);
      if(gap!=null && gap<bufferMin) results.push({other, sharedDays, kind:'buffer', gap});
    }
  });
  return results;
}
/* every conflicting PAIR across a whole commitment list — used to
   retroactively flag existing saved commitments, not just new ones. */
function findAllScheduleConflicts(commitments, bufferMin){
  const seen=new Set(); const out=[];
  (commitments||[]).forEach((c,i)=>{
    findConflictsFor(c, commitments, bufferMin).forEach(cf=>{
      const j=commitments.indexOf(cf.other);
      const key=[i,j].sort((a,b)=>a-b).join('-');
      if(seen.has(key)) return;
      seen.add(key);
      out.push({a:c, b:cf.other, sharedDays:cf.sharedDays, kind:cf.kind, type:cf.type, gap:cf.gap});
    });
  });
  return out;
}
function minutesToHM(mins){ mins=((mins%1440)+1440)%1440; const h=Math.floor(mins/60), m=mins%60; return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; }
/* the next free slot for `flexible` on a specific shared `day`, starting
   after `fixed` ends (+buffer) and not colliding with anything ELSE
   already on that day — bounded to the rest of that day (never wraps to
   "tomorrow", since that would silently change which day the commitment
   is on). Returns null when nothing fits, rather than guessing. */
function suggestTimeAfter(flexible, fixed, allCommitments, day, bufferMin){
  bufferMin = bufferMin==null ? scheduleBufferMinutes() : bufferMin;
  const fixedSpan=commitTimeSpan(fixed);
  if(!fixedSpan) return null; // fixed is all-day -> no slot exists that day at all
  const flexSpan=commitTimeSpan(flexible);
  const durationMin=flexSpan ? (flexSpan.end-flexSpan.start) : 30;
  const others=(allCommitments||[]).filter(c=>c!==flexible && c!==fixed && (c.days||[]).includes(day));
  let candidateStart=fixedSpan.end+bufferMin;
  const dayEnd=24*60;
  while(candidateStart+durationMin<=dayEnd){
    const candidateSpan={start:candidateStart,end:candidateStart+durationMin};
    const collides=others.some(o=>spansOverlap(candidateSpan,commitTimeSpan(o)));
    if(!collides) return candidateSpan;
    candidateStart+=15;
  }
  return null;
}

function isoDateStr(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function commitmentsForDate(dateObj){

  const dateStr=isoDateStr(dateObj.getFullYear(),dateObj.getMonth(),dateObj.getDate());
  return ((P.todoSetup&&P.todoSetup.commitments)||[]).filter(c=>{

    if(c.toDate && dateStr>c.toDate) return false;
    return true;
  }).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));
}

/* No strict formula sets an "optimal" meal count — research shows meal
   frequency itself barely matters once calories/protein are fixed. This is
   just a practical starting point sized to the calorie target (which factors
   in the target weight/date asked right before this step), always editable. */
/* returns {kcal, dailyAdjust} — dailyAdjust is the signed daily surplus (+)
   or deficit (-) vs. maintenance (TDEE) implied by the target weight/date */
/* single source of truth for BMR/TDEE/rate math — both the live setup-
   wizard preview and the post-setup calorieTarget() below call these same
   functions, instead of keeping two slightly-diverged copies. */
function calculateBMR(weight,height,age,sex){
  return (sex==='female') ? (10*weight+6.25*height-5*age-161) : (10*weight+6.25*height-5*age+5);
}
function calculateTDEE(bmr,factor){ return bmr*factor; }
function dailyKcalAdjustForRate(weeklyRateKg){ return (weeklyRateKg*7700)/7; }
function applyCalorieSafetyLimits(kcal,sex){
  const floor = sex==='female' ? 1200 : 1500;
  const ceiling = 4500;
  return Math.max(floor, Math.min(ceiling, Math.round(kcal)));
}
function estimateCalorieTargetFromDraft(){
  const weight=parseFloat(document.getElementById('bodyWeight').value)||null;
  const height=parseFloat(document.getElementById('bodyHeight').value)||null;
  const age=parseInt(document.getElementById('bodyAge').value,10)||25;
  const sex=document.getElementById('bodySex').value||'male';
  if(!weight||!height) return {kcal:null,dailyAdjust:0};
  const bmr=calculateBMR(weight,height,age,sex);
  const tdee=calculateTDEE(bmr,1.55); // workout setup doesn't exist yet at this point in onboarding
  const targetWeight=parseFloat(document.getElementById('targetWeightInput').value)||null;
  const targetDate=document.getElementById('targetDateInput').value||null;
  const goal=P._foodGoal==='lose'?'lose':'gain';
  if(targetWeight&&targetDate){
    const today=new Date(); today.setHours(0,0,0,0);
    const target=new Date(targetDate+'T00:00:00');
    const weeksLeft=(target-today)/(1000*60*60*24*7);
    if(weeksLeft>0){
      const maxRate=weight*((GOAL_RATE_PCT[goal]||GOAL_RATE_PCT.lose).max);
      let weeklyRate=(targetWeight-weight)/weeksLeft;
      if(Math.abs(weeklyRate)>maxRate) weeklyRate = weeklyRate>0?maxRate:-maxRate;
      const dailyAdjust=dailyKcalAdjustForRate(weeklyRate);
      return {kcal:applyCalorieSafetyLimits(tdee+dailyAdjust,sex), dailyAdjust};
    }
  }
  return {kcal:Math.round(tdee), dailyAdjust:0};
}

/* ===== evidence-based goal-timeline validator =====
   Loss: 0.5-1.0% of current body weight per week is a reasonable range for
   most adults. Gain: 0.25-0.5%/week for controlled, mostly-lean gaining.
   Nothing here is hardcoded per-kg — it's computed from the user's actual
   current weight and the requested weight change. */
const GOAL_RATE_PCT={
  lose:{min:0.005, max:0.01},   // slowest .. fastest safe, fraction of bodyweight/week
  gain:{min:0.0025, max:0.005},
};
function validateGoalTimeline(currentWeight,targetWeight,goal,userWeeks){
  const rates=GOAL_RATE_PCT[goal]||GOAL_RATE_PCT.lose;
  const diffKg=Math.abs(targetWeight-currentWeight);
  if(diffKg<0.1) return {realistic:true, diffKg:0, minWeeks:0, maxWeeks:0, recommendedWeeks:0};
  const maxWeeklyRate=currentWeight*rates.max;   // fastest safe pace
  const minWeeklyRate=currentWeight*rates.min;   // slowest/comfortable pace
  const minWeeks=diffKg/maxWeeklyRate;           // shortest realistic duration
  const maxWeeks=diffKg/minWeeklyRate;           // longest "still makes sense" duration
  const recommendedWeeks=diffKg/((maxWeeklyRate+minWeeklyRate)/2);
  const realistic = userWeeks==null ? true : userWeeks>=minWeeks;
  return {realistic, diffKg, minWeeks, maxWeeks, recommendedWeeks};
}
function weeksToMonthsLabel(weeks,lang){
  const months=weeks/4.345;
  const lo=Math.max(1,Math.round(months*0.85));
  const hi=Math.max(lo+1,Math.round(months*1.15));
  return lang==='ar' ? `~${lo}-${hi} ${LANG==='ar'?'أشهر':'months'}` : `~${lo}-${hi} months`;
}
function checkGoalTargetConflict(){
  document.getElementById('targetValMsg').classList.remove('warn');
  const weight=parseFloat(document.getElementById('bodyWeight').value);
  const targetWeight=parseFloat(document.getElementById('targetWeightInput').value);
  const targetDate=document.getElementById('targetDateInput').value;
  const goal=P._foodGoal;
  const msgEl=document.getElementById('targetValMsg');
  if(!targetWeight||!targetDate){
    msgEl.textContent = LANG==='ar'
      ? '🚫 لازم تدخل وزنك المستهدف وتختار مدة عشان نحسب وجباتك صح'
      : '🚫 Enter your target weight and pick a duration so we can work out your meals correctly';
    updateDurationGridRealism(null);
    return false;
  }
  if(targetDate){
    const today=new Date(); today.setHours(0,0,0,0);
    const td=new Date(targetDate+'T00:00:00');
    if(td<=today){
      msgEl.textContent = LANG==='ar'
        ? '🚫 هذا التاريخ فات! اختر تاريخ بالمستقبل عشان نحسب المعدل الأسبوعي صح.'
        : '🚫 That date has already passed! Pick a future date so we can calculate the weekly rate correctly.';
      updateDurationGridRealism(null);
      return false;
    }
  }
  if(!weight||!targetWeight||!goal){ msgEl.textContent=''; updateDurationGridRealism(null); return true; }
  if(targetWeight<30||targetWeight>300){
    msgEl.textContent = LANG==='ar'
      ? '🚫 الوزن المستهدف لازم يكون بين ٣٠ و٣٠٠ كيلو'
      : '🚫 Target weight must be between 30 and 300 kg';
    updateDurationGridRealism(null);
    return false;
  }
  if(Math.abs(targetWeight-weight)<0.1){
    msgEl.textContent = LANG==='ar'
      ? '🚫 وزنك المستهدف مطابق لوزنك الحالي — اختر رقم مختلف أو غيّر الهدف لـ"الحفاظ على الوزن".'
      : '🚫 Your target is the same as your current weight — pick a different number, or switch the goal to "maintenance".';
    updateDurationGridRealism(null);
    return false;
  }
  if(goal==='lose' && targetWeight>weight){
    msgEl.textContent = LANG==='ar'
      ? `🚫 تناقض: اخترت "إنقاص وزن" بس وزنك المستهدف (${targetWeight}) أكبر من وزنك الحالي (${weight}) — هذا يعتبر زيادة وزن! غيّر الهدف أو رقم الوزن المستهدف.`
      : `🚫 Conflict: you picked "lose weight" but your target (${targetWeight}) is above your current weight (${weight}) — that's actually a gain! Change the goal or the target number.`;
    updateDurationGridRealism(null);
    return false;
  }
  if(goal==='gain' && targetWeight<weight){
    msgEl.textContent = LANG==='ar'
      ? `🚫 تناقض: اخترت "زيادة وزن" بس وزنك المستهدف (${targetWeight}) أقل من وزنك الحالي (${weight}) — هذا يعتبر إنقاص وزن! غيّر الهدف أو رقم الوزن المستهدف.`
      : `🚫 Conflict: you picked "gain weight" but your target (${targetWeight}) is below your current weight (${weight}) — that's actually a loss! Change the goal or the target number.`;
    updateDurationGridRealism(null);
    return false;
  }
  // direction is consistent — now check whether the chosen deadline is
  // realistically achievable given evidence-based safe weekly rates
  const today=new Date(); today.setHours(0,0,0,0);
  const td=new Date(targetDate+'T00:00:00');
  const userWeeks=(td-today)/(1000*60*60*24*7);
  const check=validateGoalTimeline(weight,targetWeight,goal,userWeeks);
  updateDurationGridRealism(check);
  if(!check.realistic){
    const diffLabel=check.diffKg.toFixed(1);
    msgEl.classList.add('warn');
    msgEl.innerHTML = LANG==='ar'
      ? `⚠️ <b>هدف عدواني جداً</b><br>${goal==='gain'?'زيادة':'إنقاص'} ${diffLabel} كجم بالمدة المختارة مو واقعي وممكن يكون خطر على صحتك.<br>المدة الموصى بها: <b>${weeksToMonthsLabel(check.recommendedWeeks,'ar')}</b>`
      : `⚠️ <b>Goal too aggressive</b><br>${goal==='gain'?'Gaining':'Losing'} ${diffLabel} kg in the selected timeframe is not a realistic, safe target.<br>Recommended: <b>${weeksToMonthsLabel(check.recommendedWeeks,'en')}</b>`;
    return false;
  }
  msgEl.classList.remove('warn');
  msgEl.textContent='';
  return true;
}
function updateDurationGridRealism(check){
  const grid=document.getElementById('targetDurationGrid');
  if(!grid) return;
  const weight=parseFloat(document.getElementById('bodyWeight').value);
  const targetWeight=parseFloat(document.getElementById('targetWeightInput').value);
  const goal=P._foodGoal;
  grid.querySelectorAll('.ob-choice').forEach(el=>{
    el.classList.remove('unrealistic');
    el.title='';
    if(!check||!weight||!targetWeight||!goal) return;
    const months=+el.dataset.months;
    const weeks=months*4.345;
    const v=validateGoalTimeline(weight,targetWeight,goal,weeks);
    if(!v.realistic){
      el.classList.add('unrealistic');
      el.title=LANG==='ar'?'مدة غير واقعية لهذا الهدف':'Unrealistic timeframe for this goal';
    }
  });
  const recEl=document.getElementById('goalRecommendBtn');
  if(!recEl) return;
  if(check && !check.realistic){
    recEl.classList.remove('hidden');
    recEl.textContent=LANG==='ar'?`✅ اختر المدة الموصى بها (${weeksToMonthsLabel(check.recommendedWeeks,'ar')})`:`✅ Choose recommended timeframe (${weeksToMonthsLabel(check.recommendedWeeks,'en')})`;
    recEl.onclick=()=>{
      const bestMonths=TARGET_DURATION_MONTHS.find(m=>{
        const v=validateGoalTimeline(weight,targetWeight,goal,m*4.345);
        return v.realistic;
      }) || TARGET_DURATION_MONTHS[TARGET_DURATION_MONTHS.length-1];
      document.getElementById('targetDateInput').value=monthsToTargetDate(bestMonths);
      buildTargetDurationGrid();
      document.querySelectorAll('#targetDurationGrid .ob-choice').forEach(c=>c.classList.toggle('selected',+c.dataset.months===bestMonths));
      checkGoalTargetConflict();
    };
  } else {
    recEl.classList.add('hidden');
  }
}

function setupTagInput(fieldId,addBtnId,chipsId,getArr,setArr,onChange){

}
/* free text only (no presets) + a user-changeable emoji per item, stored as
   {text,emoji} instead of a plain string */
const EMOJI_PICKER_OPTIONS=['💊','🧪','🥤','💧','⚡','💪','🏋️','🥛','🧃','🍓','🍌','🌿','🌱','🧂','🫐','🥜','🍯','☕','🔥','🧬','🔋','✨','⭐'];
function closeEmojiPicker(){ document.querySelectorAll('.emoji-picker-pop').forEach(p=>p.remove()); document.removeEventListener('click',closeEmojiPickerOutside,true); }
function closeEmojiPickerOutside(e){ if(!e.target.closest('.emoji-picker-pop') && !e.target.closest('.emoji-pick')) closeEmojiPicker(); }
function openEmojiPicker(anchorEl,onPick){
  closeEmojiPicker();
  const pop=document.createElement('div'); pop.className='emoji-picker-pop';
  EMOJI_PICKER_OPTIONS.forEach(em=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=em;
    b.addEventListener('click',()=>{ onPick(em); closeEmojiPicker(); });
    pop.appendChild(b);
  });
  document.body.appendChild(pop);
  const r=anchorEl.getBoundingClientRect();
  pop.style.top=Math.min(r.bottom+4, window.innerHeight-160)+'px';
  pop.style.left=Math.min(r.left, window.innerWidth-230)+'px';
  setTimeout(()=>document.addEventListener('click',closeEmojiPickerOutside,true),0);
}
function setupEmojiTagInput(fieldId,addBtnId,chipsId,getArr,setArr,defaultEmoji,onChange,emojiFor){
  const field=document.getElementById(fieldId);
  const btn=document.getElementById(addBtnId);
  const chipsEl=document.getElementById(chipsId);
  function render(){
    const arr=getArr();
    chipsEl.innerHTML='';
    arr.forEach((item,i)=>{
      const chip=document.createElement('div'); chip.className='tag-chip';
      chip.innerHTML=`<button type="button" class="emoji-pick" title="${LANG==='ar'?'اضغط لتغيير الرمز':'Tap to change icon'}">${item.emoji||defaultEmoji}</button><span>${item.text}</span><button type="button">✕</button>`;
      chip.querySelector('.emoji-pick').addEventListener('click',(e)=>{
        e.stopPropagation();
        openEmojiPicker(e.currentTarget,(picked)=>{
          const a=getArr().slice(); a[i]={...a[i],emoji:picked}; setArr(a); render(); if(onChange) onChange();
        });
      });
      chip.querySelector('button:last-child').addEventListener('click',()=>{ const a=getArr().slice(); a.splice(i,1); setArr(a); render(); if(onChange) onChange(); });
      chipsEl.appendChild(chip);
    });
  }
  // each item gets its OWN emoji, chosen up front by emojiFor() (e.g. the
  // matched supplement's canonical icon) when available, but this is only
  // ever the STARTING value — the user can tap the icon and change it to
  // anything, per item, at any time, and that choice is what's saved.
  function add(){ const v=field.value.trim(); if(!v) return; const a=getArr().slice(); const startEmoji=(emojiFor&&emojiFor(v))||defaultEmoji; a.push({text:v,emoji:startEmoji}); setArr(a); field.value=''; render(); field.focus(); if(onChange) onChange(); }
  btn.addEventListener('click',add);
  field.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); } });
  return render;
}

/* The split's day-type sequence is a PERPETUAL rotation that only advances on
   training days — rest days are skipped without resetting or repeating the
   cycle. A fixed epoch (arbitrary, never changes) means the sequence stays
   consistent forever: whatever the last training day's type was, the next
   training day (however many rest days away) always continues straight to
   the next one in the cycle. 'custom' bypasses rotation entirely — each
   weekday has its own directly-assigned type, exactly as the user laid it
   out, so rest days can sit anywhere in the week without shifting anything. */
const WORKOUT_ROTATION_EPOCH=new Date(2024,0,1);
function workoutTypeForDate(dateObj,ws){
  const weekdayIdx=(dateObj.getDay()+1)%7;
  if(ws.splitId==='custom') return (ws.customSchedule&&ws.customSchedule[weekdayIdx])||'rest';
  const restDays=ws.restDays||[];
  if(restDays.includes(weekdayIdx)) return 'rest';
  const epochStart=new Date(WORKOUT_ROTATION_EPOCH.getFullYear(),WORKOUT_ROTATION_EPOCH.getMonth(),WORKOUT_ROTATION_EPOCH.getDate());
  const d=new Date(dateObj.getFullYear(),dateObj.getMonth(),dateObj.getDate());
  const totalDays=Math.round((d-epochStart)/86400000);
  const epochWeekday=(epochStart.getDay()+1)%7;
  const fullWeeks=Math.floor(totalDays/7);
  const remainder=((totalDays%7)+7)%7;
  const trainingPerWeek=7-restDays.length;
  let trainingInRemainder=0;
  for(let r=0;r<=remainder;r++){
    const wd=(epochWeekday+r)%7;
    if(!restDays.includes(wd)) trainingInRemainder++;
  }
  const trainingCount=fullWeeks*trainingPerWeek+trainingInRemainder;
  const cycle=(TRAINING_SPLITS[ws.splitId]||TRAINING_SPLITS.ppl).days;
  const n=cycle.length;
  return cycle[((trainingCount-1)%n+n)%n];
}
function datesForCurrentWeek(){
  const today=new Date();
  const todayIdx=(today.getDay()+1)%7;
  const satOfWeek=new Date(today.getFullYear(),today.getMonth(),today.getDate()-todayIdx);
  return Array.from({length:7},(_,i)=>new Date(satOfWeek.getFullYear(),satOfWeek.getMonth(),satOfWeek.getDate()+i));
}
function generateWeekPattern(ws){
  return datesForCurrentWeek().map(d=>workoutTypeForDate(d,ws));
}

   directly by weekday. */
function restDaysFromCustomSchedule(schedule){
  const rd=[]; for(let i=0;i<7;i++){ if(!schedule[i]||schedule[i]==='rest') rd.push(i); } return rd;
}

/* activity factor now reflects actual training days/week (7 - restDays) instead
   of a flat 1.55 guess — standard Mifflin-St Jeor multiplier bands */
function activityFactor(){
  const ws=P.workoutSetup;
  if(!ws || !ws.restDays) return 1.55; // no workout setup yet: moderate default
  const trainingDays = 7 - ws.restDays.length;
  if(trainingDays<=4) return 1.46;   // 3-4 days/week: light-moderate
  if(trainingDays===5) return 1.55;  // 5 days/week: moderate
  if(trainingDays===6) return 1.725; // 6 days/week: very active
  return 1.9;                        // 7 days/week: extra active
}
function computeTDEE(){
  const fs=P.foodSetup||{};
  if(!fs.weight||!fs.height) return null;
  const bmr=calculateBMR(fs.weight,fs.height,fs.age||25,fs.sex);
  return calculateTDEE(bmr,activityFactor());
}
function weeklyRatePlan(){
  const fs=P.foodSetup||{};
  if(!fs.weight||!fs.targetWeight||!fs.targetDate) return null;
  const today=new Date(); today.setHours(0,0,0,0);
  const target=new Date(fs.targetDate+'T00:00:00');
  const weeksLeft=(target-today)/(1000*60*60*24*7);
  if(weeksLeft<=0) return null;
  const goal=fs.goal==='lose'?'lose':'gain';
  const maxRate=fs.weight*((GOAL_RATE_PCT[goal]||GOAL_RATE_PCT.lose).max);
  const totalChange=fs.targetWeight-fs.weight;
  let weeklyRate=totalChange/weeksLeft;
  const capped=Math.abs(weeklyRate)>maxRate;
  if(capped) weeklyRate = weeklyRate>0 ? maxRate : -maxRate;
  return {weeklyRateKg:weeklyRate,capped};
}
function calorieTarget(){
  const tdee=computeTDEE();
  if(!tdee) return null;
  const fs=P.foodSetup||{};
  const plan=weeklyRatePlan();
  if(plan){
    return applyCalorieSafetyLimits(tdee+dailyKcalAdjustForRate(plan.weeklyRateKg), fs.sex);
  }
  return applyCalorieSafetyLimits(fs.goal==='lose' ? tdee-450 : tdee+450, fs.sex);
}

  ]);

function renderChart(svgId,h){
  svgId=svgId||'weightChart'; h=h||140;
  const svg=document.getElementById(svgId); if(!svg) return; svg.innerHTML='';
  const w=320,pad=20;
  if(weightLog.length<2){ svg.innerHTML=`<text x="${w/2}" y="${h/2}" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.5">${t('chart_need2')}</text>`; return; }
  const vals=weightLog.map(e=>e.kg);
  const sv=startWeightVal(), gv=goalWeightVal();
  const refVals=[...vals]; if(sv!=null) refVals.push(sv); if(gv!=null) refVals.push(gv);
  const minV=Math.min(...refVals)-0.5, maxV=Math.max(...refVals)+0.5, range=maxV-minV||1;
  const stepX=(w-pad*2)/(weightLog.length-1);
  const yF=v=>h-pad-((v-minV)/range)*(h-pad*2), xF=i=>pad+i*stepX;
  let s='';
  if(gv!=null){ const gY=yF(gv); s+=`<line x1="${pad}" y1="${gY}" x2="${w-pad}" y2="${gY}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="4,4"/>`; }
  s+=`<polyline points="${weightLog.map((e,i)=>`${xF(i)},${yF(e.kg)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  weightLog.forEach((e,i)=>{ s+=`<circle cx="${xF(i)}" cy="${yF(e.kg)}" r="3.5" fill="var(--accent-deep)"/>`; });

}

function dateKeyOf(d){ return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
/* ================= CENTRALIZED STREAK ENGINE =================
   One implementation for every named streak (workout/water/nutrition —
   per-habit streaks stay on computeHabitStreaks() since those are derived
   fresh from real history rather than incrementally maintained, which is
   the more correct approach when day-by-day docs are cheap to re-scan).
   Same-day re-entry is a no-op (prevents double-incrementing a streak from
   multiple clicks/refreshes the same day); a gap resets to 1 rather than 0
   since the day it fires IS itself a completed day. */
function migrateProgressionFields(){
  if(!P.streaks){
    P.streaks={
      workout:{current:P.streakCount||0, longest:P.streakCount||0, lastDate:P.lastStreakDate||''},
      water:{current:0,longest:0,lastDate:''},
      nutrition:{current:0,longest:0,lastDate:''}
    };
  }
  if(P.xp===undefined) P.xp=0;
  if(!P.lifetimeStats) P.lifetimeStats={waterDaysHit:0,nutritionDaysHit:0,challengesCompleted:0,longestHabitStreakEver:0};
  if(!P.achievements) P.achievements={};
  if(!P.challengeState) P.challengeState={};
  if(P.coins===undefined) P.coins=0;
  if(!P.inventory) P.inventory={};
  if(!P.equipped) P.equipped={background:null,frame:null,effect:null,title:null};
  if(!P.levelRewardsClaimed) P.levelRewardsClaimed={};
}
/* one-time top-up for accounts that already unlocked achievements/
   challenges under the old, badly-balanced point values (a 100-workout
   achievement paying 15 XP while a 5-workout challenge paid 100) —
   never subtracts, only tops existing totals up to the new numbers, and
   is guarded by its own flag so it can only ever run once per account. */
async function migrateRewardValuesV2(){
  migrateProgressionFields();
  if(P._rewardMigrationV2Done) return;
  const OLD_ACH_XP={first_workout:15,week_warrior:15,century:50,hydration_master:15,fisherman:15,rare_hunter:20,collector:25,unbreakable:30,champion:50,nutrition_machine:20,habit_builder:15,challenger:15};
  let bonusXp=0, bonusCoins=0;
  Object.keys(P.achievements||{}).forEach(id=>{
    const a=ACHIEVEMENTS_CONFIG.find(x=>x.id===id); if(!a) return;
    bonusXp += (a.xp - (OLD_ACH_XP[id]||0));
    bonusCoins += (a.coins||0);
  });
  Object.keys(P.challengeState||{}).forEach(key=>{
    if(!P.challengeState[key] || !P.challengeState[key].completed) return;
    const id=key.split('|')[0];
    const c=CHALLENGES_CONFIG.find(x=>x.id===id); if(!c) return;
    bonusXp += (c.xp - 100);
    bonusCoins += (c.coins||0);
  });
  if(bonusXp>0) P.xp=(P.xp||0)+bonusXp;
  if(bonusCoins>0) P.coins=(P.coins||0)+bonusCoins;
  P._rewardMigrationV2Done=true;
  await storageSet('profile',JSON.stringify(P));
}
function dateFromKey(k){ if(!k) return null; const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
/* generic core behind updateNamedStreak() below — takes an explicit date so
   the "catch up yesterday" flows can safely backfill a streak without
   risking today's real completion (never moves lastDate backward if a
   more recent day is already recorded, and a same-day re-entry is still
   a no-op either way). */
function updateNamedStreakForDate(key,targetDate){
  migrateProgressionFields();
  const s=P.streaks[key]=P.streaks[key]||{current:0,longest:0,lastDate:''};
  const targetKey=dateKeyOf(targetDate);
  if(s.lastDate===targetKey) return s; // already counted this day — no double-increment
  const lastDateObj=dateFromKey(s.lastDate);
  if(lastDateObj && lastDateObj>targetDate) return s; // never rewind past a more recent completion
  const dayBefore=new Date(targetDate); dayBefore.setDate(dayBefore.getDate()-1);
  const dayBeforeKey=dateKeyOf(dayBefore);
  s.current = (s.lastDate===dayBeforeKey) ? s.current+1 : 1;
  s.longest = Math.max(s.longest, s.current);
  s.lastDate = targetKey;
  return s;
}
function updateNamedStreak(key){ return updateNamedStreakForDate(key,new Date()); }
async function updateStreak(){
  const s=updateNamedStreak('workout');
  P.streakCount=s.current; P.lastStreakDate=s.lastDate; // kept in sync for renderStreakBadge/back-compat readers
  await storageSet('profile',JSON.stringify(P));

/* ================= XP / LEVEL ENGINE =================
   One centralized config and one centralized award function — nowhere else
   in the app is allowed to touch P.xp directly. Every award site is guarded
   by a check against real, already-persisted state (a daily flag on
   dailyTrack, or an achievement/challenge id already present in P) so the
   SAME event can never fire twice — there is no click-driven "+XP" anywhere;
   XP only ever follows a real, already-recorded completion. */
const XP_CONFIG={
  habit_complete:5, water_target_complete:10, nutrition_day_complete:15, workout_complete:25,
  collection_unlock_common:10, collection_unlock_uncommon:30, collection_unlock_epic:90, collection_unlock_mythic:250, collection_unlock_legendary:1200,
  achievement_unlock:15 // fallback only — every real achievement below specifies its own xp
};
/* coins are a SEPARATE economy from XP (cosmetic currency, not
   progression currency) — daily actions (habit/water/nutrition/workout)
   deliberately earn zero coins since they repeat forever; coins only
   come from challenges, achievements, collection catches and level
   milestones, all one-time or period-gated, so the Store's prices stay
   meaningful instead of being flooded by routine daily behavior. */
const COIN_CONFIG={
  collection_unlock_common:10, collection_unlock_uncommon:40, collection_unlock_epic:120, collection_unlock_mythic:350, collection_unlock_legendary:1800
};
async function awardXP(amount){
  migrateProgressionFields();
  P.xp=(P.xp||0)+amount;
  await storageSet('profile',JSON.stringify(P));
}
async function awardCoins(amount){
  migrateProgressionFields();
  P.coins=(P.coins||0)+amount;
  await storageSet('profile',JSON.stringify(P));
}
/* cumulative XP required to REACH `level` — a gentler power curve
   (exponent 1.5) than a pure quadratic: a quadratic can't hit both
   "level 5 in about a month" and "level 50 as a multi-year prestige
   goal" at the same time for any coefficient, since the ratio between
   its low and high ends is fixed by the shape. This curve was solved
   against ~648 XP/week (a genuinely active user's real rate under the
   XP_CONFIG/ACHIEVEMENTS_CONFIG/CHALLENGES_CONFIG values above) to land
   L5≈1mo, L10≈3mo, L20≈9mo, L30≈1.4yr, L40≈2.1yr, L50≈2.9yr. */
function xpForLevel(level){ return level<=1 ? 0 : Math.round(280*(Math.pow(level,1.5)-1)); }
function levelFromXP(xp){ let l=1; while(xpForLevel(l+1)<=xp) l++; return l; }
function levelProgress(xp){
  const level=levelFromXP(xp);
  const floor=xpForLevel(level), ceiling=xpForLevel(level+1);
  return {level, floor, ceiling, current:xp-floor, needed:ceiling-floor, pct: ceiling>floor ? Math.round((xp-floor)/(ceiling-floor)*100) : 100};
}

/* ================= REAL USER STATS (single source of truth) =================
   Every number achievements/titles/challenges/profile use comes from here —
   nothing recomputes these independently. Collection numbers come from
   computeCollectionStats() (already the collections panel's own source of
   truth); everything else reads P fields that are only ever changed through
   the guarded award functions below. */
async function computeUserStats(){
  const coll=await computeCollectionStats();
  const totalWorkouts=Object.values(P.workoutCompletions||{}).reduce((a,b)=>a+b,0);
  const streaks=P.streaks||{};
  const bestStreak=Math.max(0,...Object.values(streaks).map(s=>s.longest||0));
  const lifetime=P.lifetimeStats||{};
  const rareOrBetterCount=(coll.rarityCounts.epic||0)+(coll.rarityCounts.mythic||0)+(coll.rarityCounts.legendary||0);
  const xp=P.xp||0;
  return {
    xp, level:levelFromXP(xp),
    totalWorkouts,
    workoutStreak:(streaks.workout&&streaks.workout.current)||0,
    waterStreak:(streaks.water&&streaks.water.current)||0,
    nutritionStreak:(streaks.nutrition&&streaks.nutrition.current)||0,

/* ================= ACHIEVEMENTS =================
   Purely derived: `check(stats)` is a pure function over computeUserStats()'s
   output. Nothing is ever manually marked "unlocked" — checkAndAwardAchievements()
   is the only writer of P.achievements, and only writes an id the FIRST time
   its check() goes true, which is what makes duplicate-award impossible. */
/* xp/coins are difficulty-tiered, not arbitrary: trivial(first-time/
   onboarding) → easy → moderate → hard → very hard → major → exceptional.
   A 100-workout achievement (century) must pay dramatically more than a
   5-workout challenge, which is exactly what these numbers do. */
const ACHIEVEMENTS_CONFIG=[
  {id:'first_workout', icon:'🏋️', nameEn:'First Workout', nameAr:'أول تمرين', descEn:'Complete your first workout', descAr:'أكمل أول تمرين', xp:10, coins:10, check:s=>s.totalWorkouts>=1},

  {id:'century', icon:'💯', nameEn:'Century', nameAr:'المئوية', descEn:'Complete 100 workouts', descAr:'أكمل 100 تمرين', xp:1200, coins:1800, check:s=>s.totalWorkouts>=100},
  {id:'hydration_master', icon:'💧', nameEn:'Hydration Master', nameAr:'سيد الترطيب', descEn:'Hit your water target 30 times', descAr:'حقق هدف الماء 30 مرة', xp:250, coins:300, check:s=>s.waterDaysHit>=30},
  {id:'fisherman', icon:'🐟', nameEn:'Fisherman', nameAr:'صياد', descEn:'Catch 10 fish/animals total', descAr:'اصطد 10 حيوانات', xp:50, coins:60, check:s=>s.totalCatches>=10},
  {id:'rare_hunter', icon:'💎', nameEn:'Rare Hunter', nameAr:'صائد النوادر', descEn:'Collect 5 epic-or-better species', descAr:'اجمع 5 أنواع ملحمية أو أعلى', xp:280, coins:350, check:s=>s.rareOrBetterCount>=5},
  {id:'collector', icon:'📦', nameEn:'Collector', nameAr:'الجامع', descEn:'Collect 50 species total', descAr:'اجمع 50 نوع', xp:600, coins:750, check:s=>s.totalCollected>=50},
  {id:'unbreakable', icon:'🔥', nameEn:'Unbreakable', nameAr:'لا يُكسر', descEn:'Reach a 30-day streak', descAr:'وصل لسلسلة 30 يوم', xp:500, coins:650, check:s=>s.bestStreak>=30},
  {id:'champion', icon:'👑', nameEn:'Champion', nameAr:'البطل', descEn:'Reach Level 20', descAr:'وصل للمستوى 20', xp:2500, coins:4000, exclusiveCosmetic:'champions-ascension', check:s=>s.level>=20},
  {id:'nutrition_machine', icon:'🍽️', nameEn:'Nutrition Machine', nameAr:'آلة التغذية', descEn:'Complete your nutrition target 20 times', descAr:'حقق هدف التغذية 20 مرة', xp:120, coins:140, check:s=>s.nutritionDaysHit>=20},
  {id:'habit_builder', icon:'✅', nameEn:'Habit Builder', nameAr:'باني العادات', descEn:'Reach a 14-day habit streak', descAr:'وصل لسلسلة عادة 14 يوم', xp:130, coins:150, check:s=>s.bestHabitStreak>=14},
  {id:'challenger', icon:'🎯', nameEn:'Challenger', nameAr:'المتحدي', descEn:'Complete your first challenge', descAr:'أكمل أول تحدي', xp:15, coins:15, check:s=>s.challengesCompleted>=1},
];
/* the ONLY place P.achievements is written. Returns the list of newly
   unlocked achievements (empty if none) so the caller can show a toast. */
async function checkAndAwardAchievements(stats){
  migrateProgressionFields();
  const newlyUnlocked=[];
  for(const a of ACHIEVEMENTS_CONFIG){
    if(P.achievements[a.id]) continue; // already unlocked — never re-award
    if(a.check(stats)){
      P.achievements[a.id]={unlockedAt:new Date().toISOString()};
      newlyUnlocked.push(a);
    }
  }
  if(newlyUnlocked.length){
    const totalXp=newlyUnlocked.reduce((sum,a)=>sum+(a.xp||XP_CONFIG.achievement_unlock),0);
    const totalCoins=newlyUnlocked.reduce((sum,a)=>sum+(a.coins||0),0);
    P.xp=(P.xp||0)+totalXp;
    P.coins=(P.coins||0)+totalCoins;
    newlyUnlocked.forEach(a=>{
      if(a.exclusiveCosmetic){ P.inventory=P.inventory||{}; if(!P.inventory[a.exclusiveCosmetic]) P.inventory[a.exclusiveCosmetic]={acquiredAt:new Date().toISOString(),source:'achievement'}; }
    });
    await storageSet('profile',JSON.stringify(P));
  }
  return newlyUnlocked;
}

/* ================= SOLO CHALLENGES =================
   Real, computed from real logged history — a challenge is only "complete"
   when its progress (derived from actual daily-track docs) reaches target,
   and each period (identified by an explicit period key) can only ever be
   awarded once, guarded by P.challengeState. */
/* challenges are REPEATABLE (every week/month), so per-instance reward
   stays well below a comparable one-time achievement — otherwise a
   recurring challenge would out-earn a genuine milestone every single
   period, which is exactly the farming problem difficulty tiers exist
   to prevent. */
const CHALLENGES_CONFIG=[
  {id:'weekly_workouts', period:'week', icon:'🏋️', nameEn:'5 Workouts This Week', nameAr:'5 تمارين هذا الأسبوع', target:5, xp:130, coins:150, metric:'workoutsThisWeek'},
  {id:'weekly_hydration', period:'week', icon:'💧', nameEn:'Hydration Week', nameAr:'أسبوع الترطيب', target:5, xp:40, coins:40, metric:'waterDaysThisWeek'},
  {id:'weekly_nutrition', period:'week', icon:'🍽️', nameEn:'Nutrition Streak', nameAr:'التزام التغذية', target:5, xp:50, coins:50, metric:'nutritionDaysThisWeek'},
  {id:'monthly_fishing', period:'month', icon:'🐟', nameEn:'Fishing Collector', nameAr:'جامع الأسماك', target:5, xp:100, coins:120, metric:'distinctCatchesThisMonth'},
];
function currentPeriodKey(period){
  const now=new Date();
  if(period==='month') return `${now.getFullYear()}-${now.getMonth()+1}`;
  return `${now.getFullYear()}-w${getISOWeekNum(now)}`;
}
async function computeMonthlyDistinctCatches(){
  const now=new Date(); const y=now.getFullYear(), m=now.getMonth();
  let count=0;
  for(const cat of ANIMAL_CATEGORIES){
    let data={};
    try{ const raw=await storageGet('collections:animals:'+cat.id); if(raw) data=JSON.parse(raw); }catch(e){}
    Object.values(data).forEach(rec=>{
      if(rec&&rec.catches&&rec.catches.some(c=>{ const d=new Date(c.date); return d.getFullYear()===y&&d.getMonth()===m; })) count++;
    });
  }
  return count;
}
async function computeChallengeProgress(){
  const weekDates=datesForCurrentWeek();
  const keys=weekDates.map(d=>`daily-track:${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`);
  const docs=await Promise.all(keys.map(k=>storageGet(k).catch(()=>null)));
  let workoutsThisWeek=0, waterDaysThisWeek=0, nutritionDaysThisWeek=0;
  docs.forEach(v=>{
    if(!v) return;
    let doc; try{ doc=JSON.parse(v); }catch(e){ return; }
    if(doc.workoutDone) workoutsThisWeek++;
    if(doc.xpAwarded&&doc.xpAwarded.water) waterDaysThisWeek++;
    if(doc.xpAwarded&&doc.xpAwarded.nutrition) nutritionDaysThisWeek++;
  });
  const distinctCatchesThisMonth=await computeMonthlyDistinctCatches();
  return {workoutsThisWeek,waterDaysThisWeek,nutritionDaysThisWeek,distinctCatchesThisMonth};
}
/* the ONLY place P.challengeState is written / XP for challenges is
   awarded. Returns the list of newly-completed challenges this call. */
async function checkAndAwardChallenges(){
  migrateProgressionFields();
  const progress=await computeChallengeProgress();
  const newlyCompleted=[];
  for(const c of CHALLENGES_CONFIG){
    const key=c.id+'|'+currentPeriodKey(c.period);
    if(P.challengeState[key]&&P.challengeState[key].completed) continue;
    const value=progress[c.metric]||0;
    if(value>=c.target){
      P.challengeState[key]={completed:true,completedAt:new Date().toISOString(),value};
      P.lifetimeStats.challengesCompleted=(P.lifetimeStats.challengesCompleted||0)+1;
      P.xp=(P.xp||0)+c.xp;
      P.coins=(P.coins||0)+(c.coins||0);
      newlyCompleted.push(c);
    }
  }
  if(newlyCompleted.length) await storageSet('profile',JSON.stringify(P));
  return {progress,newlyCompleted};
}

/* ================= LEVEL MILESTONE REWARDS =================
   Every 5 levels, escalating in value — coins alone at the "off" fives
   (5/15/25/35/45), coins + a free store cosmetic at the "on" tens
   (10/20/30/40), and the biggest one-time payout + a Legendary cosmetic
   + the already-existing "the_champion" title at 50. Guarded by
   P.levelRewardsClaimed so each milestone can only ever fire once. */
const LEVEL_REWARDS = {
  5:{coins:50}, 10:{coins:150, cosmetic:'chalkline'}, 15:{coins:250}, 20:{coins:400, cosmetic:'iron-grid'},
  25:{coins:600}, 30:{coins:900, cosmetic:'deep-current'}, 35:{coins:1100}, 40:{coins:1500, cosmetic:'aurora-current'},
  45:{coins:1900}, 50:{coins:3000, cosmetic:'eclipse-core'}
};
async function checkAndAwardLevelRewards(stats){
  migrateProgressionFields();
  const claimed=P.levelRewardsClaimed;
  let changed=false;
  const justClaimed=[];
  Object.keys(LEVEL_REWARDS).map(Number).forEach(lvl=>{
    if(stats.level>=lvl && !claimed[lvl]){
      const r=LEVEL_REWARDS[lvl];
      claimed[lvl]=true; changed=true;
      if(r.coins) P.coins=(P.coins||0)+r.coins;
      if(r.cosmetic){ P.inventory=P.inventory||{}; if(!P.inventory[r.cosmetic]) P.inventory[r.cosmetic]={acquiredAt:new Date().toISOString(),source:'level'}; }
      justClaimed.push({lvl,...r});
    }
  });
  if(changed){
    await storageSet('profile',JSON.stringify(P));
    justClaimed.forEach(r=>{
      const parts=[]; if(r.coins) parts.push(`+${r.coins} 🪙`); if(r.cosmetic) parts.push(LANG==='ar'?'+ زينة مجانية':'+ free cosmetic');
      showToast((LANG==='ar'?`🎉 المستوى ${r.lvl}: `:`🎉 Level ${r.lvl}: `)+parts.join(' '),'success');
    });
  }
  return claimed;
}

/* renders the equipped background/effect/frame/title on the Profile hero
   card — reads ONLY from P.equipped/P.inventory, never mutates them, so
   it's always safe to call from any re-render. */
function renderProfileCosmeticHero(){
  const bgEl=document.getElementById('profileHeroBg');
  const fxEl=document.getElementById('profileHeroEffect');
  const frameEl=document.getElementById('profileFrameRing');
  const avatarEl=document.getElementById('profileAvatar');
  const titleChip=document.getElementById('profileTitleChip');

  const bgId=P.equipped&&P.equipped.background;
  const bgItem=bgId&&COSMETICS_CATALOG.find(c=>c.id===bgId);
  bgEl.innerHTML=''; bgEl.className='cos-hero-bg'+(bgItem?' '+bgItem.cls:'');
  if(bgItem&&bgItem.mountEffect) bgItem.mountEffect(bgEl);

  const fxId=P.equipped&&P.equipped.effect;
  const fxItem=fxId&&COSMETICS_CATALOG.find(c=>c.id===fxId);
  fxEl.innerHTML='';
  if(fxItem&&fxItem.mountEffect) fxItem.mountEffect(fxEl);

  const frameId=P.equipped&&P.equipped.frame;
  const frameItem=frameId&&COSMETICS_CATALOG.find(c=>c.id===frameId);
  frameEl.innerHTML=''; frameEl.className='cos-frame-ring'+(frameItem?' '+frameItem.cls:'');
  const oldOrbitWrap=frameEl.parentElement.querySelector('.cx-orbit-wrap'); if(oldOrbitWrap) oldOrbitWrap.remove();
  if(frameItem&&frameItem.orbiters){
    // mounted as a SIBLING of frameEl, not a child — frameEl carries a CSS
    // mask (to cut the ring band) which clips any child down to that same
    // thin band, so orbit dots placed inside it were invisible except when
    // crossing the ring line. Store preview already does it this way.
    const wrap=document.createElement('div'); wrap.className='cx-orbit-wrap';
    [0,90,180,270].forEach(deg=>{
      const dot=document.createElement('div'); dot.className='cx-orbit-dot';
      const rad=42; const rx=Math.cos(deg*Math.PI/180)*rad, ry=Math.sin(deg*Math.PI/180)*rad;
      dot.style.left='calc(50% + '+rx+'px)'; dot.style.top='calc(50% + '+ry+'px)';
      wrap.appendChild(dot);
    });
    frameEl.parentElement.appendChild(wrap);
  }

  if(P.avatarPhoto){ avatarEl.style.backgroundImage=`url(${P.avatarPhoto})`; avatarEl.textContent=''; }
  else { avatarEl.style.backgroundImage=''; avatarEl.textContent='👤'; }

  const titleId=P.equipped&&P.equipped.title;
  const titleCfg=titleId&&TITLES_CONFIG.find(x=>x.id===titleId);
  titleChip.textContent = titleCfg ? (titleCfg.icon+' '+(LANG==='ar'?titleCfg.nameAr:titleCfg.nameEn)) : t('profile_no_title');
}

document.getElementById('profileAvatarFileInput').addEventListener('change',async(e)=>{
  const file=e.target.files&&e.target.files[0]; if(!file) return;
  try{
    const dataUrl=await new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); });
    const img=await new Promise((resolve,reject)=>{ const im=new Image(); im.onload=()=>resolve(im); im.onerror=reject; im.src=dataUrl; });
    const size=160, canvas=document.createElement('canvas'); canvas.width=size; canvas.height=size;
    const ctx=canvas.getContext('2d');
    const side=Math.min(img.width,img.height);
    const sx=(img.width-side)/2, sy=(img.height-side)/2;
    ctx.drawImage(img,sx,sy,side,side,0,0,size,size);
    P.avatarPhoto=canvas.toDataURL('image/jpeg',0.7);
    await storageSet('profile',JSON.stringify(P));
    renderProfileCosmeticHero();
  }catch(err){ showToast(LANG==='ar'?'تعذر تحميل الصورة':'Could not load photo','error'); }
  finally{ e.target.value=''; }
});

function openUsernameEditModal(){
  const current=(P.publicProfile&&P.publicProfile.username)||'';

  document.getElementById('cardBody').innerHTML=`

  const inp=document.getElementById('editUsernameInput');
  const msgEl=document.getElementById('editUsernameMsg');
  const saveBtn=document.getElementById('editUsernameSaveBtn');
  let checkToken=0, debounceT=null;
  const runCheck=async()=>{
    const val=inp.value.trim().toLowerCase();
    if(!val){ msgEl.textContent=''; msgEl.className='username-check-msg'; saveBtn.disabled=true; return; }
    if(val===current){ msgEl.textContent=''; msgEl.className='username-check-msg'; saveBtn.disabled=true; return; } // unchanged — nothing to save
    if(!PublicProfileService.usernameRegex.test(val)){ msgEl.textContent=t('username_invalid'); msgEl.className='username-check-msg bad'; saveBtn.disabled=true; return; }
    msgEl.textContent=t('username_checking'); msgEl.className='username-check-msg'; saveBtn.disabled=true;
    const myToken=++checkToken;
    const res=await PublicProfileService.checkUsernameAvailable(val);
    if(myToken!==checkToken) return; // a newer keystroke already superseded this check
    if(res.ok){ msgEl.textContent=t('username_available'); msgEl.className='username-check-msg ok'; saveBtn.disabled=false; }
    else{ msgEl.textContent=t(res.reason==='taken'?'username_taken':'username_invalid'); msgEl.className='username-check-msg bad'; saveBtn.disabled=true; }
  };
  inp.addEventListener('input',()=>{ clearTimeout(debounceT); debounceT=setTimeout(runCheck,400); });
  saveBtn.addEventListener('click',async()=>{
    saveBtn.disabled=true;
    try{
      await PublicProfileService.changeUsername(inp.value);
      showToast(LANG==='ar'?'تم تغيير اسم المستخدم ✅':'Username updated ✅','success');
      overlay.classList.remove('open');
      renderProfileSection();
    }catch(e){
      msgEl.textContent=e.message; msgEl.className='username-check-msg bad'; saveBtn.disabled=false;
    }
  });
  inp.focus();
}

/* ================= COSMETICS / STORE (approved batch 1) =================
   One catalog, one buy function, one equip function — the Store panel and
   the Profile hero both read from the exact same P.inventory/P.equipped,
   so there is never a second source of truth for what's owned/equipped.
   `mountEffect(el)` builds each item's DOM/particles fresh into whatever
   container it's given (a store preview card or the live Profile hero),
   using the exact CSS classes approved in the review demo. */
function cxAddEl(container,cls){ const d=document.createElement('div'); d.className=cls; container.appendChild(d); return d; }
function cxScatter(container,cls,n,area){
  for(let i=0;i<n;i++){
    const s=cxAddEl(container,cls);
    s.style.left=(Math.random()*90+2)+'%'; s.style.top=(Math.random()*(area||90)+2)+'%';
    s.style.animationDelay=(Math.random()*3)+'s';
  }
}
function cxScatterSized(container,cls,n,size,area){
  for(let i=0;i<n;i++){
    const s=cxAddEl(container,cls);

const RARITY_ORDER_LIST=['common','uncommon','epic','mythic','legendary'];

/* Epic-and-up purchases are big enough (1,500+ coins, days-to-weeks of
   saving) that a misclick would genuinely sting — ask first. Common/
   Uncommon stay one-click since a 150-750 coin mistake is trivial to
   recover from. Reuses the app's one shared modal (#overlay/#cardBody)
   rather than inventing a second dialog system. Resolves true/false. */
const STORE_CONFIRM_RARITIES=['epic','mythic','legendary'];
function confirmPurchase(item,name){
  if(!STORE_CONFIRM_RARITIES.includes(item.rarity)) return Promise.resolve(true);
  return new Promise(resolve=>{
    document.getElementById('dayTitle').textContent=t('store_confirm_title');
    document.getElementById('daySubtitle').textContent='';
    document.getElementById('cardBody').innerHTML=`
      <p class="dash-empty" style="text-align:center;">${t('store_confirm_body').replace('{name}',name).replace('{price}',item.price.toLocaleString())}</p>
      <button type="button" class="setup-btn" id="storeConfirmYesBtn">${t('store_confirm_yes')}</button>
      <button type="button" class="setup-btn" id="storeConfirmNoBtn" style="margin-top:10px;background:var(--card);color:var(--heading);border:1px solid var(--heading);">${t('store_confirm_no')}</button>
    `;
    overlay.classList.add('open');
    document.getElementById('storeConfirmYesBtn').addEventListener('click',()=>{ overlay.classList.remove('open'); resolve(true); });
    document.getElementById('storeConfirmNoBtn').addEventListener('click',()=>{ overlay.classList.remove('open'); resolve(false); });
  });
}

/* the ONLY place P.coins is spent and P.inventory is written for a
   purchase — checks affordability/ownership synchronously right before
   mutating so a double-click can't double-charge (the second call sees
   the already-updated P.inventory/P.coins from the first). */
async function buyCosmetic(id){
  const item=COSMETICS_CATALOG.find(c=>c.id===id);
  if(!item||item.price==null) throw new Error('not purchasable');
  if(P.inventory[id]) throw new Error('already owned');
  if((P.coins||0)<item.price) throw new Error(t('store_not_enough'));
  P.coins-=item.price;
  P.inventory[id]={acquiredAt:new Date().toISOString(),source:'store'};
  await storageSet('profile',JSON.stringify(P));
}
async function equipCosmetic(slot,id){
  if(id && !P.inventory[id]) throw new Error('not owned');
  P.equipped=P.equipped||{}; P.equipped[slot]=id;
  await storageSet('profile',JSON.stringify(P));
  if(slot==='background') renderAppBackground();
}
/* app-wide mirror of renderProfileCosmeticHero()'s background layer —
   same catalog item, same mountEffect function, just pointed at a fixed
   full-viewport layer instead of the Profile hero card, so the equipped
   background is visible everywhere, not only on the Profile panel.
   Individual panel cards stay on their own solid var(--bg) fill (untouched)
   so nothing readability-sensitive was touched except the loose Home
   greeting text (see the body.app-bg-active CSS rule). */
function renderAppBackground(){
  const el=document.getElementById('appBgLayer');
  const scrim=document.getElementById('appBgScrim');
  if(!el||!scrim) return;
  const bgId=P.equipped&&P.equipped.background;
  const bgItem=bgId&&COSMETICS_CATALOG.find(c=>c.id===bgId);
  el.innerHTML=''; el.className='app-bg-layer'+(bgItem?' '+bgItem.cls:'');
  if(bgItem&&bgItem.mountEffect) bgItem.mountEffect(el);
  scrim.classList.toggle('active',!!bgItem);
  document.body.classList.toggle('app-bg-active',!!bgItem);
}
async function equipTitle(id){
  const stats=await computeUserStats();
  if(id && !unlockedTitles(stats).some(t2=>t2.id===id)) throw new Error('not unlocked');
  P.equipped=P.equipped||{}; P.equipped.title=id;
  await storageSet('profile',JSON.stringify(P));
}
let storeActiveTab='background';
async function renderStoreSection(){
  document.getElementById('storeCoinsBadge').textContent=`🪙 ${(P.coins||0).toLocaleString()}`;
  document.querySelectorAll('#storeTabs .social-tab').forEach(b=>{
    b.classList.toggle('active', b.dataset.storeTab===storeActiveTab);
    b.onclick=()=>{ storeActiveTab=b.dataset.storeTab; renderStoreSection(); };
  });
  const content=document.getElementById('storeContent');
  if(storeActiveTab==='title'){ renderStoreTitlesTab(content); return; }
  const items=COSMETICS_CATALOG.filter(c=>c.type===storeActiveTab);
  content.innerHTML='';
  RARITY_ORDER_LIST.forEach(rar=>{
    const list=items.filter(c=>c.rarity===rar);
    if(!list.length) return;
    const group=document.createElement('div'); group.className='cos-rarity-group';
    group.innerHTML=`<div class="cos-rarity-head"><span class="dot" style="background:var(--cos-${rar});"></span><h3 style="margin:0;font-size:0.95rem;">${t('cos_rarity_'+rar)}</h3></div>`;
    const grid=document.createElement('div'); grid.className='cos-grid';
    list.forEach(it=>{
      const owned=!!P.inventory[it.id];
      const equipped=P.equipped&&P.equipped[it.type]===it.id;
      const card=document.createElement('div'); card.className='cos-card'+(equipped?' is-equipped':'');
      const name=LANG==='ar'?it.nameAr:it.nameEn, desc=LANG==='ar'?it.descAr:it.descEn;
      const previewCls = it.type==='frame' ? 'cos-frame-preview' : 'cos-preview';
      card.innerHTML=`
        <div class="${previewCls}"></div>
        <div class="cos-card-body">
          <div class="cos-card-name">${name}</div>
          <div>${it.exclusiveNote?`<span class="cos-tag">${t('store_exclusive')}</span>`:''}${owned?`<span class="cos-tag">${t('store_owned')}</span>`:''}</div>
          <div class="cos-price">${desc}<br>${it.price!=null?it.price.toLocaleString()+' 🪙':'—'}</div>
          <button type="button" class="cos-btn"></button>
        </div>`;
      grid.appendChild(card);
      const previewEl=card.querySelector('.'+previewCls);
      if(it.type==='frame'){
        const ring=document.createElement('div'); ring.style.cssText='position:relative;width:64px;height:64px;';
        const inner=document.createElement('div'); inner.className='cos-frame-ring '+it.cls; inner.style.cssText='position:absolute;inset:0;'; ring.appendChild(inner);
        if(it.orbiters){
          const wrap=document.createElement('div'); wrap.className='cx-orbit-wrap'; wrap.style.position='absolute';
          [0,90,180,270].forEach(deg=>{ const dot=document.createElement('div'); dot.className='cx-orbit-dot'; const rad=36; dot.style.left='calc(50% + '+(Math.cos(deg*Math.PI/180)*rad)+'px)'; dot.style.top='calc(50% + '+(Math.sin(deg*Math.PI/180)*rad)+'px)'; wrap.appendChild(dot); });
          ring.appendChild(wrap);
        }
        const av=document.createElement('div'); av.style.cssText='position:absolute;inset:8px;border-radius:50%;background:rgba(0,0,0,0.06);'; ring.appendChild(av);
        previewEl.appendChild(ring);
      } else {
        previewEl.className=previewCls+(it.cls?' '+it.cls:'');
        if(it.mountEffect) it.mountEffect(previewEl);
      }
      const btn=card.querySelector('.cos-btn');
      if(it.exclusiveNote && !owned){
        btn.textContent=t('store_exclusive'); btn.disabled=true;
      } else if(owned){
        btn.textContent=equipped?t('store_equipped'):t('store_equip');
        if(equipped) btn.classList.add('equipped');
        btn.addEventListener('click',async()=>{ await equipCosmetic(it.type, equipped?null:it.id); if(document.getElementById('panel-profile').classList.contains('active')) renderProfileCosmeticHero(); renderStoreSection(); });
      } else {
        const canAfford=(P.coins||0)>=it.price;
        btn.classList.add('primary'); btn.disabled=!canAfford;
        btn.textContent=canAfford?t('store_buy'):t('store_not_enough');
        btn.addEventListener('click',async()=>{
          const ok=await confirmPurchase(it,name);
          if(!ok) return;
          btn.disabled=true;
          try{ await buyCosmetic(it.id); await equipCosmetic(it.type,it.id); showToast(name+(LANG==='ar'?' — تم الشراء':' purchased'),'success'); renderStoreSection(); }
          catch(err){ showToast(err.message,'error'); btn.disabled=false; }
        });
      }
    });
