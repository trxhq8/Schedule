# Sends My Planner reminders. Free: GitHub Actions minutes are free for
# public repos, and Firebase Cloud Messaging is free on the Spark plan.
# Needs one repo secret: FIREBASE_SERVICE_ACCOUNT (the JSON key from
# Firebase console > Project settings > Service accounts).
name: reminders
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
concurrency:
  group: reminders
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: reminders
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: reminders
        run: npm install --no-audit --no-fund --omit=dev
      - name: Send due reminders
        working-directory: reminders
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node send.js
