<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>مقر الوكلاء</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Baloo+Bhaijaan+2:wght@400;600;800&display=swap">
<style>
/* Layout: a full-bleed 3D floating island over a sea of clouds, plain sand ground (no plants since 8 Nov: he rebuilds the vegetation later).
   Mangsi (the catfish in a dishdasha) works at a desk in the stone plaza; every agent is a Kuwaiti fish working seated at its own desk on its
   stone platform. Nobody walks: news is sent from the computers (an envelope on the screen, one call-out, a chip by Mangsi). Matte, no glow. */
:root{
  --glass:rgba(246,240,228,.84); --glass2:rgba(246,240,228,.96); --ink:#33291e; --dim:#73685a; --edge:#b5a283;
  --gold:#7d6236; --ok:#5f8f6a; --off:#a39a8a; --bubble:#f8f4ea; --bubink:#33291e; --shadow:0 6px 22px rgba(40,30,15,.18);
  --display:"Aref Ruqaa","Baloo Bhaijaan 2",serif; --body:"Baloo Bhaijaan 2",Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
body[data-mode="dark"]{
  --glass:rgba(22,27,38,.82); --glass2:rgba(22,27,38,.96); --ink:#e6e8ee; --dim:#9aa2b3; --edge:#5d6880;
  --gold:#d8c393; --ok:#7fb39a; --off:#5f6676; --bubble:#1d2331; --bubink:#e6e8ee; --shadow:0 6px 22px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:#e6dccd;color:var(--ink);font-family:var(--body)}
body[data-mode="dark"]{background:#252d3d}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(40,28,12,.22) 100%)}
body[data-mode="dark"] #vig{background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(0,0,8,.42) 100%)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}

/* name tags and speech bubbles that follow the 3D characters */
.lab{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:4px;will-change:transform;white-space:nowrap}
.tag{font-family:var(--display);font-size:14px;line-height:1;padding:4px 9px 5px;border-radius:99px;background:var(--glass);
  border:2px solid var(--c,var(--edge));color:var(--ink);display:flex;align-items:center;gap:6px;box-shadow:var(--shadow)}
.tag small,.tag .dot{display:none}
.tag .dot{width:8px;height:8px}
.say{max-width:230px;white-space:normal;text-align:center;font-size:13px;line-height:1.35;background:var(--bubble);color:var(--bubink);
  border:2px solid var(--c,var(--edge));border-radius:14px;padding:6px 10px;box-shadow:var(--shadow);position:relative;animation:pop .35s ease-out}
.say::after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--c,var(--edge));border-bottom:0}
.chip{font-size:11px;background:var(--c);color:#fff;border-radius:8px;padding:2px 8px;max-width:130px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 8px rgba(0,0,0,.2)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.dot{width:10px;height:10px;border-radius:50%;background:var(--off);flex:none}
.dot.on{background:var(--ok);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.tag .note{font-family:var(--body);font-size:11px;line-height:1.5;background:#efe3c4;color:#5a4426;border:1px solid #b89a5e;border-radius:99px;padding:0 6px}
.tag .udot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--gold));flex:none}
.brd{position:absolute;left:0;top:0;will-change:transform;pointer-events:auto;cursor:pointer;width:150px;padding:7px 9px 8px;border-radius:12px;
  background:var(--glass2);border:2px solid var(--c,var(--edge));border-top-width:6px;box-shadow:var(--shadow);color:var(--ink);text-align:center;direction:rtl}
.brd b{display:block;font-family:var(--display);font-size:15px;line-height:1.2;color:var(--c,var(--ink))}
.brd span{display:block;font-size:12px;line-height:1.35;color:var(--ink);opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.brd.urg{border-color:#b5533a}
.brd.hand{margin-top:-30px;width:auto!important;padding:2px!important;background:none!important;border:0!important;box-shadow:none!important}
.brd.hand .u{font-size:18px;margin:0;padding:2px 7px;border-radius:99px}
.brd .u{white-space:normal;font-weight:700;color:#fff;background:#b5533a;border-radius:8px;padding:2px 6px;margin-top:4px;opacity:1}
@media (max-width:820px){.brd{width:98px;padding:4px 6px 5px;border-top-width:4px;border-radius:10px}.brd b{font-size:12.5px}.brd span{font-size:10px;line-height:1.3}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* HUD */
.hud{position:fixed;z-index:5}
#top{z-index:6;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}
#top>*{pointer-events:auto}
h1{font-family:var(--display);font-weight:700;font-size:clamp(20px,2.6vw,28px);margin:0;color:var(--gold);line-height:1.1;
  text-shadow:0 1px 0 rgba(255,255,255,.35),0 2px 8px rgba(0,0,0,.15)}
.livechip{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1.5px solid var(--edge);box-shadow:var(--shadow)}
.btn.icon{width:34px;height:34px;padding:0;justify-content:center;font-size:16px}
.menuwrap{position:relative}
.menu{position:absolute;top:calc(100% + 6px);right:0;min-width:150px;display:grid;gap:2px;padding:6px;background:var(--glass2);border:1.5px solid var(--edge);border-radius:14px;box-shadow:var(--shadow);z-index:7}
.menu button{all:unset;box-sizing:border-box;cursor:pointer;padding:6px 10px;border-radius:9px;font:600 14px var(--body);color:var(--ink)}
.menu button:hover,.menu button:focus-visible{background:color-mix(in srgb,var(--edge) 22%,transparent)}
.menu button[aria-checked="true"]{background:color-mix(in srgb,var(--edge) 32%,transparent)}
.menu .mh{font-size:11px;color:var(--dim);padding:2px 10px}
.menu hr{border:0;border-top:1px solid color-mix(in srgb,var(--edge) 40%,transparent);margin:4px 2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill,.btn{display:flex;align-items:center;gap:8px;background:var(--glass);border:1.5px solid var(--edge);border-radius:99px;padding:6px 14px;
  font:600 14px var(--body);color:var(--ink);box-shadow:var(--shadow)}
.btn{cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible,.tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#toasts{position:fixed;z-index:6;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:max(16px,env(safe-area-inset-left,0px));display:grid;gap:6px;
  width:min(260px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--glass2);border:1.5px solid var(--c);border-radius:10px;padding:4px 8px;display:flex;gap:6px;align-items:center;
  box-shadow:var(--shadow);animation:pop .4s ease-out;font-size:12px;opacity:.92}
.toast .mini{width:20px;height:20px;flex:none}
.toast .t{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.new{background:color-mix(in srgb,var(--c) 68%,#000);color:#fff;border-radius:6px;padding:0 6px;font-size:11px;margin-inline-start:6px}

#drawer{right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 60px);display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#pill{padding:5px 12px;font-size:14px;cursor:pointer}
#pill b{min-width:20px;height:20px;border-radius:99px;display:grid;place-items:center;background:var(--gold);color:#fff;font-size:12px}
.panel{width:min(320px,calc(100vw - 32px));max-height:calc(100vh - 150px);display:flex;flex-direction:column;background:var(--glass2);border:1.5px solid var(--edge);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid color-mix(in srgb,var(--edge) 40%,transparent)}
.tabs button{flex:1;border:0;background:transparent;color:var(--dim);font:600 14px var(--body);padding:6px;border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:color-mix(in srgb,var(--edge) 25%,transparent);color:var(--ink)}
.tabs .fold{flex:0 0 auto;padding:6px 10px}
.dbody{overflow:auto;padding:6px 12px 12px;min-height:0}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45}
.list li>b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#fff;font-size:13px}
.list .mini{width:34px;height:34px;flex:none}
.list .meta{font-size:12px;color:var(--dim)}
.list .txt{font-size:13px;overflow-wrap:anywhere}
.list .txt.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#quests,#feed{direction:rtl}
#quests{gap:10px}
#quests .qg{display:block}
#quests .qh{display:flex;align-items:center;gap:8px;font:600 12.5px var(--body);color:var(--dim)}
#quests .qh .mini{width:24px;height:24px;flex:none}
#quests .qt{list-style:none;margin:2px 0 0;padding:0 32px 0 4px;display:grid;gap:4px}
#quests .qt li{display:block;font-size:13.5px;line-height:1.45;position:relative;color:var(--ink)}
#quests .qt li::before{content:"";position:absolute;right:-14px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--c,var(--gold))}
.empty{color:var(--dim);font-size:13px}
.mini svg,.orb svg{width:100%;height:100%;display:block;border-radius:50%}

#hint{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font-size:13px;color:var(--ink);
  background:var(--glass);border:1px solid var(--edge);border-radius:99px;padding:5px 14px;white-space:nowrap;box-shadow:var(--shadow);transition:opacity 1s}
#fallback{inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-size:16px}

/* board dialog */
dialog{border:2px solid var(--c,var(--edge));border-radius:18px;background:var(--glass2);color:var(--ink);padding:0;width:min(520px,calc(100% - 32px));
  max-height:min(88vh,680px);box-shadow:var(--shadow);overflow:hidden}
dialog[open]{display:flex;flex-direction:column}   /* one scroll container: only the body scrolls */
dialog::backdrop{background:rgba(5,6,20,.55);backdrop-filter:blur(3px)}
.dhead{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid color-mix(in srgb,var(--c) 40%,transparent);flex:none}
.orb{width:48px;height:48px;flex:none;border-radius:50%;box-shadow:0 0 0 2px var(--c)}
.dhead h3{font-family:var(--display);font-size:22px;font-weight:700;margin:0;color:var(--c);line-height:1.15}
.role,.status{font-size:13px;color:var(--dim)}
.dbox{padding:10px 14px;display:grid;gap:10px;overflow:auto;flex:1 1 auto;min-height:0;align-content:start}
.dbox h5{margin:4px 0 0;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:6px}
.tile{border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:12px;padding:8px 10px;background:color-mix(in srgb,var(--c) 8%,transparent)}
.tile .k{font-size:12px;color:var(--dim)} .tile .v{font-size:17px;font-weight:800;line-height:1.25;overflow-wrap:anywhere} .tile .s{font-size:11px;color:var(--dim)}
.spark{width:100%;height:50px;display:block}
.pbar{margin:10px 0 4px}.pbar .row{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}.pbar .row b{color:var(--ink);font-size:14px}
.pbar .track{height:10px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,transparent);overflow:hidden;margin-top:4px}
.pbar .fill{height:100%;border-radius:99px;background:color-mix(in srgb,var(--c) 80%,#000)}
.jgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:8px 0}
.jgrid i{font-style:normal;font-size:11px;text-align:center;border-radius:6px;padding:4px 0;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);color:var(--ink)}
.jgrid i.done{background:color-mix(in srgb,var(--c) 55%,transparent);color:#fff;font-weight:700}.jgrid i.now{background:color-mix(in srgb,#c9963f 45%,transparent);font-weight:700}
.jgrid i.later{background:color-mix(in srgb,var(--c) 7%,transparent)}.jgrid i.mark{outline:2px solid var(--ink);outline-offset:1px}
.jleg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--dim)}.jleg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px;background:var(--sw)}
img.pt{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.plist li{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-bottom:1px dashed color-mix(in srgb,var(--c) 35%,transparent);padding-bottom:5px}
.plist a{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.entry h4{margin:0 0 4px;font-size:13px;color:var(--c)} .entry ul{margin:0;padding-inline-start:18px;font-size:13px;line-height:1.5}
.boxes{border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:12px;background:color-mix(in srgb,var(--c) 6%,transparent)}
.boxes summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;font-weight:600;list-style:none}
.boxes summary::-webkit-details-marker{display:none}
.boxes summary b{background:var(--c);color:#fff;border-radius:99px;padding:0 9px;font-size:12px}
.boxes summary::after{content:"▾";color:var(--dim);margin-inline-start:auto}
.boxes[open] summary::after{content:"▴"}
.boxes .entry{padding:0 12px 10px}
.close{flex:none;align-self:flex-start;margin:6px 14px 12px;border:0;border-radius:12px;padding:7px 18px;background:var(--c);color:#fff;font:700 14px var(--body);cursor:pointer}

@media (max-width:820px){
  #drawer{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);align-items:center}
  .panel{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:56vh;border-radius:18px 18px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}   /* a bottom sheet */
  #hint{display:none}
  #toasts{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 120px);width:min(220px,calc(100% - 32px))}
  .tag{font-size:14px;padding:4px 9px}
  .say{max-width:170px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){.say,.toast{animation:none}.dot.on{animation:none}}
</style>

<canvas id="gl" aria-label="جزيرة الوكلاء ثلاثية الأبعاد: منقسي في النص والوكلاء حوله"></canvas>
<div id="vig" aria-hidden="true"></div>
<div id="labels" aria-hidden="true"></div>

<div id="top" class="hud">
  <h1>مقر الوكلاء</h1>
  <div class="bar">
    <span class="livechip" role="status" id="liveChip" title="يتصل…"><i class="dot" id="liveDot"></i><span id="liveTxt" class="sr">يتصل…</span></span>
    <div class="menuwrap"><button class="btn icon" id="menuBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="الإعدادات">⚙️</button>
      <div class="menu" id="menu" role="menu" hidden>
        <div class="mh">الوقت</div>
        <button type="button" role="menuitemradio" data-mode="auto">🕰️ تلقائي</button><button type="button" role="menuitemradio" data-mode="light">☀️ نهار</button>
        <button type="button" role="menuitemradio" data-mode="sunset">🌅 غروب</button><button type="button" role="menuitemradio" data-mode="dark">🌙 ليل</button>
        <hr><button type="button" role="menuitem" id="replayBtn">🔁 آخر توصيل</button>
      </div></div>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>

<aside id="drawer" class="hud">
  <button class="pill" id="pill" type="button" aria-expanded="false" aria-controls="panel">📌 عليك <b id="qn">0</b></button>
  <div class="panel" id="panel" hidden>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="quests">📌 عليك</button>
      <button role="tab" aria-selected="false" data-tab="feed">آخر الأخبار</button>
      <button class="fold" id="fold" type="button" aria-label="سكّر">✕</button>
    </div>
    <div class="dbody"><ul class="list" id="quests"></ul><ul class="list" id="feed" hidden></ul></div>
  </div>
</aside>
<div id="hint" class="hud">اسحب للدوران · اضغط أي وكيل تطلع لوحته</div>
<div id="fallback" class="hud" hidden>جهازك ما شغّل الرسم ثلاثي الأبعاد. القوائم شغالة على اليمين.</div>
<dialog id="dlg"></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script>
/* ---------- faces: each agent is a Kuwaiti fish with its own world behind it ---------- */
const BUBS = c => `<g fill="none" stroke="${c}" stroke-width="2"><circle class="bub" cx="30" cy="170" r="5"/><circle class="bub" cx="172" cy="176" r="4"/><circle class="bub" cx="22" cy="150" r="3"/></g>`;
const FACE = {
knowledge:`<svg viewBox="0 0 200 200"><defs><linearGradient id="mk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2a66"/><stop offset="1" stop-color="#0a1230"/></linearGradient></defs>
<rect width="200" height="200" fill="url(#mk)"/>
<g fill="#fff">${[[26,26,1.6],[60,14,1.2],[150,22,1.4],[182,60,1.6],[16,80,1.1],[120,12,1]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}"/>`).join('')}</g>
<path d="M164 18a14 14 0 1 0 10 24a11 11 0 1 1-10-24z" fill="#ffd76a"/>
<g fill="#24346e"><rect x="10" y="150" width="4" height="50"/><circle cx="12" cy="150" r="9"/><circle cx="12" cy="170" r="6"/><rect x="26" y="168" width="3" height="32"/><circle cx="27.5" cy="166" r="6"/><rect x="186" y="160" width="4" height="40"/><circle cx="188" cy="160" r="7"/></g>
<g class="fish">
<path d="M34 200c4-44 30-62 66-64 36 2 62 20 66 64z" fill="#f7f5ef"/>
<path d="M100 140v60" stroke="#d9d4c8" stroke-width="2"/><circle cx="100" cy="152" r="2.5" fill="#cfc8b8"/><circle cx="100" cy="166" r="2.5" fill="#cfc8b8"/>
<path d="M38 58q62-44 124 0l18 112q-22-6-40-30h-80q-18 24-40 30z" fill="#ffffff"/>
<path d="M38 58q62-44 124 0l18 112q-22-6-40-30h-80q-18 24-40 30z" fill="none" stroke="#dcdcdc" stroke-width="2"/>
<ellipse cx="100" cy="104" rx="56" ry="42" fill="#6e7f8d"/>
<ellipse cx="100" cy="122" rx="44" ry="20" fill="#c6d1d9"/>
<path d="M46 80q54-34 108 0q-54-12-108 0z" fill="#fff"/>
<ellipse cx="100" cy="60" rx="54" ry="10" fill="none" stroke="#141414" stroke-width="6"/>
<ellipse cx="100" cy="69" rx="52" ry="8" fill="none" stroke="#141414" stroke-width="5"/>
<g class="blinkeye"><circle cx="78" cy="96" r="8" fill="#fff"/><circle cx="79" cy="97" r="4.5" fill="#111"/></g>
<g class="blinkeye"><circle cx="122" cy="96" r="8" fill="#fff"/><circle cx="121" cy="97" r="4.5" fill="#111"/></g>
<path d="M68 118q32 16 64 0" stroke="#2c3740" stroke-width="5" fill="none" stroke-linecap="round"/>
<g stroke="#2c3740" stroke-width="3" fill="none" stroke-linecap="round"><path d="M68 116q-30 2-44 30"/><path d="M70 121q-22 16-26 44"/><path d="M132 116q30 2 44 30"/><path d="M130 121q22 16 26 44"/></g>
</g></svg>`,
hamour:`<svg viewBox="0 0 200 200"><defs><linearGradient id="hs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f8fa6"/><stop offset="1" stop-color="#062b45"/></linearGradient></defs>

<script>
'use strict';
/* ================= data + helpers ================= */
const AGENTS = [
  {id:'knowledge',name:'منقسي',role:'الوكيل الرئيسي · يجمع ويوزّع أخبار الكل',c:'#b8913f',center:true},

  {id:'hamour',name:'هامور',role:'القرآن والحديث والفقه والأخلاق',c:'#3f8c7a',a:80},
  {id:'hoot',name:'الحوت',role:'مستشار البرادو · برادو 2019',c:'#4f7d95',a:-80,locked:true,gate:'car'},   // locked until its db doc exists, then unboxed live
  {id:'uni',name:'الجامعة',role:'قريباً',c:'#878494',a:120,locked:true,gate:'uni',open:true},           // open: a new agent the page doesn't know yet claims it

  {id:'zubaidi',name:'زبيدي',role:'أمين المال · الفلوس والادخار',c:'#5f8a5a',a:0,locked:true,gate:'treasury',view:[.3,.95]},

  {id:'fryalah',name:'فريالة',role:'الزراعة والنباتات',c:'#5f8a4a',a:-160,locked:true,gate:'garden'},   // the plants teacher (13 Nov): 9 stations, 40° apart
  // (above) the money keeper (8 Nov): the right-hand gap; Hurairy -30→-42 and Yaryour 30→42 made room
];
const byId = Object.fromEntries(AGENTS.map(a=>[a.id,a]));
// delivery lanes (station-local points from the island side to the hand-over spot) and where each agent's boxes pile up
Object.assign(byId.hamour,{lane:[[1.95,-4.6],[1.8,-1.3],[.95,-.4]], pile:[.3,2.1]}); byId.zory.pile=[.9,2.2]; byId.hurairy.pile=[-.2,2.0];
const docs = {};
const R = 17;                                   // station ring radius
const esc = s => String(s??'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const ls = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const still = matchMedia('(prefers-reduced-motion:reduce)').matches;
const narrow = () => innerWidth < 820;
const cut = (s,n) => { s = String(s||''); return s.length>n ? s.slice(0,n-1)+'…' : s; };
const faceOf = id => (window.__pt && window.__pt[id]) || (typeof FACE!=='undefined' && (FACE[id]||FACE.locked)) || '';   // a portrait rendered from the 3D cast once it exists
const mini = id => `<div class="mini">${faceOf(id)}</div>`;
function ago(iso){
  if(!iso) return 'ما تحرك للحين';
  const m = (Date.now()-new Date(iso))/6e4;
  if(!(m>=0)) return '—';
  if(m<2) return 'الحين';
  if(m<60) return `قبل ${Math.round(m)} دقيقة`;
  const h = m/60; if(h<24) return `قبل ${Math.round(h)} ساعة`;
  return `قبل ${Math.round(h/24)} يوم`;
}
for(const a of AGENTS){ if(!a.center){ const r=a.a*Math.PI/180; a.x=R*Math.cos(r); a.z=R*Math.sin(r); a.dir=[Math.cos(r),Math.sin(r)]; } else { a.x=0; a.z=0; } }

/* ================= mode (light fantasy / dark fantasy) ================= */
function kuwaitHour(){ try{ return +new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Kuwait',hour:'numeric',hourCycle:'h23'}).format(new Date()); }catch(e){ return new Date().getHours(); } }
function kuwaitClock(){ try{ const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Kuwait',hour:'numeric',minute:'numeric',hourCycle:'h23'}).formatToParts(new Date());
  return +p.find(x=>x.type==='hour').value + p.find(x=>x.type==='minute').value/60; }catch(e){ const d=new Date(); return d.getHours()+d.getMinutes()/60; } }
const lookByHour = () => { const h=kuwaitClock(); return h>=5.5 && h<15.75 ? 'light' : h>=15.75 && h<17.5 ? 'sunset' : 'dark'; };
let mode = ls.get('hq-mode2') || 'auto';                 // auto | light | sunset | dark
let look = mode==='auto' ? lookByHour() : mode;          // what is on screen now
document.body.dataset.mode = look==='dark' ? 'dark' : 'light';

/* ================= HUD (works even without WebGL) ================= */
const $ = id => document.getElementById(id);
function setTab(t){ ls.set('hq-tab',t); for(const b of document.querySelectorAll('.tabs [data-tab]')) b.setAttribute('aria-selected', String(b.dataset.tab===t));
  $('quests').hidden = t!=='quests'; $('feed').hidden = t!=='feed'; }
for(const b of document.querySelectorAll('.tabs [data-tab]')) b.onclick = () => setTab(b.dataset.tab);
// the side list starts closed as a small «📌 عليك n» pill; opened it is a short panel (a bottom sheet on phones)
function openPanel(on){ $('panel').hidden=!on; $('pill').hidden=on; $('pill').setAttribute('aria-expanded',String(on)); }
$('pill').onclick = () => openPanel(true); $('fold').onclick = () => openPanel(false);
setTab(ls.get('hq-tab') || 'quests'); openPanel(false);
// one ⚙️ menu: the time of day and «آخر توصيل»
const closeMenu = () => { $('menu').hidden=true; $('menuBtn').setAttribute('aria-expanded','false'); };
$('menuBtn').onclick = e => { const on=$('menu').hidden; $('menu').hidden=!on; $('menuBtn').setAttribute('aria-expanded',String(on)); e.stopPropagation(); };
document.addEventListener('pointerdown', e => { if(!$('menu').hidden && !e.target.closest('.menuwrap')) closeMenu(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeMenu(); });
setTimeout(()=>{ $('hint').style.opacity='0'; setTimeout(()=>{ $('hint').hidden=true; },1200); }, 9000);

const arDate = iso => { const [y,m,d]=(String(iso||'').match(/\d+/g)||[]).map(Number); return d ? `${d}/${m}` : ''; };
// «<agent name>: task» lines from the knowledge doc, grouped by agent (anything else is Mangsi's)
function questGroups(){ const groups = new Map();
  for(const t of (docs.knowledge?.quests||[])){ const m=String(t).match(/^\s*([^:：]{2,12})\s*[:：]\s*(.+)$/), who=m && AGENTS.find(a=>!a.center && a.name===m[1].trim());
    const id = who ? who.id : 'knowledge'; if(!byId[id]) continue; if(!groups.has(id)) groups.set(id,[]); groups.get(id).push(who ? m[2] : t); }
  return groups; }
function renderHud(){
  const q = $('quests'), groups = questGroups(); let total=0;
  q.innerHTML = groups.size ? [...groups].map(([id,ts])=>{ const a=byId[id]; total+=ts.length;
    return `<li class="qg" style="--c:${a.c}"><div class="qh">${mini(id)}<span>${esc(a.name)}</span></div><ul class="qt">${ts.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></li>`; }).join('') : '<li class="empty">ما عليك شي الحين ✨</li>';
  $('qn').textContent = String(total);
  const all = [];
  for(const [id,d] of Object.entries(docs)) for(const e of (d.entries||[])) all.push({id,...e});
  all.sort((x,y)=>(y.date||'').localeCompare(x.date||''));
  $('feed').innerHTML = all.length ? all.slice(0,12).map(e=>{ const a=byId[e.id]||byId.knowledge;
    const who = e.id==='knowledge' ? 'منقسي' : e.dir==='in' ? `منقسي ← ${a.name}` : `${a.name} ← منقسي`;
    return `<li>${mini(e.id)}<div style="min-width:0"><div class="meta">📨 ${esc(who)} · ${esc(arDate(e.date))}</div><div class="txt one">• ${esc(e.sum||e.title||'')}</div></div></li>`;
  }).join('') : '<li class="empty">أول ما يكتب أي وكيل، يطلع هني.</li>';
}

function toast(id, text, dir, fresh){
  const a = byId[id]; const el = document.createElement('div');
  el.className='toast'; el.style.setProperty('--c',a.c);
  const who = dir==='in' ? `منقسي ← ${a.name}` : `${a.name} ← منقسي`;
  el.innerHTML = `${mini(id)}<div class="t">📨 ${esc(who)}${fresh?' · جديد':''}</div>`; el.title=text;
  $('toasts').prepend(el);
  while($('toasts').children.length>2) $('toasts').lastChild.remove();
  setTimeout(()=>el.remove(), 5000);
}

/* board dialog */
function spark(vals,c,o={}){
  if(!vals?.length) return '';
  const W=600,H=80,p=6,min=o.min??Math.min(...vals),max=o.max??Math.max(...vals),r=(max-min)||1;
  const X=i=>p+i*(W-2*p)/Math.max(1,vals.length-1), Y=v=>H-p-(Math.max(min,Math.min(max,v))-min)/r*(H-2*p);
  const tr = o.smooth ? vals.map((v,i)=>{ const w=vals.slice(Math.max(0,i-3),i+4); return w.reduce((a,b)=>a+b,0)/w.length; }) : vals;
  const pts=tr.map((v,i)=>[X(i),Y(v)]), line=pts.map(q=>q.join(',')).join(' '), last=pts[pts.length-1];
  const dots = o.smooth ? vals.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="2.5" fill="${c}" opacity=".35"/>`).join('') : '';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <polygon points="${p},${H} ${line} ${last[0]},${H}" fill="${c}" opacity=".15"/>${dots}
    <polyline points="${line}" fill="none" stroke="${c}" stroke-width="3" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="${c}"/></svg>`;
}
const bar = (pg) => pg ? `<div class="pbar"><div class="row"><span>${esc(pg.label)}</span><b><bdi>${esc(pg.text||'')}</bdi></b></div><div class="track"><div class="fill" style="width:${Math.round(Math.max(0,Math.min(1,+pg.value||0))*100)}%"></div></div><div class="row"><span><bdi>${esc(pg.sub||'')}</bdi></span></div></div>` : '';
const SW = {done:'color-mix(in srgb,var(--c) 55%,transparent)', now:'color-mix(in srgb,#c9963f 45%,transparent)', later:'color-mix(in srgb,var(--c) 7%,transparent)', mark:'var(--ink)'};
const jgrid = (gd) => gd?.cells?.length ? `<h5>${esc(gd.label||'')}</h5><div class="jgrid">${gd.cells.map(c=>`<i class="${esc(c.s)}${c.mark?' mark':''}">${esc(c.t)}</i>`).join('')}</div>
  <div class="jleg">${(gd.legend||[]).map(([k,t])=>`<span style="--sw:${SW[k]||'transparent'}">${esc(t)}</span>`).join('')}</div>` : '';
$('dlg').addEventListener('close', ()=>{ if(W3.camHome && W3.camera){ const h=W3.camHome; W3.camHome=null; glide(h.p, h.t); } });
function openAgent(id){
  const a=byId[id], d=docs[id], dlg=$('dlg'), b=d?.board;
  dlg.style.setProperty('--c',a.c);
  let body;
  if(a.locked) body = `<p class="empty">هذا المكان محجوز لوكيل جديد. أول ما ننبنيه، ياخذ اسم سمكة كويتية وشكله ويفتح بابه هني.</p>`;
  else {
    const boardHtml = b ? `<h5>${esc(b.title)}</h5>
      <div class="tiles">${(b.stats||[]).map(s=>`<div class="tile"><div class="k">${esc(s.label)}</div><div class="v"><bdi>${esc(s.value)}</bdi></div><div class="s"><bdi>${esc(s.sub)}</bdi></div></div>`).join('')}</div>
      ${bar(b.progress)}${jgrid(b.grid)}
      ${b.series?.length?`<div><div class="role">${esc(b.seriesLabel||'')}</div>${spark(b.series,a.c,{min:b.seriesMin,max:b.seriesMax,smooth:b.seriesSmooth})}</div>`:''}
      ${b.list?.length?`<h5>${esc(b.listLabel||'')}</h5><ul class="plist">${b.list.slice(0,5).map(p=>`<li>${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.text)}</a>`:`<span>${esc(p.text)}</span>`}<b>${esc(p.value)}</b></li>`).join('')}</ul>`:''}`
      : id==='knowledge' ? `<h5>📜 مهامك</h5><ul class="plist">${(d?.quests||[]).map((t,i)=>`<li><span>${esc(t)}</span><b>${i+1}</b></li>`).join('')||'<li class="empty">ما فيه مهام</li>'}</ul>` : '';
    const ents = d?.entries||[];
    body = boardHtml; if(0) body += `<details class="boxes"><summary><span>📨 آخر الصناديق</span><b>${ents.length}</b></summary>` +
      (ents.map(e=>`<div class="entry"><h4>${e.dir==='in'?'📥':'📤'} ${esc(e.date)} · ${esc(e.title||'')}</h4><ul>${(e.lines||[]).map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`).join('')||'<p class="empty">ما فيه أخبار للحين.</p>') + `</details>`;
  }
  dlg.innerHTML = `<div class="dhead"><div class="orb">${faceOf(id)}</div><div><h3>${esc(a.name)}</h3><div class="role">${esc(a.role)}</div>
    <div class="status">${a.locked?'🔒 مقفل':'آخر تحديث: '+esc(d?ago(d.updatedAt):'—')}</div></div></div>
    <div class="dbox">${body}</div><button class="close" type="button" id="dlgClose">تمام</button>`;
  dlg.querySelector('#dlgClose').onclick = () => dlg.close();
  dlg.showModal();
  markRead(id);
}

/* ================= 3D world ================= */
const W3 = {};  // world handles, filled by build()
let ok3d = !!window.THREE;   // build() runs at the end of this script, once every constant below exists

/* ---------- the texture kit ---------- */
const KIT = {};
function kit(name, w, h, draw, opts={}){
  if(KIT[name]) return KIT[name];
  const [c,x] = W3.cv(w,h); draw(x,w,h);
  const t = W3.tex(c); if(opts.clamp!==true){ t.wrapS=t.wrapT=THREE.RepeatWrapping; } t.anisotropy=W3.aniso||8;
  return (KIT[name]=t);
}
const R01 = (() => { let s=91; return () => (s=(s*16807)%2147483647)/2147483647; })();
const KT = {
  // irregular flagstones: rounded slabs of varied size, dark grout, soft worn edges and specks
  flag: () => kit('flag',1024,1024,(x,w,h)=>{ x.fillStyle='#7d7a72'; x.fillRect(0,0,w,h);
    const rows=7; let y=0; for(let j=0;j<rows;j++){ const rh=h/rows; let xx=-R01()*80;

/* ---------- the default view: from above the gap between Hamour (80°) and Saboor (120°), ~47° down, as close as still shows every station ---------- */
function fitCamera(){

  cam.fov = asp<1 ? 50 : 38; cam.aspect=asp; cam.updateProjectionMatrix();
  const az=CAM_AZ*Math.PI/180, el=(asp<1?55:47)*Math.PI/180, dir=new THREE.Vector3(Math.cos(az)*Math.cos(el), Math.sin(el), Math.sin(az)*Math.cos(el));
  const pts=[]; for(const a of AGENTS){ const r=a.center?3:5; for(let k=0;k<12;k++){ const q=k/12*Math.PI*2; for(const y of [0, a.center?4.6:4.4]) pts.push(new THREE.Vector3(a.x+Math.cos(q)*r,y,a.z+Math.sin(q)*r)); } }
  const H=innerHeight, top=1-2*(asp<1?96:84)/H, bot=-1+2*(asp<1?76:30)/H, side=1-2*24/innerWidth, q=new THREE.Vector3();
  const box=()=>{ let x0=9,x1=-9,y0=9,y1=-9; for(const p of pts){ q.copy(p).project(cam); x0=Math.min(x0,q.x); x1=Math.max(x1,q.x); y0=Math.min(y0,q.y); y1=Math.max(y1,q.y); } return {x0,x1,y0,y1}; };
  const at=(t,d)=>{ cam.position.copy(t).addScaledVector(dir,d); cam.lookAt(t); cam.updateMatrixWorld(); };
  const tgt=new THREE.Vector3(0,0,0); let d=60;
  for(let pass=0; pass<4; pass++){
    let lo=12, hi=320; for(let i=0;i<28;i++){ const mid=(lo+hi)/2; at(tgt,mid); const b=box(); if(b.x0>=-side && b.x1<=side && b.y1<=top && b.y0>=bot) hi=mid; else lo=mid; }
    d=hi; at(tgt,d); const b=box(), hh=2*d*Math.tan(cam.fov*Math.PI/360), ww=hh*asp;
    const right=new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld,0), up=new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld,1);
    tgt.addScaledVector(right,(b.x0+b.x1)/2*ww/2).addScaledVector(up,((b.y0+b.y1)/2-(top+bot)/2)*hh/2); }

/* a wooden-framed notice board that always turns to the camera; drawn from the agent's board */
function buildScreen(id, x, y, z, s=3.6){
  const [c] = W3.cv(512,300); const t=W3.tex(c);
  W3.screens[id]={c,t,g:new THREE.Group()}; return;
  const g=new THREE.Group(); g.position.set(x,y,z); g.userData.baseY=y;
  const h=s*300/512, wood=W3.M('#4e3c2c');
  g.add(new THREE.Mesh(new THREE.PlaneGeometry(s,h), new THREE.MeshBasicMaterial({map:t, transparent:true, toneMapped:false})));
  for(const sy of [-1,1]){ const b=W3.box(s+.18,.09,.08,wood); b.position.set(0,sy*h/2,-.02); g.add(b); }
  for(const sx of [-1,1]){ const b=W3.box(.09,h+.18,.08,wood); b.position.set(sx*s/2,0,-.02); g.add(b); }
  g.userData.pick=id; W3.pick.push(g);
  W3.scene.add(g); W3.billboards.push(g);
  W3.screens[id]={c,t,g};
  drawScreen(id);
}
function screenInfo(id){
  const d=docs[id], b=d?.board;

  if(id==='hurairy' && b) return {title:'آخر وزن', big:b.stats?.[0]?.value||'—', sub:`باقي للهدف ${b.stats?.[2]?.value||'—'}`};
  if(id==='hamour' && b) return {title:'هدف الفصل (أوجه)', big:b.stats?.[2]?.value||'—', sub:`المعتمد إلى ${b.stats?.[0]?.value||'—'}`};
  if(id==='hoot' && b) return {title:'العداد (كم)', big:String(b.stats?.[0]?.value||'—').replace(/\s*كم$/,''), sub:'مستحق: '+(b.stats?.[1]?.value||'—')};

  if(id==='zubaidi' && b?.limit) return {title:'حد اليوم', big:b.limit.kd, sub:cut('د.ك · باقي '+b.limit.days+' يوم للراتب',30)};
  if(id==='shaari') return {title:'الأحلام', big:String(d?.total||d?.entries?.length||0), sub:'محفوظة بخصوصية'};

}

function homeOf(a){ return new THREE.Vector3(a.x - a.dir[0]*.6, 0, a.z - a.dir[1]*.6); }
/* a portrait of each fish, rendered once from the 3D cast, so the HUD, the tasks and the boards show the same faces as the world */
function makePortrait(id){
  const ch=W3.chars?.[id], R=W3.renderer; if(!ch || !R) return; const S=192;
  if(!W3.ptScene){ const sc=new THREE.Scene(); sc.add(new THREE.HemisphereLight(0xffffff,0x8a7a6a,1.05)); const d=new THREE.DirectionalLight(0xfff1dd,1.35); d.position.set(2.5,3,4); sc.add(d);
    const d2=new THREE.DirectionalLight(0xc9d6ea,.45); d2.position.set(-3,1,-2); sc.add(d2);
    W3.ptScene=sc; W3.ptRT=new THREE.WebGLRenderTarget(S,S,{encoding:THREE.sRGBEncoding}); W3.ptCam=new THREE.PerspectiveCamera(26,1,.1,60); }
  const g=ch.g, par=g.parent, pos=g.position.clone(), rot=g.rotation.y;
  try{
    par.remove(g); W3.ptScene.add(g); g.position.set(0,0,0); g.rotation.y=0; g.updateMatrixWorld(true);
    const box=new THREE.Box3().setFromObject(ch.P.head), c=box.getCenter(new THREE.Vector3()), sz=box.getSize(new THREE.Vector3());
    const k=Math.max(sz.x,sz.y)*1.15; W3.ptCam.position.set(c.x+k*.35, c.y+k*.18, c.z+k*2.2); W3.ptCam.lookAt(c.x, c.y-k*.08, c.z);
    const pT=R.getRenderTarget(), pC=R.getClearColor(new THREE.Color()), pA=R.getClearAlpha(), pS=R.shadowMap.autoUpdate;
    R.shadowMap.autoUpdate=false; R.setRenderTarget(W3.ptRT); R.setClearColor(0x000000,0); R.clear(); R.render(W3.ptScene,W3.ptCam);
    const px=new Uint8Array(S*S*4); R.readRenderTargetPixels(W3.ptRT,0,0,S,S,px);
    R.setRenderTarget(pT); R.setClearColor(pC,pA); R.shadowMap.autoUpdate=pS;
    const [cv,x]=W3.cv(S,S), im=x.createImageData(S,S); for(let y=0;y<S;y++) im.data.set(px.subarray((S-1-y)*S*4,(S-y)*S*4),y*S*4); x.putImageData(im,0,0);

// at most one speech bubble on screen: a more important line replaces the current one, an important one waits its turn, chatter is dropped

function groundY(x,z){
  const r=Math.hypot(x,z); if(r<2.35) return .55; if(r<6.25) return .3;
  for(const a of AGENTS){ if(!a.center && Math.hypot(x-a.x,z-a.z)<4.35) return .3; }
  return .07 + (W3.H ? W3.H(x,z) : 0);
}
const angLerp = (a,b,k) => a + Math.atan2(Math.sin(b-a),Math.cos(b-a))*k;
function step(ch, dt){
  if(ch.seated){ ch.moving=false; ch.steps.length=0; return; }   // nobody walks
  const s=ch.steps[0];
  if(!s){ ch.moving=false; idle(ch,dt); return; }
  if(s.t==='go'){ const g=ch.g.position, dx=s.p.x-g.x, dz=s.p.z-g.z, d=Math.hypot(dx,dz);

  for(const id of changed){ if(id==='knowledge' || !docs[id]) continue; let key=id;
    if(!byId[id]){ key=claimSlot(id); if(!key) continue; }
    const a=byId[id]; if(!a.locked || a.queued) continue; a.queued=true;
    // the gift box plays once, only for an agent that is really new: browser storage can be cleared or blocked
    // (iPad, the claude.ai frame), so an agent whose first hub entry is over 2 days old just stands at its place
    const ents=docs[id].entries||[], first=(String(ents[ents.length-1]?.date||'').match(/\d{4}-\d{2}-\d{2}/)||[])[0];
    const old = first && (Date.now()-Date.parse(first+'T00:00:00+03:00')) > 2*864e5;
    if(old && !unboxed.has(id)){ unboxed.add(id); ls.set('hq-unboxed-v1', JSON.stringify([...unboxed])); }
    const show=!unboxed.has(id) && !docs[id].revealed; if(show) a.revealing=true;
    revealChain = revealChain.then(()=>new Promise(r=>setTimeout(r, show?900:0))).then(()=>revealAgent(id,key,show)); }
  const fresh = [];
  for(const id of changed){ const d=docs[id]; if(!d?.entries || id==='knowledge' || !byId[id]) continue;
    for(const e of d.entries){ if(seen && !seen.has(keyOf(id,e))) fresh.push({id,e}); } }
  const all = new Set(seen||[]); for(const [id,d] of Object.entries(docs)) for(const e of (d.entries||[])) all.add(keyOf(id,e));
  let delay = firstSnap ? 1200 : 0;
  if(firstSnap){
    // every open replays each agent's newest box (not marked new), unless something new arrived while the page was shut
    const freshIds = new Set(fresh.map(f=>f.id));
    void freshIds;   // (no replays on open any more: only news that is really new plays; «آخر توصيل» replays on request)
    firstSnap=false;
  }
  fresh.reverse().filter(f=>!byId[f.id]?.revealing).forEach(f=>{ setTimeout(()=>deliver(f.id,f.e,true),delay); delay+=2000; });
  seen = all; ls.set('hq-seen-v1', JSON.stringify([...all].slice(-400)));
  renderHud(); renderTags();
  for(const id of changed) drawScreen(id);
}
function renderTags(){
  if(!ok3d) return; renderBoards(); const groups=questGroups();
  for(const ch of Object.values(W3.chars)){ if(!ch.elTag) continue;
    const n=groups.get(ch.id)?.length||0, note=ch.elTag.querySelector('.note'); note.hidden=!n; note.textContent=n?`📌 ${n}`:'';
    const u=ch.elTag.querySelector('.udot'); if(u) u.hidden=!(unread[ch.id]?.length); }
}
window.__feed = list => { const ch=[]; for(const d of list){ docs[d.agent]=d; ch.push(d.agent); } onDocs(ch); };  // local preview only

async function connect(){
  const dot=$('liveDot'), txt0=$('liveTxt'), txt={ set textContent(v){ txt0.textContent=v; $('liveChip').title=v; } };
  const timer=setTimeout(()=>{ txt.textContent='يتصل…'; },10000);
  let db=null; try{ db = await claude.use('db'); }catch(e){ db=null; }
  if(!db){ clearTimeout(timer); txt.textContent='غير متصل'; return; }
  W3.db = db;
  db.collection('agents').onSnapshot(snap=>{
    if(!snap.metadata.fromCache){ clearTimeout(timer); dot.classList.add('on'); txt.textContent='مباشر'; }
    const changed=[];
    for(const c of snap.docChanges()){ const body=c.doc.data(); if(!body) continue; docs[c.doc.id]=body; changed.push(c.doc.id); }
    if(changed.length) onDocs(changed);
  },()=>{ clearTimeout(timer); txt.textContent='انقطع'; dot.classList.remove('on'); });
  setInterval(()=>{ renderHud(); renderTags(); },60000);
}
document.documentElement.lang='ar';
try { if(ok3d){ build(); window.__hq = W3; } } catch(err){ console.error(err); ok3d=false; }
if(!ok3d){ $('fallback').hidden=false; $('hint').hidden=true; $('gl').hidden=true; }
renderHud();
if(document.fonts?.ready) document.fonts.ready.then(()=>{ for(const id in (W3.screens||{})) drawScreen(id); W3.drawSign?.(); (W3.redraw||[]).forEach(fn=>fn()); });
if(false) connect();
else setTimeout(()=>{ if(window.claude?.use) connect(); else { $('liveTxt').textContent='غير متصل'; $('liveChip').title='غير متصل'; } }, 1500);

/* ---------- boards: a big readable sign above each station (DOM, so it stays sharp on a phone) ---------- */
const brdClean = s => String(s||'').replace(/🏠\s*صفحتي\s*[:：]\s*\S*\s*(\([^)]*\))?\s*[·.]?\s*/gu,'').replace(/https?:\/\/\S+/g,'').replace(/\*\*/g,'').replace(/\s{2,}/g,' ').trim();
function boardLines(id){
  const d=docs[id]||{}; let L=[];
  if(id==='knowledge' && Array.isArray(d.quests) && d.quests.length) L=d.quests.slice(0,2).map(q=>'📌 '+(typeof q==='string'?q:q.text));
  if(!L.length) L=(d.now||[]).map(brdClean).filter(x=>x.length>2 && !/^🙋/.test(x));
  if(!L.length) L=(d.entries||[]).map(e=>brdClean(e.sum||e.title));
  return L.filter(Boolean).slice(0,2).map(x=>x.length>40?x.slice(0,39)+'…':x);
}
function renderBoards(){
  for(const ch of Object.values(W3.chars||{})){ const b=ch.elBrd; if(!b) continue; const a=byId[ch.id]; if(!a) continue;
    const d=docs[ch.id]; ch.urgent = (d && typeof d.urgent==='string') ? d.urgent.trim() : '';
    // 15 Nov, his rule: no text on the island. Only an agent that needs him shows a small 🙋 (and stands up); the reason is on its page.
    if(a.locked || !d || !ch.urgent){ b.hidden=true; continue; } b.hidden=false;
    b.classList.add('urg','hand'); b.title=ch.urgent; b.innerHTML='<span class="u">🙋</span>'; }
}
const _bp=new THREE.Vector3(), _bv=new THREE.Vector3();
// like placeLabel, but a board near the screen edge is pulled inside instead of hidden
function placeBoard(el, p, off){
  if(off){ el.style.visibility='hidden'; return null; }
  _bv.copy(p).applyMatrix4(W3.camera.matrixWorldInverse); if(_bv.z > -.5){ el.style.visibility='hidden'; return null; }
  const depth=-_bv.z; _bv.copy(p).project(W3.camera);
  const w=el.offsetWidth||100, h=el.offsetHeight||60;
  let sx=(_bv.x+1)/2*innerWidth, sy=(1-_bv.y)/2*innerHeight;
  sx=Math.min(innerWidth-w/2-6, Math.max(w/2+6, sx));
  sy=Math.min(innerHeight-40-h/2, Math.max(50+h/2, sy));   // clamp, never hide (every agent must show)
  el.style.transform='translate('+sx+'px,'+sy+'px) translate(-50%,-50%)'; el.style.visibility='visible';
  return {el, depth};
}
function placeBoards(){
  const taken=[...document.querySelectorAll('#labels .lab')].filter(e=>e.style.visibility==='visible').map(e=>e.getBoundingClientRect()).filter(()=>false);
  const hit=(r,q)=>r.left<q.right-1 && r.right>q.left+1 && r.top<q.bottom-1 && r.bottom>q.top+1, items=[];
  for(const ch of Object.values(W3.chars)){ const b=ch.elBrd; if(!b || b.hidden) continue;
    const a=byId[ch.id], ring=ch.kind!=='boss' && a && isFinite(a.x) && !b.classList.contains('hand'); if(ring){ _bp.set(a.x*1.5, 1.2, a.z*1.5); } else _bp.copy(ch.g.position);
    if(!ring) _bp.y += 4.1-(ch.seated?ch.drop*ch.g.scale.y*(1-(ch.up||0)):0)+1.1;
    const it=placeBoard(b, _bp, ch.hideLab); if(it){ it.u=ch.urgent?1:0; items.push(it); } }
  items.sort((a,b)=>(b.u-a.u)||(a.depth-b.depth));
  for(const it of items){ const r0=it.el.getBoundingClientRect(); let ok=null;
    const H=r0.height, W=r0.width, tries=[];
    for(const dx of [0, W*.6, -W*.6, W*1.1, -W*1.1]) for(const dy of [0, H*.6, -H*.6, H*1.05, -H*1.05, H*1.6, -H*1.6]) tries.push([dx,dy]);
    for(const [dx,dy] of tries){ const r={left:r0.left+dx,right:r0.right+dx,top:r0.top+dy,bottom:r0.bottom+dy};
      if(r.top>44 && r.bottom<innerHeight-36 && r.left>4 && r.right<innerWidth-4 && !taken.some(q=>hit(r,q))){ ok={r,dx,dy}; break; } }
    if(!ok) ok={r:r0,dx:0,dy:0};   // no free spot: keep it where it is (a small overlap beats a missing agent)
    if(ok.dx||ok.dy) it.el.style.transform += ' translate('+ok.dx+'px,'+ok.dy+'px)'; taken.push(ok.r); }
}

/* ---------- site mode (his My Planner site) ---------- */
(function(){
  const NAMES={knowledge:'منقسي',zory:'زوري',hurairy:'هريري',hamour:'هامور',hoot:'الحوت',saboor:'الصبور',yaryour:'يريور',zubaidi:'زبيدي',shaari:'شعري',fryalah:'فريالة'};
  const SITE={"knowledge":"mangsi","zory":"zoori","hurairy":"hariri","hamour":"hamour","hoot":"hoot","saboor":"saboor","yaryour":"yaryoor","zubaidi":"zubaidi","shaari":"shaari","fryalah":"faryala"}, HUB=Object.fromEntries(Object.entries(SITE).map(([h,s])=>[s,h]));
  const inFrame = window.parent && window.parent!==window;
  try{ $('liveTxt').textContent='موقعي'; $('liveChip').title='موقعي'; }catch(e){}
  const BAKED=[];
  setTimeout(()=>window.__feed(BAKED), 300);
  const own = openAgent;
  // quiet island (his rule, 15 Nov): no couriers, no toasts, no speech bubbles, no unboxing; only the 🙋 stand-up stays
  deliver = function(){}; toast = function(){}; say = function(){};
  for(const k of Object.keys(SITE)) unboxed.add(k);
  try{ const t=document.getElementById('toasts'); if(t) t.hidden=true; }catch(e){}
  openAgent = function(id){ if(inFrame){ parent.postMessage({type:'hq-open', agent: SITE[id]||id}, '*'); return; } own(id); };
  addEventListener('message', ev=>{
    const m=ev.data; if(!m || m.type!=='hq-feed' || !Array.isArray(m.agents)) return;
    const list=[];
    for(const r of m.agents){ const id=HUB[r.agent]||r.agent; if(!SITE[id]) continue;
      const base=docs[id]||{};
      const entries=Array.isArray(r.news)&&r.news.length ? r.news.map(n=>({date:n.date, title:n.sum, sum:n.sum, lines:[]})) : base.entries;
      list.push(Object.assign({}, base, {agent:id, name: base.name||NAMES[id], now: Array.isArray(r.now)? r.now : base.now, entries, urgent: typeof r.urgent==='string' ? r.urgent : '', updatedAt: r.updatedAt||base.updatedAt})); }
    if(list.length) window.__feed(list);
  });
  if(inFrame) parent.postMessage({type:'hq-ready'}, '*');
})();
