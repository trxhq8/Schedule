<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مقر الوكلاء</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600&display=swap">
<style>
:root{--gold:#e9c46a;--deep:#030d18}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--deep);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#back{position:fixed;inset:-60px;background-position:center;background-size:cover;filter:blur(34px) brightness(.42) saturate(1.15);transform:scale(1.08)}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 45%,rgba(2,8,16,.75) 100%)}
#stage{position:absolute;opacity:0;transition:opacity .9s ease;--u:.4}
#stage.ready{opacity:1}
#art{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:.6%;box-shadow:0 2vmin 6vmin rgba(0,0,0,.6)}
.spr,.stand,.dim,.tag,.plq{position:absolute}
.spr{transform-origin:50% 100%;transition:opacity .7s ease,transform .8s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.mv{position:absolute;inset:0;transform-origin:50% 100%;will-change:transform}
.spr img,.stand img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.spr.bob img{animation:bob 3.4s ease-in-out infinite}
.spr.lift img{transform-origin:50% 100%;animation:lift 2.2s ease-in-out infinite}
.spr.sway img{transform-origin:50% 100%;animation:sway 7s ease-in-out infinite}
.spr.breathe img{transform-origin:50% 85%;animation:breathe 4.8s ease-in-out infinite}
.spr.gone{opacity:0}
.spr.lean{transform:translateY(-2%) scale(1.1);animation:pulse 1.6s ease-in-out infinite}
.spr.lean img{transform-origin:50% 100%;animation:call .95s ease-in-out infinite}
.spr.lean.shaari{transform:translateY(-16%) scale(1.06)}
.dim{opacity:0;pointer-events:none;transition:opacity .9s ease;background:radial-gradient(ellipse at 50% 60%,rgba(4,12,26,.38),rgba(2,7,16,.62))}
.dim.on{opacity:1}
.stand{opacity:0;pointer-events:none;cursor:pointer;transition:left 1.1s cubic-bezier(.3,.75,.25,1),top 1.1s cubic-bezier(.3,.75,.25,1),width 1.1s cubic-bezier(.3,.75,.25,1),height 1.1s cubic-bezier(.3,.75,.25,1),opacity .45s ease;filter:drop-shadow(0 6px 6px rgba(0,0,0,.55))}
.stand.snap{transition:none}
.stand.on{opacity:1;pointer-events:auto}
.stand.on img{transform-origin:50% 100%;animation:wave 1.25s ease-in-out infinite}
.stand .spot{position:absolute;left:-30%;right:-30%;bottom:-6%;height:16%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,214,140,.6),rgba(255,190,90,0) 70%);pointer-events:none;animation:spot 1.25s ease-in-out infinite}
#labels{position:absolute;inset:0;pointer-events:none}
.tag{color:transparent;font-size:0;line-height:0;border-radius:1.4%;cursor:pointer;pointer-events:auto;transition:box-shadow .35s ease,background .35s ease}
.tag.empty{cursor:default}
@media (hover:hover){.tag:not(.empty):hover{box-shadow:inset 0 0 0 2px rgba(233,196,106,.6);background:rgba(255,226,160,.06)}}
.plq{translate:-50% -50%;pointer-events:none;white-space:nowrap;font-family:"Reem Kufi",Tahoma,sans-serif;font-weight:600;line-height:1;
  font-size:max(10px,calc(var(--u) * 30px));padding:.18em .7em .26em;border-radius:.35em;color:#2b1a07;
  background:linear-gradient(180deg,#f8e3a0 0%,#e2b75a 48%,#b9862f 100%);border:1px solid #6e4a14;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 .12em .35em rgba(0,0,0,.55);text-shadow:0 1px 0 rgba(255,240,200,.6);transition:box-shadow .4s ease,transform .4s ease}
.plq.call{animation:plq 1.25s ease-in-out infinite;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 .9em rgba(255,206,110,.95)}
.hand{position:absolute;translate:-50% -100%;font-size:max(12px,calc(var(--u) * 44px));line-height:1;padding:.24em .3em .28em;border-radius:999px;background:radial-gradient(circle at 35% 30%,#24496f,#0a1d33 70%);border:1.5px solid var(--gold);box-shadow:0 0 0 .22em rgba(233,196,106,.2),0 .25em .7em rgba(0,0,0,.5);pointer-events:auto;cursor:pointer;transform-origin:50% 100%;animation:handwave 1.1s ease-in-out infinite}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#fallback{position:fixed;inset:0;display:grid;place-items:center;font:15px Tahoma,sans-serif;color:#f3e3b8}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.8%)}}
@keyframes lift{0%,100%{transform:translateY(0) scaleY(1)}40%{transform:translateY(-2.6%) scaleY(1.02)}55%{transform:translateY(-2.6%) scaleY(1.02)}}
@keyframes sway{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.014,1.04)}}
@keyframes call{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-6%) rotate(-2.5deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-6%) rotate(2.5deg)}}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 2px rgba(255,222,150,.7)) drop-shadow(0 0 8px rgba(255,190,90,.35))}50%{filter:drop-shadow(0 0 4px rgba(255,226,160,1)) drop-shadow(0 0 20px rgba(255,190,90,.8))}}
@keyframes wave{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-7%) rotate(-4deg)}40%{transform:translateY(0) rotate(0)}60%{transform:translateY(-7%) rotate(4deg)}80%{transform:translateY(0) rotate(0)}}
@keyframes spot{0%,100%{opacity:.8;transform:scaleX(1)}20%,60%{opacity:.5;transform:scaleX(.82)}}
@keyframes handwave{0%,100%{transform:translateY(0) rotate(-14deg)}50%{transform:translateY(-26%) rotate(14deg)}}
@keyframes plq{0%,100%{transform:translateY(0)}50%{transform:translateY(-12%)}}
@media (prefers-reduced-motion:reduce){.spr img,.stand img,.hand,.plq,.spr.lean{animation:none!important}}
</style>
</head>
<body>
<div id="back"></div>
<div id="vig"></div>
<div id="stage"><img id="art" alt=""><div id="labels"></div></div>
<canvas id="gl"></canvas>
<div id="fallback" hidden>تعذّر تحميل المقر، حدّث الصفحة</div>

const $=id=>document.getElementById(id);
const pct=(v,t)=>(v/t*100)+'%';
const place=(el,b)=>{ el.style.left=pct(b.x,IW); el.style.top=pct(b.y,IH); el.style.width=pct(b.w,IW); el.style.height=pct(b.h,IH); };
const at=(el,x,y)=>{ el.style.left=pct(x,IW); el.style.top=pct(y,IH); };
const inFrame=window.parent&&window.parent!==window;
const stage=$('stage'), labels=$('labels'), art=$('art');
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------- build ---------- */
art.onerror=()=>{ $('fallback').hidden=false; };
art.onload=()=>{ stage.classList.add('ready'); };
art.src=ART.bg;
$('back').style.backgroundImage='url("'+ART.bg+'")';
const F={};
for(const [id,a] of Object.entries(A)){
  if(!a.spr) continue;
  const [key,x,y,w,h]=a.spr;
  const s=document.createElement('div'); s.className='spr '+id+(a.idle?' '+a.idle:''); place(s,{x,y,w,h});
  const mv=document.createElement('div'); mv.className='mv'; s.appendChild(mv);
  const im=new Image(); im.alt=''; im.decoding='async'; im.src=ART[key]; mv.appendChild(im); stage.insertBefore(s,labels);
  const [rx,ry,rw,rh]=a.room; const d=document.createElement('div'); d.className='dim'; place(d,{x:rx,y:ry,w:rw,h:rh}); stage.insertBefore(d,labels);
  let st=null; if(a.stand){ st=document.createElement('div'); st.className='stand';
    const sp=document.createElement('div'); sp.className='spot'; st.appendChild(sp);
    const si=new Image(); si.alt=''; si.decoding='async'; si.src=ART[a.stand[0]]; st.appendChild(si); st.onclick=()=>tap(id); }
  F[id]={a,spr:s,mv,dim:d,stand:st,urgent:'',on:false, dx:0,tdx:a.walk?rnd(a.walk[0],a.walk[1]):0,wait:rnd(.4,2),flip:1,moving:0,hop:0};
}
for(const id of Object.keys(F)) if(F[id].stand) stage.insertBefore(F[id].stand,labels);

  const [x,y,w,h]=a.room;
  const t=document.createElement('div'); t.className='tag'+(id==='empty'?' empty':''); t.textContent=a.name; t.setAttribute('role','button'); t.setAttribute('aria-label',a.name||'غرفة فاضية');
  place(t,{x,y,w,h}); t.onclick=()=>tap(id); labels.appendChild(t);
  let p=null; if(a.plq){ p=document.createElement('div'); p.className='plq'; p.textContent=a.name; at(p,a.plq[0],a.plq[1]); }
  const hd=document.createElement('div'); hd.className='hand'; hd.textContent='🙋'; hd.hidden=true; hd.onclick=()=>tap(id); labels.appendChild(hd);
  if(p) labels.appendChild(p);
  L[id]={t,h:hd,p};
}

/* ---------- fit (contain, centred) ---------- */
const cv=$('gl'), ctx=cv.getContext('2d');
let S=1, OX=0, OY=0;
function fit(){
  const vw=innerWidth, vh=innerHeight, pad=Math.max(6,Math.min(18,Math.min(vw,vh)*.025));
  S=Math.min((vw-2*pad)/IW,(vh-2*pad)/IH); const w=IW*S, h=IH*S; OX=(vw-w)/2; OY=(vh-h)/2;
  Object.assign(stage.style,{left:OX+'px',top:OY+'px',width:w+'px',height:h+'px'}); stage.style.setProperty('--u',S);
  const dpr=Math.min(1.5,window.devicePixelRatio||1); cv.width=Math.round(vw*dpr); cv.height=Math.round(vh*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',fit); fit();

/* ---------- needs-you: walk out to the glass, or call from his place ---------- */
function standBoxes(id){
  const f=F[id], a=f.a, [, w0, h0]=a.stand, [,x,y,w,h]=a.spr, r=a.room;
  const H=r[3]*(id==='knowledge'?.6:.66), W=H*w0/h0, cx=r[0]+r[2]*(a.cx||.5);
  const ws=h*w0/h0, sx=x+f.dx+w/2;
  return { from:{x:sx-ws/2,y,w:ws,h}, to:{x:cx-W/2,y:a.front-H,w:W,h:H} };
}
function setUrgent(id,on){
  const f=F[id]; if(!f) return; on=!!on; if(f.on===on) return; f.on=on;
  if(f.stand){
    const b=standBoxes(id);
    if(on){ f.stand.classList.add('snap'); place(f.stand,b.from); void f.stand.offsetWidth; f.stand.classList.remove('snap');
      f.spr.classList.add('gone'); f.dim.classList.add('on'); f.stand.classList.add('on'); place(f.stand,b.to); }
    else { place(f.stand,b.from); f.stand.classList.remove('on'); f.spr.classList.remove('gone'); f.dim.classList.remove('on'); }
  } else f.spr.classList.toggle('lean',on);
  L[id].h.hidden=!on; if(L[id].p) L[id].p.classList.toggle('call',on); if(on) moveHand(id);
}
function moveHand(id){
  const f=F[id], a=f.a; let x,y;
  if(f.stand){ const t=standBoxes(id).to; x=t.x+t.w*.5; y=t.y-8; }
  else { [x,y]=a.head; y-=id==='shaari'?70:30; }
  at(L[id].h,x,y);
}

/* ---------- taps: the fish hops, a little burst, then his page opens ---------- */
const bursts=[];
function tap(id){
  if(!id||id==='empty') return; const f=F[id];
  if(f){ f.hop=.5; const a=f.a; let bx,by;
    if(f.on&&f.stand){ const t=standBoxes(id).to; bx=t.x+t.w/2; by=t.y+t.h*.35; } else { const [,x,y,w,h]=a.spr; bx=x+f.dx+w/2; by=y+h*.35; }
    bursts.push({x:bx,y:by,t:0}); }
  setTimeout(()=>openAgent(id),f?380:0);
}
function openAgent(id){ const key=SITE[id]||id; if(inFrame) parent.postMessage({type:'hq-open',agent:key},'*'); else console.log('hq-open',key); }

/* ---------- data ---------- */
const docs={};
function feed(list){ for(const d of list||[]){ const id=HUB[d.agent]||d.agent; if(!F[id]) continue; docs[id]=d; const u=(typeof d.urgent==='string'?d.urgent.trim():''); F[id].urgent=u; L[id].h.title=u; setUrgent(id,!!u); } }
window.__feed=feed;
addEventListener('message',ev=>{ const m=ev.data; if(!m||m.type!=='hq-feed'||!Array.isArray(m.agents)) return; feed(m.agents); });
feed(BAKED);
if(inFrame) parent.postMessage({type:'hq-ready'},'*');

/* ---------- life: strolling, room details, bubbles, light ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const BLD={x0:58,x1:1702,y0:58,y1:2296};
const bubbles=[]; for(let i=0;i<46;i++) bubbles.push(newBubble(true));
function newBubble(any){ return {x:Math.random(), y:any?Math.random():1.05+Math.random()*.2, r:1+Math.random()*3.2, v:.018+Math.random()*.04, ph:Math.random()*6.3}; }
const LAMPS=[[390,240,95,1],[1375,245,95,1],[430,745,48,.8],[567,745,48,.8],[1300,740,55,.8],[1520,782,70,.9],[945,1150,60,.7],[1180,1150,60,.7],
  [365,1545,52,.7],[725,1655,52,.7],[995,1665,52,.7],[1137,2100,75,1],[335,1925,40,.8],[302,2040,40,.8],[1365,1925,40,.8],[1440,2010,40,.8],[1350,2085,40,.8],[1040,420,70,.55]];
const STARS=[[805,1920],[908,1975],[955,1925],[1000,1985],[1045,1945],[870,1912]];
const RAYS=[[180,90,.9],[430,150,.7],[760,120,.6],[1150,170,.55],[1520,110,.8]];
// room details, one per agent
const STEAM=[[1072,384],[900,452],[942,452],[996,452]];
const GLINT=[[1505,1146],[1538,1150],[1512,1203],[1530,1262],[1372,1300],[1398,1296],[1356,1306]];
const pollen=[]; for(let i=0;i<26;i++) pollen.push({x:rnd(170,1050),y:rnd(1470,1780),ph:rnd(0,6.3),s:rnd(.6,1.4)});
const dust=[]; for(let i=0;i<22;i++) dust.push({x:rnd(540,840),y:rnd(1240,1395),ph:rnd(0,6.3),v:rnd(4,12)});
const motes=[]; for(let i=0;i<14;i++) motes.push({x:rnd(1330,1420),y:rnd(1450,1780),ph:rnd(0,6.3)});
const zzz=[]; let zzzNext=0;
let flashAt=rnd(3,6), sparkAt=rnd(4,8), sparks=[];

let last=0, hidden=false; document.addEventListener('visibilitychange',()=>{ hidden=document.hidden; if(!hidden){ last=0; requestAnimationFrame(tick);} });
function tick(now){
  if(hidden) return; requestAnimationFrame(tick); if(last&&now-last<33) return; const dt=last?Math.min(.1,(now-last)/1000):.033; last=now; const t=now/1000;
  // strolling and hops
  for(const [id,f] of Object.entries(F)){
    const a=f.a; let ty=0;
    if(a.walk&&!f.on&&!reduce){
      if(f.wait>0) f.wait-=dt;
      else { const d=f.tdx-f.dx; if(Math.abs(d)<1){ f.moving=0; f.tdx=rnd(a.walk[0],a.walk[1]); f.wait=rnd(2,6); }
        else { const step=Math.sign(d)*Math.min(Math.abs(d),34*dt); f.dx+=step; f.moving=1; f.flip=(Math.sign(d)*(a.face||1))<0?-1:1; } }
      if(f.moving) ty=-Math.abs(Math.sin(t*8))*2.2;
    }
    if(f.hop>0){ f.hop=Math.max(0,f.hop-dt); ty-=Math.sin(Math.PI*(1-f.hop/.5))*14; }
    const w=a.spr[3];
    f.mv.style.transform='translate('+(f.dx/w*100).toFixed(2)+'%,'+ty.toFixed(2)+'%) scaleX('+f.flip+')';
  }
  const vw=innerWidth, vh=innerHeight; ctx.clearRect(0,0,vw,vh);
  const X=x=>OX+x*S, Y=y=>OY+y*S;
  ctx.save(); ctx.globalCompositeOperation='screen';
  // light from the surface
  for(const [x,w,k] of RAYS){ const sway=Math.sin(t*.12+x)*40, a=(.05+.03*Math.sin(t*.35+x*.01))*k;
    const g=ctx.createLinearGradient(0,Y(-40),0,Y(1500)); g.addColorStop(0,'rgba(170,220,255,'+a+')'); g.addColorStop(1,'rgba(170,220,255,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(X(x+sway),Y(-40)); ctx.lineTo(X(x+sway+w),Y(-40)); ctx.lineTo(X(x+sway+w*2.2+260),Y(1500)); ctx.lineTo(X(x+sway+260),Y(1500)); ctx.closePath(); ctx.fill(); }
  ctx.globalCompositeOperation='lighter';
  for(const [x,y,r,k] of LAMPS){ const a=(.13+.05*Math.sin(t*2.1+x*.07)+.025*Math.sin(t*5.3+y))*k, R=r*S*1.6;
    const g=ctx.createRadialGradient(X(x),Y(y),0,X(x),Y(y),R); g.addColorStop(0,'rgba(255,205,130,'+a+')'); g.addColorStop(1,'rgba(255,170,80,0)'); ctx.fillStyle=g; ctx.fillRect(X(x)-R,Y(y)-R,R*2,R*2); }
  for(const [x,y] of STARS){ const a=.35+.35*Math.sin(t*2.4+x*.05), R=Math.max(2,14*S);
    ctx.strokeStyle='rgba(255,230,170,'+a+')'; ctx.lineWidth=Math.max(.7,1.4*S); ctx.beginPath(); ctx.moveTo(X(x)-R,Y(y)); ctx.lineTo(X(x)+R,Y(y)); ctx.moveTo(X(x),Y(y)-R); ctx.lineTo(X(x),Y(y)+R); ctx.stroke(); }
  if(!reduce){
    // منقسي: steam from the dallah and the cups
    ctx.globalCompositeOperation='screen';
    for(let i=0;i<STEAM.length;i++){ const [x,y]=STEAM[i];
      for(let k=0;k<3;k++){ const p=((t*.35+i*.27+k/3)%1), yy=y-p*90, xx=x+Math.sin(t*1.6+k*2+i)*9*(.4+p);
        const a=(1-p)*p*.55, R=Math.max(1.5,(8+p*16)*S); const g=ctx.createRadialGradient(X(xx),Y(yy),0,X(xx),Y(yy),R); g.addColorStop(0,'rgba(255,248,235,'+a+')'); g.addColorStop(1,'rgba(255,248,235,0)'); ctx.fillStyle=g; ctx.fillRect(X(xx)-R,Y(yy)-R,R*2,R*2); } }
    // الصبور: the laptop screen flickers softly
    { const a=.16+.06*Math.sin(t*3.1)+.04*Math.sin(t*11.7), R=60*S; const g=ctx.createRadialGradient(X(1450),Y(838),0,X(1450),Y(838),R); g.addColorStop(0,'rgba(170,215,255,'+a+')'); g.addColorStop(1,'rgba(170,215,255,0)'); ctx.fillStyle=g; ctx.fillRect(X(1450)-R,Y(838)-R,R*2,R*2); }
    // هامور: a warm light over the open mushaf
    { const a=.14+.06*Math.sin(t*1.3), R=80*S; const g=ctx.createRadialGradient(X(912),Y(880),0,X(912),Y(880),R); g.addColorStop(0,'rgba(255,224,150,'+a+')'); g.addColorStop(1,'rgba(255,224,150,0)'); ctx.fillStyle=g; ctx.fillRect(X(912)-R,Y(880)-R,R*2,R*2); }
    // زوري: the camera flashes now and then
    flashAt-=dt; if(flashAt<0){ flashAt=rnd(6,11); }
    { const ph=flashAt; if(ph>0&&ph<.28){ const a=(ph/.28)*.9, R=150*S; const g=ctx.createRadialGradient(X(1122),Y(1220),0,X(1122),Y(1220),R); g.addColorStop(0,'rgba(255,255,255,'+a+')'); g.addColorStop(.25,'rgba(230,245,255,'+a*.5+')'); g.addColorStop(1,'rgba(255,255,255,0)'); ctx.fillStyle=g; ctx.fillRect(X(1122)-R,Y(1220)-R,R*2,R*2); } }
    // زبيدي: the gold glints
    for(let i=0;i<GLINT.length;i++){ const [x,y]=GLINT[i]; const p=(t*.5+i*.37)%3; if(p<.5){ const a=Math.sin(p/.5*Math.PI), R=Math.max(2.5,18*S*a);
      ctx.strokeStyle='rgba(255,240,180,'+(a*.95)+')'; ctx.lineWidth=Math.max(.8,1.6*S); ctx.beginPath(); ctx.moveTo(X(x)-R,Y(y)); ctx.lineTo(X(x)+R,Y(y)); ctx.moveTo(X(x),Y(y)-R); ctx.lineTo(X(x),Y(y)+R); ctx.stroke(); } }
    // يريور: sawdust in the air
    for(const d of dust){ d.y-=d.v*dt*.4; if(d.y<1230) d.y=1395; const xx=d.x+Math.sin(t*.9+d.ph)*10, a=.35+.25*Math.sin(t*2+d.ph);
      ctx.fillStyle='rgba(255,226,170,'+a+')'; ctx.beginPath(); ctx.arc(X(xx),Y(d.y),Math.max(.8,2.4*S),0,6.283); ctx.fill(); }
    // الحوت: a spark from the wrench now and then
    sparkAt-=dt; if(sparkAt<0){ sparkAt=rnd(4,9); for(let i=0;i<9;i++) sparks.push({x:290,y:1238,vx:rnd(-90,90),vy:rnd(-140,-30),l:rnd(.35,.7),t:0}); }
    sparks=sparks.filter(s=>(s.t+=dt)<s.l); for(const s of sparks){ s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=320*dt; const a=1-s.t/s.l; ctx.fillStyle='rgba(255,210,120,'+a+')'; ctx.beginPath(); ctx.arc(X(s.x),Y(s.y),Math.max(.8,2.2*S),0,6.283); ctx.fill(); }
    // فريالة: glowing pollen over the greenhouse
    for(const p of pollen){ const xx=p.x+Math.sin(t*.5+p.ph)*14, yy=p.y+Math.cos(t*.4+p.ph)*10, a=.25+.25*Math.sin(t*1.7+p.ph);
      ctx.fillStyle='rgba(220,255,180,'+a+')'; ctx.beginPath(); ctx.arc(X(xx),Y(yy),Math.max(.8,2.6*S*p.s),0,6.283); ctx.fill(); }
    // the empty room: dust turning in its light shaft
    for(const m of motes){ const xx=m.x+Math.sin(t*.3+m.ph)*18, yy=m.y+Math.sin(t*.2+m.ph)*22, a=.2+.18*Math.sin(t+m.ph);
      ctx.fillStyle='rgba(255,250,230,'+a+')'; ctx.beginPath(); ctx.arc(X(xx),Y(yy),Math.max(.7,1.8*S),0,6.283); ctx.fill(); }
  }
  // a slow sheen across the front glass every ~16 s
  const ph=(t%16)/16; if(ph<.32){ const p=ph/.32, cx=-500+p*(IW+1000);
    const g=ctx.createLinearGradient(X(cx-260),0,X(cx+260),0); g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(.5,'rgba(220,240,255,.06)'); g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.globalCompositeOperation='screen'; ctx.fillStyle=g; ctx.save(); ctx.beginPath(); ctx.rect(X(BLD.x0),Y(BLD.y0),(BLD.x1-BLD.x0)*S,(BLD.y1-BLD.y0)*S); ctx.clip(); ctx.fillRect(X(cx-260),Y(BLD.y0),520*S,(BLD.y1-BLD.y0)*S); ctx.restore(); }
  // tap bursts
  ctx.globalCompositeOperation='lighter';
  for(let i=bursts.length-1;i>=0;i--){ const b=bursts[i]; b.t+=dt; if(b.t>.7){ bursts.splice(i,1); continue; } const p=b.t/.7;
    for(let k=0;k<12;k++){ const ang=k/12*6.283, r=(30+p*90); const x=b.x+Math.cos(ang)*r, y=b.y+Math.sin(ang)*r*.8;
      ctx.fillStyle='rgba(255,220,140,'+(1-p)+')'; ctx.beginPath(); ctx.arc(X(x),Y(y),Math.max(1,4*S*(1-p*.5)),0,6.283); ctx.fill(); } }
  ctx.restore();
  // شعري: z z z float up from his pillow
  if(!reduce){ if(t>zzzNext){ zzz.push({t:0,x:790,y:1995}); zzzNext=t+1.6; }
    ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
    for(let i=zzz.length-1;i>=0;i--){ const z=zzz[i]; z.t+=dt; if(z.t>3.2){ zzz.splice(i,1); continue; } if(F.shaari&&F.shaari.on) continue; const p=z.t/3.2;
      const x=z.x+p*70+Math.sin(z.t*2)*8, y=z.y-p*120, a=Math.sin(p*Math.PI)*.85;
      ctx.font='600 '+Math.max(8,(18+p*16)*S)+'px "Reem Kufi",Tahoma,sans-serif'; ctx.fillStyle='rgba(220,232,255,'+a+')'; ctx.fillText('z',X(x),Y(y)); }
    ctx.restore(); }
  // bubbles rise in the open water around the palace
  if(!reduce) for(const b of bubbles){ b.y-=b.v*dt*(vh/600); const px=b.x*vw+Math.sin(t*1.3+b.ph)*4, py=b.y*vh;
    if(b.y<-.05){ Object.assign(b,newBubble(false)); continue; }
    const ix=(px-OX)/S, iy=(py-OY)/S; if(ix>BLD.x0&&ix<BLD.x1&&iy>BLD.y0&&iy<BLD.y1) continue;
    const r=b.r*Math.max(.8,S*2.2); ctx.strokeStyle='rgba(200,235,255,.55)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(px,py,r,0,6.283); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.5)'; ctx.beginPath(); ctx.arc(px-r*.35,py-r*.35,r*.28,0,6.283); ctx.fill(); }
}
requestAnimationFrame(tick);
})();
</script>
