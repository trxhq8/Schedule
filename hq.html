<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مقر الوكلاء</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600&display=swap">
<style>
:root{--ink:#f3e3b8;--tag:#1c140e}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#0b2238;touch-action:none;-webkit-user-select:none;user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-family:"Reem Kufi",Tahoma,sans-serif;font-size:13px;line-height:1;padding:4px 10px 5px;border-radius:7px;background:var(--tag);color:var(--ink);border:1.5px solid #c9a14a;border-bottom:3px solid var(--c,#c9a14a);white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.45);pointer-events:auto;cursor:pointer}
.hand{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-size:20px;line-height:1;padding:3px 7px;border-radius:99px;background:#b5533a;color:#fff;border:1.5px solid #f0d58a;box-shadow:0 1px 4px rgba(0,0,0,.4);pointer-events:auto;cursor:pointer}
@media (max-width:520px){.tag{font-size:10.5px;padding:3px 6px 4px}.hand{font-size:15px;padding:2px 5px}}
#fallback{position:fixed;inset:0;display:grid;place-items:center;font-family:Tahoma,sans-serif;color:var(--ink)}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div id="fallback" hidden>المقر يحتاج متصفح يدعم 3D</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const BAKED=[];   // the repo is public: real data arrives only via hq-feed after he signs in
const SITE={knowledge:'mangsi',zory:'zoori',hurairy:'hariri',hamour:'hamour',hoot:'hoot',saboor:'saboor',yaryour:'yaryoor',zubaidi:'zubaidi',shaari:'shaari',fryalah:'faryala'};
const HUB=Object.fromEntries(Object.entries(SITE).map(([h,s])=>[s,h]));
// the hotel (15 Nov, his floors): Mangsi on top, then Hurairy/Hamour/Saboor, Hoot/Yaryour/Zory/Zubaidi, Fryalah + an empty room, Shaari at the bottom
const FLOORS=[
  ['knowledge'],
  ['hurairy','hamour','saboor'],
  ['hoot','yaryour','zory','zubaidi'],
  ['fryalah','empty'],
  ['shaari'],
];
const A={
  knowledge:{name:'منقسي',c:'#c9a14a'}, hurairy:{name:'هريري',c:'#d0683f'}, hamour:{name:'هامور',c:'#2f9a82'}, saboor:{name:'الصبور',c:'#7a7fd0'},
  hoot:{name:'الحوت',c:'#4f93b5'}, yaryour:{name:'يريور',c:'#b8914f'}, zory:{name:'زوري',c:'#c9628f'}, zubaidi:{name:'زبيدي',c:'#5fa25a'},
  fryalah:{name:'فريالة',c:'#7cab4e'}, shaari:{name:'شعري',c:'#5b6fc0'}, empty:{name:'',c:'#7d7468'}
};
const inFrame = window.parent && window.parent!==window;
const $=id=>document.getElementById(id);
if(!window.THREE){ $('fallback').hidden=false; return; }
let renderer; try{ renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true}); }catch(e){ $('fallback').hidden=false; return; }
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();
const NAVY=new THREE.Color('#0b2238');
scene.background=NAVY; scene.fog=new THREE.Fog(NAVY, 34, 80);
const camera=new THREE.PerspectiveCamera(30,1,.1,200);
scene.add(new THREE.HemisphereLight('#c4d8f0','#4a3020',.62));
scene.add(new THREE.AmbientLight('#ffffff',.12));
const key=new THREE.DirectionalLight('#ffe2b0',.55); key.position.set(3,16,12); scene.add(key);
const M=(c,o={})=>new THREE.MeshLambertMaterial(Object.assign({color:new THREE.Color(c)},o));
const P=(c,o={})=>new THREE.MeshPhongMaterial(Object.assign({color:new THREE.Color(c),shininess:40,specular:new THREE.Color('#3a3326')},o));
const BRASS=P('#c9a14a',{shininess:70,specular:new THREE.Color('#fff0c0')});
const WOOD=M('#45250f'), WOOD2=M('#5a3015'), WOODL=M('#8a5a32');
const box=(w,h,d,m)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
const cyl=(rt,rb,h,m,s=16)=>new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,s),m);
const sph=(r,m,s=16)=>new THREE.Mesh(new THREE.SphereGeometry(r,s,Math.max(8,s*.75|0)),m);
const shade=(hex,k,sat=1)=>{ const c=new THREE.Color(hex); const hsl={}; c.getHSL(hsl); c.setHSL(hsl.h,Math.min(1,hsl.s*sat),Math.max(0,Math.min(.95,hsl.l+k))); return c; };
const css=c=>'#'+c.getHexString();

/* ---------- textures ---------- */
function canvasTex(w,h,draw,rep){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=4; if(rep){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep[0],rep[1]); } return t; }
// sadu weave: horizontal bands of triangles, diamonds and fine stripes on the room's own dark base colour
function sadu(base, deep){
  return canvasTex(256,256,(x,w,h)=>{
    const b=deep||css(shade(base,-.26,.9)), cream='#efe1bd', black='#1d1512', gold='#c9a14a', red=css(shade('#a3342a',0));
    x.fillStyle=b; x.fillRect(0,0,w,h);
    const band=(y,hh,f)=>{ x.save(); x.translate(0,y); f(hh); x.restore(); };
    const stripes=(y)=>{ x.fillStyle=gold; x.fillRect(0,y,w,3); x.fillStyle=cream; x.fillRect(0,y+5,w,2); x.fillStyle=black; x.fillRect(0,y+9,w,3); };
    const tri=(y,hh,col,up)=>{ x.fillStyle=col; const n=8, s=w/n; for(let i=0;i<n;i++){ x.beginPath(); if(up){ x.moveTo(i*s,y+hh); x.lineTo(i*s+s/2,y); x.lineTo(i*s+s,y+hh);} else { x.moveTo(i*s,y); x.lineTo(i*s+s/2,y+hh); x.lineTo(i*s+s,y);} x.closePath(); x.fill(); } };
    const dia=(y,hh,col,in2)=>{ const n=6, s=w/n; for(let i=0;i<n;i++){ const cx=i*s+s/2, cy=y+hh/2; x.fillStyle=col; x.beginPath(); x.moveTo(cx,y); x.lineTo(cx+s*.42,cy); x.lineTo(cx,y+hh); x.lineTo(cx-s*.42,cy); x.closePath(); x.fill(); x.fillStyle=in2; x.beginPath(); x.moveTo(cx,y+hh*.28); x.lineTo(cx+s*.18,cy); x.lineTo(cx,y+hh*.72); x.lineTo(cx-s*.18,cy); x.closePath(); x.fill(); } };
    stripes(6); band(0,0,()=>{}); tri(22,22,black,true); tri(44,22,cream,false);
    stripes(70); dia(86,48,red,cream);
    stripes(140); tri(156,20,gold,true); tri(176,20,black,false);
    stripes(202); dia(218,30,cream,b);
  },[1,1]);
}
const raysTex=canvasTex(64,256,(x,w,h)=>{ const g=x.createLinearGradient(0,0,0,h); g.addColorStop(0,'rgba(190,225,255,.9)'); g.addColorStop(.55,'rgba(150,200,255,.25)'); g.addColorStop(1,'rgba(150,200,255,0)'); x.fillStyle=g; x.fillRect(0,0,w,h); const s=x.createLinearGradient(0,0,w,0); s.addColorStop(0,'rgba(0,0,0,1)'); s.addColorStop(.5,'rgba(0,0,0,0)'); s.addColorStop(1,'rgba(0,0,0,1)'); x.globalCompositeOperation='destination-out'; x.fillStyle=s; x.fillRect(0,0,w,h); });
const backTex=canvasTex(8,256,(x,w,h)=>{ const g=x.createLinearGradient(0,0,0,h); g.addColorStop(0,'#1d4a73'); g.addColorStop(.5,'#123557'); g.addColorStop(1,'#08192b'); x.fillStyle=g; x.fillRect(0,0,w,h); });
function signTex(text){ return canvasTex(256,96,(x,w,h)=>{ x.fillStyle='#2a1c12'; x.fillRect(0,0,w,h); x.strokeStyle='#c9a14a'; x.lineWidth=6; x.strokeRect(5,5,w-10,h-10); x.fillStyle='#e9d39a'; x.font='600 44px "Reem Kufi", Tahoma, sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.direction='rtl'; x.fillText(text,w/2,h/2+4); }); }

/* ---------- the tank ---------- */
const W=7.8, FH=2.62, D=2.9, GAP=.16, H=FLOORS.length*FH;
const tank=new THREE.Group(); scene.add(tank);
// deep water backdrop
const backdrop=new THREE.Mesh(new THREE.PlaneGeometry(80,46),new THREE.MeshBasicMaterial({map:backTex,fog:false})); backdrop.position.set(0,H/2+2,-14); scene.add(backdrop);
// floor slabs: dark wood with a brass edge at the front
for(let i=0;i<=FLOORS.length;i++){ const y=H-i*FH; const s=box(W+.34,GAP,D+.24,WOOD); s.position.set(0,y,0); tank.add(s); const e=box(W+.36,.045,.05,BRASS); e.position.set(0,y+GAP/2-.01,D/2+.13); tank.add(e); }
// carved frame columns + brass bands
for(const x of [-W/2-.2,W/2+.2]){ for(const z of [-D/2-.12,D/2+.12]){ const p=box(.3,H+.2,.3,WOOD2); p.position.set(x,H/2,z); tank.add(p); }
  for(let i=0;i<=FLOORS.length;i++){ const r=box(.36,.08,.36,BRASS); r.position.set(x,H-i*FH,D/2+.12); tank.add(r); }
  for(let i=0;i<FLOORS.length;i++){ const k=box(.12,.5,.04,BRASS); k.position.set(x,H-i*FH-FH/2,D/2+.28); tank.add(k); } }
// cornice: stepped wood + brass + Kuwaiti merlons
const c1=box(W+1.1,.36,D+.7,WOOD2); c1.position.set(0,H+.26,0); tank.add(c1);
const c2=box(W+1.3,.1,D+.85,BRASS); c2.position.set(0,H+.48,0); tank.add(c2);
const c3=box(W+.9,.26,D+.5,WOOD); c3.position.set(0,H+.66,0); tank.add(c3);
const merl=13; for(let i=0;i<merl;i++){ const x=-W/2-.2+i*(W+.4)/(merl-1); const m=box(.28,.32,.28,WOOD2); m.position.set(x,H+.95,D/2+.05); tank.add(m); const tip=new THREE.Mesh(new THREE.ConeGeometry(.17,.22,4),BRASS); tip.rotation.y=Math.PI/4; tip.position.set(x,H+1.22,D/2+.05); tank.add(tip); }
const dome=new THREE.Mesh(new THREE.SphereGeometry(.55,20,12,0,Math.PI*2,0,Math.PI/2),BRASS); dome.position.set(0,H+.8,0); tank.add(dome);
const fin=new THREE.Mesh(new THREE.ConeGeometry(.06,.4,8),BRASS); fin.position.set(0,H+1.55,0); tank.add(fin);
// plinth
const pl=box(W+1.2,.42,D+.9,WOOD2); pl.position.set(0,-.22,0); tank.add(pl); const plb=box(W+1.25,.08,D+.95,BRASS); plb.position.set(0,.0,0); tank.add(plb);
// sand, rocks and kelp at both sides
const sand=box(30,.4,12,M('#5d5a4e')); sand.position.set(0,-.62,0); scene.add(sand);
const rockM=[M('#3b4652'),M('#46505a'),M('#2f3943')];
for(let i=0;i<26;i++){ const side=i%2?1:-1; const r=new THREE.Mesh(new THREE.DodecahedronGeometry(.2+Math.random()*.45,0),rockM[i%3]); r.position.set(side*(W/2+.9+Math.random()*3.6),-.35+Math.random()*.25,(Math.random()-.4)*4); r.rotation.set(Math.random()*3,Math.random()*3,0); scene.add(r); }
const kelp=[]; for(const side of [-1,1]) for(let i=0;i<7;i++){ const g=new THREE.Group(); const m=M(i%2?'#2f6b4f':'#3d7d58'); const n=5+(i%3)*2;
  for(let k=0;k<n;k++){ const seg=box(.12,.62,.05,m); seg.position.y=.3+k*.58; seg.rotation.z=(k%2?.08:-.08); g.add(seg); const lf=box(.26,.12,.04,m); lf.position.set((k%2?.14:-.14),.4+k*.58,0); lf.rotation.z=(k%2?-.5:.5); g.add(lf); }
  g.position.set(side*(W/2+.75+i*.42+Math.random()*.2),-.45,(Math.random()-.5)*2.4); g.userData.ph=Math.random()*6; scene.add(g); kelp.push(g); }
// glass: a faint front pane (never hit by taps)
const glass=new THREE.Mesh(new THREE.PlaneGeometry(W+.3,H+.2),new THREE.MeshBasicMaterial({color:'#bfe4ff',transparent:true,opacity:.05,depthWrite:false}));
glass.position.set(0,H/2,D/2+.14); tank.add(glass);
// light from above: soft slanted rays in front of the tank
const rays=[]; for(let i=0;i<6;i++){ const m=new THREE.MeshBasicMaterial({map:raysTex,transparent:true,opacity:.1,depthWrite:false,blending:THREE.AdditiveBlending,fog:false});
  const r=new THREE.Mesh(new THREE.PlaneGeometry(.9+Math.random()*.9,H+5),m); r.position.set(-W/2+.4+i*(W-.8)/5,H/2+1.6,D/2+.9+Math.random()*.6); r.rotation.z=.16+Math.random()*.1; r.userData.ph=Math.random()*6; scene.add(r); rays.push(r); }

/* ---------- rooms ---------- */
const rooms={}, hits=[], lamps=[];
function archFront(w,h){
  const s=new THREE.Shape(); s.moveTo(-w/2,0); s.lineTo(w/2,0); s.lineTo(w/2,h); s.lineTo(-w/2,h); s.closePath();
  const iw=w-.26, top=h-.3, cr=Math.min(.55,iw/3.2), hole=new THREE.Path();
  hole.moveTo(-iw/2,0); hole.lineTo(-iw/2,top-cr); hole.quadraticCurveTo(-iw/2,top,-iw/2+cr,top); hole.lineTo(-.22,top); hole.lineTo(0,top+.14); hole.lineTo(.22,top); hole.lineTo(iw/2-cr,top); hole.quadraticCurveTo(iw/2,top,iw/2,top-cr); hole.lineTo(iw/2,0); hole.closePath();
  s.holes.push(hole); return new THREE.ExtrudeGeometry(s,{depth:.08,bevelEnabled:false});
}
function room(id, x, y, w){
  const a=A[id], g=new THREE.Group(); g.position.set(x,y,0); tank.add(g);
  const empty=id==='empty', hh=FH-GAP;
  // back wall: wainscot below, sadu weave above, in the room's own colour
  const wain=box(w-.06,.78,.08,empty?M('#2b2420'):M(shade(a.c,-.34,.7))); wain.position.set(0,GAP/2+.39,-D/2+.04); g.add(wain);
  const sm=empty? M('#3a332e') : M('#ffffff',{map: id==='shaari'? sadu(a.c,'#16224a') : sadu(a.c)});
  const up=box(w-.06,hh-.78,.08,sm); up.position.set(0,GAP/2+.78+(hh-.78)/2,-D/2+.04); g.add(up);
  const rail=box(w-.06,.06,.06,BRASS); rail.position.set(0,GAP/2+.8,-D/2+.1); g.add(rail);
  const floor=box(w-.06,.04,D,M(empty?'#2a2420':shade(a.c,-.18,.5))); floor.position.set(0,GAP/2+.02,0); g.add(floor);
  // side walls: carved dark wood
  for(const s of [-1,1]){ const sw=box(.08,hh,D,WOOD); sw.position.set(s*(w/2-.04),FH/2,0); g.add(sw); }
  // arched front opening + brass keystone
  const ar=new THREE.Mesh(archFront(w,hh),WOOD2); ar.position.set(0,GAP/2,D/2-.04); g.add(ar);
  const ks=box(.16,.16,.05,BRASS); ks.position.set(0,GAP/2+hh-.12,D/2+.05); g.add(ks);
  // hanging lantern with a soft warm light (none in the empty room)
  if(!empty){ const lx=(id==='knowledge'? -1.6 : -w*.22), ly=GAP/2+hh-.12;
    const ch=cyl(.008,.008,.34,BRASS,4); ch.position.set(lx,ly-.17,.15); g.add(ch);
    const body=cyl(.09,.12,.22,BRASS,6); body.position.set(lx,ly-.44,.15); g.add(body);
    const glow=sph(.075,new THREE.MeshBasicMaterial({color:'#ffd690'}),10); glow.position.set(lx,ly-.44,.15); g.add(glow);
    const cap=new THREE.Mesh(new THREE.ConeGeometry(.12,.12,6),BRASS); cap.position.set(lx,ly-.28,.15); g.add(cap);
    const pl=new THREE.PointLight(id==='shaari'?'#9fb3ff':'#ffc47a', id==='shaari'?.55:.75, 3.6, 2); pl.position.set(lx,ly-.6,.4); g.add(pl); lamps.push({glow,pl,ph:Math.random()*6,base:pl.intensity});
    if(id==='knowledge'){ const l2=g.children.slice(-5).map(o=>{ const c=o.clone(); c.position.x=-o.position.x; g.add(c); return c; }); lamps.push({glow:l2[2],pl:l2[4],ph:2,base:.75}); }
  }
  // invisible hit box for taps (the whole room)
  const hit=box(w,FH,D+.3,new THREE.MeshBasicMaterial({visible:false})); hit.position.set(0,FH/2,0); hit.userData.agent=id; g.add(hit); if(!empty) hits.push(hit);
  const s=Math.min(1,w/2.6); const pg=new THREE.Group(); pg.scale.setScalar(s); pg.position.y=GAP/2; g.add(pg);
  rooms[id]={g,x,y,w,s}; props(id,pg,w/s);
  return g;
}
function desk(g,x,z,top){ const t=box(1,.07,.5,WOODL); t.position.set(x,.72,z); g.add(t); for(const dx of [-.42,.42]) for(const dz of [-.18,.18]){ const l=box(.06,.7,.06,WOOD2); l.position.set(x+dx,.36,z+dz); g.add(l); } }
function cushion(g,x,z,w,c){ const cu=box(w,.24,.42,M(c)); cu.position.set(x,.14,z); g.add(cu); const back=box(w,.46,.16,M(shade(c,-.08))); back.position.set(x,.36,z-.22); g.add(back); }
function plant(g,x,z,s,c){ const pot=cyl(.15*s,.11*s,.24*s,M('#a85f3c')); pot.position.set(x,.12*s,z); g.add(pot); for(let k=0;k<3;k++){ const lf=sph(.2*s,M(c||(k%2?'#4f8f43':'#68a852')),10); lf.position.set(x+(k-1)*.1*s,.38*s+k*.05*s,z+(k%2)*.05); lf.scale.set(1,1.15,.9); g.add(lf); } }
function props(id,g,w){
  const a=A[id], c=a.c, Z=-D/2+.5;
  if(id==='empty'){ const crate=box(.6,.48,.5,M('#5a4634')); crate.position.set(.5,.24,-.35); g.add(crate);
    const sign=new THREE.Mesh(new THREE.PlaneGeometry(.9,.34),new THREE.MeshBasicMaterial({map:signTex('قريباً')})); sign.position.set(-.2,1.25,-D/2+.1); g.add(sign); return; }
  if(id==='knowledge'){ // majlis: red sadu rug, floor cushions on three sides, dallah and finjans, brass lanterns
    const rug=box(4.4,.03,1.9,M('#ffffff',{map:sadu('#a3342a')})); rug.position.set(0,.03,.05); g.add(rug);
    cushion(g,-2.5,-D/2+.55,1.6,'#9a2f24'); cushion(g,2.5,-D/2+.55,1.6,'#9a2f24'); cushion(g,-1.1,-D/2+.55,1.0,'#7e2620'); cushion(g,1.1,-D/2+.55,1.0,'#7e2620');
    for(const x of [-3.2,3.2]){ const arm=box(.3,.3,.3,M('#c9a14a')); arm.position.set(x,.15,-D/2+.6); g.add(arm); }
    const tray=cyl(.42,.42,.04,BRASS,24); tray.position.set(.9,.08,.55); g.add(tray);
    const dal=cyl(.08,.17,.34,BRASS); dal.position.set(.75,.27,.5); g.add(dal); const lid=new THREE.Mesh(new THREE.ConeGeometry(.1,.18,12),BRASS); lid.position.set(.75,.53,.5); g.add(lid); const sp=new THREE.Mesh(new THREE.ConeGeometry(.035,.3,8),BRASS); sp.rotation.z=1.1; sp.position.set(.95,.36,.5); g.add(sp);
    for(const x of [1.05,1.2]){ const cup=cyl(.05,.035,.08,M('#f3ead8')); cup.position.set(x,.14,.62); g.add(cup); }
    const incense=cyl(.1,.07,.18,BRASS,8); incense.position.set(-1.1,.12,.5); g.add(incense);
    return; }
  if(id==='hurairy'){ // gym
    const bench=box(1,.1,.34,M('#2b2b2b')); bench.position.set(-.55,.42,Z+.25); g.add(bench); const bl=box(.1,.38,.3,M('#444')); bl.position.set(-.55,.2,Z+.25); g.add(bl);
    const bar=cyl(.025,.025,1.5,M('#aaa'),8); bar.rotation.z=Math.PI/2; bar.position.set(-.55,1.0,Z-.05); g.add(bar); for(const s of [-1,1]){ const pl=cyl(.2,.2,.08,M('#222'),16); pl.rotation.z=Math.PI/2; pl.position.set(-.55+s*.62,1.0,Z-.05); g.add(pl); const up=box(.06,1,.06,M('#555')); up.position.set(-.55+s*.5,.5,Z-.1); g.add(up); }
    for(let i=0;i<3;i++){ const db=cyl(.07,.07,.3,M('#2b2b2b'),10); db.rotation.z=Math.PI/2; db.position.set(.55+i*.2,.12,Z+.1); g.add(db); }
    const bottle=cyl(.07,.07,.28,M('#7fc2e6')); bottle.position.set(.95,.14,.6); g.add(bottle); const mat=box(.9,.02,.5,M(c)); mat.position.set(.25,.02,.55); g.add(mat); }
  else if(id==='hamour'){ // Qur'an study: bookshelves, rahl, warm lamp, prayer rug
    for(let r=0;r<3;r++){ const sh=box(1,.05,.3,WOODL); sh.position.set(-.65,.55+r*.5,Z-.05); g.add(sh); for(let b=0;b<6;b++){ const bk=box(.12,.36,.24,M(['#2f8a72','#8c2f2f','#c9a14a','#24406a','#6a3f2a','#2f8a72'][b])); bk.position.set(-1.0+b*.14,.76+r*.5,Z-.05); g.add(bk); } }
    const rug=box(1.2,.02,.8,M('#ffffff',{map:sadu('#1f6b5a')})); rug.position.set(.45,.02,.35); g.add(rug);
    const rahl=new THREE.Group(); for(const s of [-1,1]){ const p=box(.42,.03,.5,WOODL); p.rotation.x=s*.55; p.position.set(0,.2,s*.1); rahl.add(p); } rahl.position.set(.45,.1,.35); g.add(rahl);

    for(const x of [-.38,.38]) for(const z of [-.3,.3]){ const wh=cyl(.14,.14,.1,M('#1d1d1d'),14); wh.rotation.x=Math.PI/2; wh.position.set(x,.14,z); car.add(wh); } car.position.set(-.35,0,Z+.25); g.add(car);
    const tire=new THREE.Mesh(new THREE.TorusGeometry(.24,.1,10,20),M('#222')); tire.position.set(.95,.34,Z-.1); g.add(tire);
    const tb=box(.5,.26,.28,M('#b5533a')); tb.position.set(.75,.13,.55); g.add(tb); const oil=cyl(.08,.08,.22,M('#d9a43a')); oil.position.set(1.05,.11,.5); g.add(oil); }
  else if(id==='yaryour'){ // wood workshop
    const wb=box(1.3,.08,.5,M('#b08a5c')); wb.position.set(-.2,.72,Z+.1); g.add(wb); for(const dx of [-.55,.55]){ const l=box(.08,.7,.45,WOOD2); l.position.set(-.2+dx,.36,Z+.1); g.add(l); }
    for(let i=0;i<4;i++){ const pl=box(.08,1.2,.22,M(i%2?'#cfa877':'#b88f5f')); pl.position.set(1.0-i*.12,.6,Z-.15); pl.rotation.z=.12; g.add(pl); }
    const saw=box(.4,.03,.12,M('#bbb')); saw.position.set(-.4,.78,Z+.1); g.add(saw); const hm=box(.28,.06,.08,M('#555')); hm.position.set(.05,.8,Z+.15); g.add(hm);
    const board=box(.9,.5,.03,WOODL); board.position.set(-.2,1.45,-D/2+.11); g.add(board); for(let i=0;i<4;i++){ const tl=box(.04,.3,.02,M('#666')); tl.position.set(-.5+i*.2,1.45,-D/2+.13); g.add(tl); } }
  else if(id==='zory'){ // camera studio: tripod + camera, ring light, softbox
    const tri=new THREE.Group(); for(let k=0;k<3;k++){ const leg=cyl(.015,.015,1.1,M('#222'),6); leg.position.y=.5; leg.rotation.z=.2; const p=new THREE.Group(); p.rotation.y=k*2.1; p.add(leg); tri.add(p); } tri.position.set(-.5,0,Z+.45); g.add(tri);
    const cam=box(.32,.22,.18,M('#1d1d1d')); cam.position.set(-.5,1.12,Z+.45); g.add(cam); const lens=cyl(.08,.08,.14,M('#333'),12); lens.rotation.x=Math.PI/2; lens.position.set(-.5,1.12,Z+.6); g.add(lens);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(.3,.04,8,24),new THREE.MeshBasicMaterial({color:'#fff3dc'})); ring.position.set(.6,1.3,Z); g.add(ring); const st=cyl(.02,.02,1.1,M('#222'),6); st.position.set(.6,.55,Z); g.add(st);
    const pouf=cyl(.24,.24,.3,M(c)); pouf.position.set(.15,.15,.55); g.add(pouf); }
  else if(id==='zubaidi'){ // money office: safe, desk, coin stacks
    const safe=box(.6,.66,.48,M('#4c5655')); safe.position.set(-.65,.33,Z); g.add(safe); const door=box(.5,.56,.02,M('#5d6766')); door.position.set(-.65,.34,Z+.25); g.add(door); const dial=cyl(.09,.09,.03,BRASS); dial.rotation.x=Math.PI/2; dial.position.set(-.65,.4,Z+.27); g.add(dial);
    desk(g,.35,Z+.2); for(let i=0;i<3;i++){ const s=cyl(.09,.09,.06+i*.05,BRASS,12); s.position.set(.15+i*.2,.78+(.06+i*.05)/2,Z+.2); g.add(s); }
    const ledger=box(.32,.04,.24,M('#2f5a3a')); ledger.position.set(.62,.78,Z+.2); g.add(ledger); }
  else if(id==='fryalah'){ // greenhouse: pots, a tall tree, a warm grow light
    for(let i=0;i<5;i++) plant(g,-1.3+i*.62,Z+(i%2)*.45,1.1+(i%3)*.15);
    const trunk=cyl(.05,.07,1.2,M('#6b4f30')); trunk.position.set(1.3,.6,Z-.05); g.add(trunk); for(let k=0;k<4;k++){ const lf=sph(.32,M(k%2?'#4f8f43':'#68a852'),10); lf.position.set(1.3+(k-1.5)*.18,1.3+(k%2)*.12,Z-.05); lf.scale.set(1.4,.6,1); g.add(lf); }
    const gl=box(1.6,.05,.12,new THREE.MeshBasicMaterial({color:'#ffcf9a'})); gl.position.set(0,1.85,0); g.add(gl); const glp=new THREE.PointLight('#ffb98a',.6,3.2,2); glp.position.set(0,1.6,.3); g.add(glp);
    const can=cyl(.1,.12,.2,M('#5d7f9a')); can.position.set(.55,.1,.65); g.add(can); }
  else if(id==='shaari'){ // night dream room: crescent bed, stars, moon
    const moon=new THREE.Mesh(new THREE.TorusGeometry(.32,.08,8,20,Math.PI*1.25),new THREE.MeshBasicMaterial({color:'#f2e2a6'})); moon.position.set(-2.4,1.6,-D/2+.14); moon.rotation.z=.6; g.add(moon);
    for(let i=0;i<14;i++){ const s=sph(.035+(i%3)*.012,new THREE.MeshBasicMaterial({color:'#fff1c4'}),6); s.position.set(-3.3+i*.5,1.3+Math.sin(i*1.7)*.42,-D/2+.14); g.add(s); s.userData.tw=Math.random()*6; stars.push(s); }
    const bed=new THREE.Mesh(new THREE.TorusGeometry(.7,.24,10,24,Math.PI),M('#e9d79a')); bed.rotation.z=Math.PI; bed.position.set(.9,.95,Z+.45); bed.scale.set(1,.55,1); g.add(bed);
    const quilt=box(1.2,.12,.62,M('#3a4f9a')); quilt.position.set(.9,.6,Z+.45); g.add(quilt); const pil=box(.36,.14,.4,M('#eef0fb')); pil.position.set(1.35,.7,Z+.45); g.add(pil);
    const neb=box(.3,.4,.3,WOODL); neb.position.set(-.6,.2,Z+.2); g.add(neb); const nl=sph(.08,new THREE.MeshBasicMaterial({color:'#b8c8ff'}),10); nl.position.set(-.6,.5,Z+.2); g.add(nl); }
  if(['hoot','yaryour','zory','fryalah','shaari','hurairy'].includes(id)) {} // their own props stand in for a desk
}
const stars=[];
FLOORS.forEach((ids,fi)=>{ const y=H-(fi+1)*FH; const n=ids.length, w=W/n; const x0=-W/2+w/2; ids.forEach((id,i)=>room(id,x0+i*w,y,w)); });

/* ---------- fish: round, big-eyed, one clear colour each ---------- */
const chars={};
function fish(id){
  const a=A[id], g=new THREE.Group(), body=new THREE.Group(); g.add(body);
  const skin=P(shade(a.c,.04,1.1)), belly=P(shade(a.c,.32,.6)), dark=P(shade(a.c,-.14,1.1));
  const torso=sph(.36,skin,22); torso.scale.set(1,1.08,.9); torso.position.y=.66; body.add(torso);
  const bel=sph(.28,belly,16); bel.scale.set(.9,.95,.5); bel.position.set(0,.6,.19); body.add(bel);
  const tail=new THREE.Mesh(new THREE.ConeGeometry(.22,.36,5),dark); tail.rotation.x=-Math.PI/2; tail.position.set(0,.6,-.42); body.add(tail);
  const dfin=new THREE.Mesh(new THREE.ConeGeometry(.1,.3,5),dark); dfin.position.set(0,1.08,-.08); dfin.rotation.x=-.25; body.add(dfin);
  for(const s of [-1,1]){ const e=sph(.12,M('#ffffff'),14); e.position.set(s*.15,.86,.26); e.scale.z=.7; body.add(e); const p=sph(.07,M('#151b1f'),12); p.position.set(s*.15,.86,.335); body.add(p); const hl=sph(.025,new THREE.MeshBasicMaterial({color:'#ffffff'}),6); hl.position.set(s*.15+.025,.895,.395); body.add(hl);
    const ch=sph(.05,new THREE.MeshBasicMaterial({color:'#f2a39a',transparent:true,opacity:.55}),8); ch.scale.z=.3; ch.position.set(s*.24,.7,.29); body.add(ch); }
  const mouth=new THREE.Mesh(new THREE.TorusGeometry(.05,.014,6,12,Math.PI),M('#5b2e24')); mouth.rotation.z=Math.PI; mouth.position.set(0,.71,.33); body.add(mouth);
  const arms=[]; for(const s of [-1,1]){ const pv=new THREE.Group(); pv.position.set(s*.34,.7,0); const arm=new THREE.Mesh(new THREE.ConeGeometry(.08,.34,6),dark); arm.position.y=-.17; arm.rotation.z=Math.PI; pv.add(arm); pv.rotation.z=s*.35; body.add(pv); arms.push(pv); }
  for(const s of [-1,1]){ const l=cyl(.045,.045,.24,dark,6); l.position.set(s*.13,.14,0); g.add(l); const ft=box(.13,.05,.18,M('#2b2420')); ft.position.set(s*.13,.025,.04); g.add(ft); }
  if(id==='knowledge'){ // white dishdasha, brown bisht with gold trim, ghutra + agal
    const dish=cyl(.3,.4,.62,M('#f7f4ec'),20); dish.position.y=.42; body.add(dish);
    const bisht=new THREE.Mesh(new THREE.CylinderGeometry(.37,.48,.74,20,1,true,Math.PI*.18,Math.PI*1.64),M('#5a3b22',{side:THREE.DoubleSide})); bisht.position.y=.5; bisht.rotation.y=Math.PI; body.add(bisht);
    for(const s of [-1,1]){ const tr=box(.035,.7,.02,BRASS); tr.position.set(s*.13,.52,.36); tr.rotation.z=s*.12; body.add(tr); }
    const gh=new THREE.Mesh(new THREE.ConeGeometry(.42,.42,20,1,true),M('#fbf9f3',{side:THREE.DoubleSide})); gh.position.y=1.0; body.add(gh); const ghTop=sph(.3,M('#fbf9f3'),14); ghTop.scale.y=.55; ghTop.position.y=1.06; body.add(ghTop);
    const ag=new THREE.Mesh(new THREE.TorusGeometry(.22,.035,6,20),M('#151515')); ag.rotation.x=Math.PI/2; ag.position.y=1.17; body.add(ag);
    g.scale.setScalar(1.55); }
  else if(id==='saboor'){ for(const s of [-1,1]){ const gl=new THREE.Mesh(new THREE.TorusGeometry(.13,.016,6,16),M('#3a2a1e')); gl.position.set(s*.15,.86,.37); body.add(gl); } const br=box(.06,.016,.02,M('#3a2a1e')); br.position.set(0,.87,.38); body.add(br); }
  else if(id==='hoot'){ const cap=cyl(.24,.26,.13,M('#d58a2b')); cap.position.y=1.05; body.add(cap); const brim=box(.32,.03,.2,M('#d58a2b')); brim.position.set(0,1.0,.22); body.add(brim); }
  else if(id==='yaryour'){ const hat=sph(.28,M('#e8b93a'),14); hat.scale.y=.58; hat.position.y=1.04; body.add(hat); const vest=new THREE.Mesh(new THREE.CylinderGeometry(.37,.4,.36,18,1,true),M('#e9d23a',{side:THREE.DoubleSide})); vest.position.y=.6; body.add(vest); }
  else if(id==='zory'){ const cam=box(.18,.12,.07,M('#1d1d1d')); cam.position.set(0,.52,.34); body.add(cam); const strap=new THREE.Mesh(new THREE.TorusGeometry(.3,.012,4,20,Math.PI),M('#1d1d1d')); strap.position.set(0,.6,.12); body.add(strap); }
  else if(id==='hamour'){ const kum=cyl(.22,.25,.14,M('#f7f4ec'),16); kum.position.y=1.06; body.add(kum); }
  else if(id==='hurairy'){ const band=new THREE.Mesh(new THREE.TorusGeometry(.33,.03,6,20),M('#f0f0f0')); band.rotation.x=Math.PI/2; band.position.y=.96; body.add(band); }
  else if(id==='zubaidi'){ const tie=box(.06,.22,.02,M('#c9a14a')); tie.position.set(0,.55,.33); body.add(tie); }
  else if(id==='fryalah'){ const hat=new THREE.Mesh(new THREE.CylinderGeometry(.18,.42,.1,18),M('#d9c08a')); hat.position.y=1.06; body.add(hat); const top=cyl(.18,.2,.14,M('#d9c08a')); top.position.y=1.14; body.add(top); }
  else if(id==='shaari'){ const cap=new THREE.Mesh(new THREE.ConeGeometry(.22,.38,14),M('#2f3f8a')); cap.position.y=1.16; cap.rotation.z=-.3; body.add(cap); const pom=sph(.05,M('#f2e2a6'),8); pom.position.set(.1,1.34,0); body.add(pom); }
  return {g,body,arms};
}
// where each fish stands (room-local, nominal 2.6 room before the room's prop scale)
const SPOT={ knowledge:[0,-.15], hurairy:[.55,.3], hamour:[.05,.15], saboor:[.55,.1], hoot:[.75,.35], yaryour:[.55,.35], zory:[.15,.1], zubaidi:[.95,.1], fryalah:[.2,.25], shaari:[-1.6,.25] };
for(const ids of FLOORS) for(const id of ids){ if(id==='empty') continue; const r=rooms[id], f=fish(id), sp=SPOT[id]||[0,0];
  const sc=id==='knowledge'?1:(1.22*Math.max(.82,r.s)); if(id!=='knowledge') f.g.scale.setScalar(sc);
  f.g.position.set(r.x+sp[0]*r.s, r.y+GAP/2+.04, sp[1]); tank.add(f.g);
  const face = id==='knowledge'? 0 : -.55; f.g.rotation.y=face;
  chars[id]={...f, id, seatPos:f.g.position.clone(), face, urgent:'', up:0, seed:Math.random()*6, room:r, sc:id==='knowledge'?1.55:sc};
}

/* ---------- labels ---------- */
const labels={};
for(const id of Object.keys(chars)){ const t=document.createElement('div'); t.className='tag'; t.textContent=A[id].name; t.style.setProperty('--c',A[id].c); t.onclick=()=>openAgent(id); $('labels').appendChild(t);
  const h=document.createElement('div'); h.className='hand'; h.textContent='🙋'; h.hidden=true; h.onclick=()=>openAgent(id); $('labels').appendChild(h); labels[id]={t,h}; }
const _v=new THREE.Vector3();
function project(p,el){ _v.copy(p); _v.project(camera); const x=(_v.x+1)/2*innerWidth, y=(1-_v.y)/2*innerHeight; el.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px) translate(-50%,-50%)'; }

/* ---------- bubbles ---------- */
const bubbles=[]; const bm=new THREE.MeshPhongMaterial({color:'#dff2ff',transparent:true,opacity:.45,shininess:90});
for(let i=0;i<26;i++){ const b=sph(.035+Math.random()*.05,bm,8); const side=Math.random()<.5?-1:1; b.position.set(Math.random()<.35? side*(W/2+.6+Math.random()*1.5) : (Math.random()-.5)*W, Math.random()*H, D/2+.3+Math.random()*.5); b.userData.v=.25+Math.random()*.35; b.userData.ph=Math.random()*6; scene.add(b); bubbles.push(b); }

/* ---------- camera: fixed, the tank fills the frame ---------- */
const TOP=H+1.5, BOT=-.45;
function fit(){
  const w=innerWidth, h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h;
  const tW=W+.9, tH=TOP-BOT, vf=THREE.MathUtils.degToRad(camera.fov);
  const dH=(tH/2)/Math.tan(vf/2), dW=(tW/2)/(Math.tan(vf/2)*camera.aspect);
  const d=Math.max(dH,dW)*1.015+D/2;
  camera.position.set(0,(TOP+BOT)/2+.15,d); camera.lookAt(0,(TOP+BOT)/2,0); camera.updateProjectionMatrix();
}
addEventListener('resize',fit); fit();

/* ---------- taps ---------- */
const ray=new THREE.Raycaster(), nd=new THREE.Vector2(); let down=null;
function openAgent(id){ if(!id||id==='empty') return; const key=SITE[id]||id; if(inFrame) parent.postMessage({type:'hq-open',agent:key},'*'); else console.log('hq-open',key); }
$('gl').addEventListener('pointerdown',e=>{ down=[e.clientX,e.clientY]; });
$('gl').addEventListener('pointerup',e=>{ if(!down) return; const dx=e.clientX-down[0], dy=e.clientY-down[1]; down=null; if(dx*dx+dy*dy>144) return;
  nd.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(nd,camera); const hit=ray.intersectObjects(hits,false)[0]; if(hit) openAgent(hit.object.userData.agent); });

/* ---------- data ---------- */
const docs={};
function feed(list){ for(const d of list||[]){ const id=HUB[d.agent]||d.agent; if(!chars[id]) continue; docs[id]=d; chars[id].urgent=(typeof d.urgent==='string'?d.urgent.trim():''); labels[id].h.title=chars[id].urgent; } }
window.__feed=feed;
addEventListener('message',ev=>{ const m=ev.data; if(!m||m.type!=='hq-feed'||!Array.isArray(m.agents)) return; feed(m.agents); });
feed(BAKED);
if(inFrame) parent.postMessage({type:'hq-ready'},'*');

/* ---------- loop ---------- */
const clock=new THREE.Clock(); let hidden=false; document.addEventListener('visibilitychange',()=>{ hidden=document.hidden; });
const tmp=new THREE.Vector3();
function tick(){
  requestAnimationFrame(tick); if(hidden) return;
  const dt=Math.min(.05,clock.getDelta()), t=clock.elapsedTime;
  for(const b of bubbles){ b.position.y+=b.userData.v*dt; b.position.x+=Math.sin(t+b.userData.ph)*.002; if(b.position.y>TOP+.5) b.position.y=-.3; }
  for(const g of kelp){ g.rotation.z=Math.sin(t*.6+g.userData.ph)*.07; }
  for(const r of rays){ r.material.opacity=.07+Math.sin(t*.35+r.userData.ph)*.035; }
  for(const s of stars){ s.scale.setScalar(.8+Math.sin(t*2+s.userData.tw)*.25); }
  for(const L of lamps){ L.pl.intensity=L.base*(.92+Math.sin(t*2.3+L.ph)*.05); }
  for(const ch of Object.values(chars)){
    const u=ch.urgent?1:0; ch.up+=(u-ch.up)*Math.min(1,dt*1.6);
    const r=ch.room; tmp.set(r.x + (ch.id==='knowledge'?0:Math.max(-r.w/2+.5,Math.min(r.w/2-.5,0))), ch.seatPos.y, D/2-.38);
    ch.g.position.lerpVectors(ch.seatPos,tmp,ch.up);
    ch.g.rotation.y=ch.face+(0-ch.face)*ch.up;
    ch.body.position.y=Math.sin(t*1.6+ch.seed)*.018+(u?Math.abs(Math.sin(t*3+ch.seed))*.035*ch.up:0);
    ch.body.rotation.z=Math.sin(t*.8+ch.seed)*.025;
    const [L,R]=ch.arms; L.rotation.z=-.35+Math.sin(t*1.3+ch.seed)*.06; R.rotation.z=.35+ch.up*(2.5+Math.sin(t*4+ch.seed)*.35);
    const lab=labels[ch.id];
    tmp.set(r.x, r.y+GAP+.2, D/2+.1); project(tmp,lab.t);
    lab.h.hidden=!ch.urgent; if(ch.urgent){ tmp.copy(ch.g.position); tmp.y+=1.35*ch.sc; project(tmp,lab.h); }
  }
  camera.position.x=Math.sin(t*.13)*.08; camera.lookAt(0,(TOP+BOT)/2,0);
  renderer.render(scene,camera);
}
tick();
})();
</script>
