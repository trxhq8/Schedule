<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مقر الوكلاء</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600&display=swap">
<style>
:root{--gold:#e9c46a;--deep:#030d18}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--deep);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#back{position:fixed;inset:-60px;background-position:center;background-size:cover;filter:blur(34px) brightness(.42) saturate(1.15);transform:scale(1.08)}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 45%,rgba(2,8,16,.75) 100%)}
#stage{position:absolute;opacity:0;transition:opacity .9s ease;--u:.4}
#stage.ready{opacity:1}
#art{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:.6%;box-shadow:0 2vmin 6vmin rgba(0,0,0,.6)}
.spr,.stand,.dim,.tag,.plq{position:absolute}
.spr{transform-origin:50% 100%;transition:opacity .7s ease,transform .8s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.mv{position:absolute;inset:0;transform-origin:50% 100%;will-change:transform}
.spr img,.stand img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.spr.bob img{animation:bob 3.4s ease-in-out infinite}
.spr.lift img{transform-origin:50% 100%;animation:lift 2.2s ease-in-out infinite}
.spr.sway img{transform-origin:50% 100%;animation:sway 7s ease-in-out infinite}
.spr.breathe img{transform-origin:50% 85%;animation:breathe 4.8s ease-in-out infinite}
.spr.gone{opacity:0}
.spr.lean{transform:translateY(-2%) scale(1.1);animation:pulse 1.6s ease-in-out infinite}
.spr.lean img{transform-origin:50% 100%;animation:call .95s ease-in-out infinite}
.spr.lean.shaari{transform:translateY(-16%) scale(1.06)}
.dim{opacity:0;pointer-events:none;transition:opacity .9s ease;background:radial-gradient(ellipse at 50% 60%,rgba(4,12,26,.38),rgba(2,7,16,.62))}
.dim.on{opacity:1}
.stand{opacity:0;pointer-events:none;cursor:pointer;transition:left 1.1s cubic-bezier(.3,.75,.25,1),top 1.1s cubic-bezier(.3,.75,.25,1),width 1.1s cubic-bezier(.3,.75,.25,1),height 1.1s cubic-bezier(.3,.75,.25,1),opacity .45s ease;filter:drop-shadow(0 6px 6px rgba(0,0,0,.55))}
.stand.snap{transition:none}
.stand.on{opacity:1;pointer-events:auto}
.stand.on img{transform-origin:50% 100%;animation:wave 1.25s ease-in-out infinite}
.stand .spot{position:absolute;left:-30%;right:-30%;bottom:-6%;height:16%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,214,140,.6),rgba(255,190,90,0) 70%);pointer-events:none;animation:spot 1.25s ease-in-out infinite}
#labels{position:absolute;inset:0;pointer-events:none}
.tag{color:transparent;font-size:0;line-height:0;border-radius:1.4%;cursor:pointer;pointer-events:auto;transition:box-shadow .35s ease,background .35s ease}
.tag.empty{cursor:default}
@media (hover:hover){.tag:not(.empty):hover{box-shadow:inset 0 0 0 2px rgba(233,196,106,.6);background:rgba(255,226,160,.06)}}
.plq{translate:-50% -50%;pointer-events:none;white-space:nowrap;font-family:"Reem Kufi",Tahoma,sans-serif;font-weight:600;line-height:1;
  font-size:max(10px,calc(var(--u) * 30px));padding:.18em .7em .26em;border-radius:.35em;color:#2b1a07;
  background:linear-gradient(180deg,#f8e3a0 0%,#e2b75a 48%,#b9862f 100%);border:1px solid #6e4a14;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 .12em .35em rgba(0,0,0,.55);text-shadow:0 1px 0 rgba(255,240,200,.6);transition:box-shadow .4s ease,transform .4s ease}
.plq.call{animation:plq 1.25s ease-in-out infinite;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 .9em rgba(255,206,110,.95)}
.hand{position:absolute;translate:-50% -100%;font-size:max(12px,calc(var(--u) * 44px));line-height:1;padding:.24em .3em .28em;border-radius:999px;background:radial-gradient(circle at 35% 30%,#24496f,#0a1d33 70%);border:1.5px solid var(--gold);box-shadow:0 0 0 .22em rgba(233,196,106,.2),0 .25em .7em rgba(0,0,0,.5);pointer-events:auto;cursor:pointer;transform-origin:50% 100%;animation:handwave 1.1s ease-in-out infinite}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#fallback{position:fixed;inset:0;display:grid;place-items:center;font:15px Tahoma,sans-serif;color:#f3e3b8}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.8%)}}
@keyframes lift{0%,100%{transform:translateY(0) scaleY(1)}40%{transform:translateY(-2.6%) scaleY(1.02)}55%{transform:translateY(-2.6%) scaleY(1.02)}}
@keyframes sway{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.014,1.04)}}
@keyframes call{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-6%) rotate(-2.5deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-6%) rotate(2.5deg)}}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 2px rgba(255,222,150,.7)) drop-shadow(0 0 8px rgba(255,190,90,.35))}50%{filter:drop-shadow(0 0 4px rgba(255,226,160,1)) drop-shadow(0 0 20px rgba(255,190,90,.8))}}
@keyframes wave{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-7%) rotate(-4deg)}40%{transform:translateY(0) rotate(0)}60%{transform:translateY(-7%) rotate(4deg)}80%{transform:translateY(0) rotate(0)}}
@keyframes spot{0%,100%{opacity:.8;transform:scaleX(1)}20%,60%{opacity:.5;transform:scaleX(.82)}}
@keyframes handwave{0%,100%{transform:translateY(0) rotate(-14deg)}50%{transform:translateY(-26%) rotate(14deg)}}
@keyframes plq{0%,100%{transform:translateY(0)}50%{transform:translateY(-12%)}}
@media (prefers-reduced-motion:reduce){.spr img,.stand img,.hand,.plq,.spr.lean{animation:none!important}}
</style>
</head>
<body>
<div id="back"></div>
<div id="vig"></div>
<div id="stage"><img id="art" alt=""><div id="labels"></div></div>
<canvas id="gl"></canvas>
<div id="fallback" hidden>تعذّر تحميل المقر، حدّث الصفحة</div>

    const r=b.r*Math.max(.8,S*2.2); ctx.strokeStyle='rgba(200,235,255,.55)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(px,py,r,0,6.283); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.5)'; ctx.beginPath(); ctx.arc(px-r*.35,py-r*.35,r*.28,0,6.283); ctx.fill(); }
}

})();
